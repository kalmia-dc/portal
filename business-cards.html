<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>名刺管理 | カルミアDC</title><link rel="stylesheet" href="./business-cards.css"></head>
<body><header><a href="./index.html">← ポータルへ</a><h1>名刺管理</h1><p id="identity">利用許可を確認しています</p></header>
<main id="app" hidden><aside id="budget" hidden></aside><div class="toolbar"><label>氏名・会社・電話・メールを検索<input id="search" type="search" placeholder="検索語を入力"></label><button id="new">名刺を登録</button><button id="refresh">再読み込み</button><button id="export">CSV・画像をまとめて保存</button><button id="trash" hidden>ごみ箱</button></div><p id="status" role="status" aria-live="polite"></p><div class="layout"><section aria-label="名刺一覧"><p id="count"></p><div id="list"></div></section><section id="detail" aria-label="名刺の詳細"><p>一覧から名刺を選択してください。</p></section></div></main>
<dialog id="editor"><form id="form"><h2 id="edit-title">名刺を登録</h2><p>写真から読み取るか、項目を手入力してください。内容を確認してから保存します。</p><div class="photos"><label>表面の写真<input type="file" id="front" accept="image/jpeg,image/png" capture="environment"></label><label>裏面の写真<input type="file" id="back" accept="image/jpeg,image/png" capture="environment"></label></div><button type="button" id="ocr">選んだ写真から文字を読み取る</button><label>読み取った文字<textarea id="ocr-text" rows="5" readonly></textarea></label><p>氏名・会社名などを下の欄へ入力してください。電話番号とメールは空欄へ候補を補います。</p><div id="fields" class="fields"></div><p id="editor-status" role="status"></p><div id="duplicates"></div><footer><button type="button" id="cancel">キャンセル</button><button type="submit" id="save">保存する</button></footer></form></dialog>
<script type="module" src="./business-cards.mjs?v=20261023-3"></script></body></html>
