<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非公開経営数値 | カルミアデンタル ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #37b8a9;
    --mint-dark: #20796f;
    --sky: #3f8edb;
    --coral: #e65b5b;
    --amber: #d89226;
    --green: #2f9b65;
    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-alt: #eef6f8;
    --border: #d9e7ec;
    --text: #263238;
    --muted: #60727c;
    --shadow: 0 3px 14px rgba(31, 64, 74, .08);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Maru Gothic', system-ui, sans-serif;
    letter-spacing: 0;
  }

  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 60px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(31, 64, 74, .06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--text);
    text-decoration: none;
    font-weight: 900;
  }

  .title-wrap { min-width: 0; }
  h1 {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    line-height: 1.05;
    font-weight: 900;
  }

  .subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge, .mode-badge {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .mode-badge.admin {
    color: var(--mint-dark);
    background: #e6f7f4;
    border-color: #b9e7df;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    transition: border-color .15s, transform .15s, background .15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--mint);
    transform: translateY(-1px);
  }

  .btn.primary {
    border-color: var(--mint);
    background: var(--mint);
    color: #fff;
  }

  .btn.secondary { background: var(--surface-alt); }

  .btn.danger {
    border-color: #f1c2c2;
    color: #b43c3c;
    background: #fff5f5;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
  }

  main {
    width: min(1280px, calc(100% - 28px));
    margin: 18px auto 40px;
  }

  .guard-note {
    margin-bottom: 14px;
    padding: 12px 14px;
    border: 1px solid #efd39c;
    border-radius: var(--radius);
    background: #fff8e8;
    color: #7c5516;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.6;
  }

  .summary-board {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 16px;
    align-items: end;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .section-kicker {
    color: var(--mint-dark);
    font-size: 11px;
    font-weight: 900;
  }

  .summary-title {
    margin-top: 3px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 900;
  }

  .summary-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .summary-actions {
    display: grid;
    gap: 8px;
    justify-items: end;
  }

  .utility-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .utility-actions .btn {
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 160px 170px minmax(220px, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .field label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    outline: none;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .12);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    min-height: 88px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .stat-value {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
  }

  .stat-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .analysis-panel {
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .analysis-head {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 12px;
    align-items: end;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fbfdfe;
  }

  .analysis-controls {
    display: grid;
    grid-template-columns: 110px 220px;
    gap: 10px;
    align-items: end;
  }

  .analysis-body {
    display: grid;
    gap: 12px;
    padding: 14px;
  }

  .analysis-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .analysis-chip {
    min-height: 82px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .analysis-chip-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  .analysis-chip-value {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    line-height: 1;
    font-weight: 900;
  }

  .analysis-chip-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .chart-box {
    min-height: 320px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    overflow: hidden;
  }

  .analysis-chart {
    display: block;
    width: 100%;
    height: 320px;
  }

  .chart-axis {
    stroke: #b9ccd3;
    stroke-width: 1;
  }

  .chart-grid {
    stroke: #e7f0f3;
    stroke-width: 1;
  }

  .chart-label {
    fill: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .chart-line {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .chart-point {
    stroke: #fff;
    stroke-width: 2;
  }

  .chart-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 900;
    text-align: center;
    padding: 24px;
  }

  .analysis-legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 18px;
    height: 4px;
    border-radius: 999px;
  }

  .analysis-table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .analysis-table {
    min-width: 760px;
  }

  .analysis-table th,
  .analysis-table td {
    padding: 9px 10px;
    font-size: 12px;
  }

  .yoy {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 3px 7px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
  }

  .yoy.up {
    background: #e8f7ef;
    color: #19734a;
  }

  .yoy.down {
    background: #fff0f0;
    color: #b13b3b;
  }

  .yoy.flat {
    background: #eef7ff;
    color: #2f6797;
  }

  .pending-panel {
    margin-bottom: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .pending-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .pending-title {
    font-size: 14px;
    font-weight: 900;
  }

  .pending-sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .pending-count {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 4px 9px;
    border: 1px solid #efd39c;
    border-radius: 999px;
    background: #fff8e8;
    color: #7c5516;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
  }

  .pending-list {
    display: grid;
    gap: 8px;
  }

  .pending-card {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .pending-name {
    font-weight: 900;
  }

  .pending-meta,
  .pending-values {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
  }

  .pending-values {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .input-badge {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 3px 7px;
    border: 1px solid #efd39c;
    border-radius: 999px;
    background: #fff8e8;
    color: #7c5516;
    font-size: 11px;
    font-weight: 900;
  }

  .input-badge.value { border-color: #f1c2c2; background: #fff5f5; color: #a23a3a; }
  .input-badge.source { border-color: #c9e1f5; background: #eef7ff; color: #2f6797; }

  .pending-empty {
    padding: 10px 12px;
    border-radius: var(--radius);
    background: #eef9f4;
    color: #176d46;
    font-size: 13px;
    font-weight: 900;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fbfdfe;
  }

  .panel-title {
    font-weight: 900;
    font-size: 14px;
  }

  .panel-sub {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .table-wrap { overflow: auto; }

  table {
    width: 100%;
    min-width: 980px;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f7fbfc;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  td { font-size: 13px; }
  tr:hover td { background: #fbfefe; }

  .metric-main {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .metric-name {
    font-weight: 900;
    color: var(--text);
  }

  .metric-detail {
    max-width: 360px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .category-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 24px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    white-space: nowrap;
  }

  .num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    white-space: nowrap;
  }

  .actions-cell {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-width: 52px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-weight: 900;
  }

  .empty {
    padding: 34px 18px;
    text-align: center;
    color: var(--muted);
  }

  .empty strong {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 8px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 34, 40, .45);
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    width: min(760px, 100%);
    max-height: min(90vh, 820px);
    overflow: auto;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(10, 30, 40, .22);
  }

  .modal-head,
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-foot {
    border-top: 1px solid var(--border);
    border-bottom: 0;
    justify-content: flex-end;
    background: #fbfdfe;
  }

  .modal-title { font-weight: 900; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 16px;
  }

  .field.full { grid-column: 1 / -1; }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  .import-modal {
    width: min(980px, 100%);
  }

  .import-drop {
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 1px dashed #9fcbd3;
    border-radius: var(--radius);
    background: #f7fbfc;
  }

  .import-actions,
  .import-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .import-status {
    min-height: 24px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .import-status.error {
    color: #b43c3c;
  }

  .import-status.success {
    color: var(--green);
  }

  .import-preview {
    min-height: 120px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .import-candidate-list {
    display: grid;
    gap: 10px;
  }

  .import-candidate {
    display: grid;
    grid-template-columns: 28px minmax(110px, .85fr) minmax(160px, 1.2fr) minmax(90px, .7fr) minmax(70px, .55fr) minmax(120px, .9fr);
    gap: 10px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .import-candidate input,
  .import-candidate select {
    width: 100%;
    min-height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 8px;
  }

  .import-candidate-label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  .import-raw {
    grid-column: 2 / -1;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 80;
    display: none;
    transform: translateX(-50%);
    max-width: min(520px, calc(100% - 28px));
    padding: 10px 14px;
    border-radius: var(--radius);
    background: #20323a;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 13px;
    font-weight: 800;
  }

  .toast.show { display: block; }

  @media (max-width: 920px) {
    header { align-items: flex-start; flex-direction: column; }
    .header-actions { justify-content: flex-start; width: 100%; }
    .summary-board { grid-template-columns: 1fr; align-items: stretch; }
    .summary-actions { justify-items: stretch; }
    .utility-actions { justify-content: flex-start; }
    .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .analysis-head { grid-template-columns: 1fr; align-items: stretch; }
    .analysis-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .analysis-summary { grid-template-columns: 1fr; }
    .import-candidate {
      grid-template-columns: 28px minmax(0, 1fr);
    }

    .import-candidate > div:not(.import-raw) {
      grid-column: 2;
    }

    .import-raw {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 560px) {
    main { width: min(100% - 18px, 1280px); }
    .toolbar { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .analysis-controls { grid-template-columns: 1fr; }
    .analysis-chart { height: 260px; }
    .chart-box, .chart-empty { min-height: 260px; }
    .form-grid { grid-template-columns: 1fr; }
    .pending-card {
      grid-template-columns: 1fr;
      align-items: stretch;
    }
    .pending-card .btn { width: 100%; }
    .utility-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .btn { flex: 1 1 auto; }
    .user-badge, .mode-badge { max-width: 100%; }
  }

  @media print {
    header, .toolbar, .summary-actions, .panel-head .btn, .actions-cell, .modal-backdrop, .toast {
      display: none !important;
    }
    body { background: #fff; }
    main { width: 100%; margin: 0; }
    .panel, .stat { box-shadow: none; }
    table { min-width: 0; font-size: 10px; }
    th, td { padding: 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a class="back-link" href="./index.html" title="ポータルに戻る" aria-label="ポータルに戻る">←</a>
    <div class="title-wrap">
      <h1>非公開経営数値</h1>
      <div class="subtitle">管理者専用・スタッフ非公開データ</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="user-badge" id="userBadge">読み込み中</span>

function currentMonth(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function monthLabel(month) {
  if (!month || !month.includes('-')) return '-';
  const [y, m] = month.split('-');
  return `${y}年${Number(m)}月`;
}

function parseNumber(value) {
  if (value === null || value === undefined) return null;
  const text = String(value).replace(/,/g, '').trim();
  if (text === '') return null;
  const n = Number(text);
  return Number.isFinite(n) ? n : null;
}

function fmtNumber(value, unit = '') {
  const n = parseNumber(value);
  if (n === null) return '-';
  const formatted = Math.abs(n) >= 1000
    ? n.toLocaleString('ja-JP', { maximumFractionDigits: 2 })
    : String(Number(n.toFixed(2)));
  return unit ? `${formatted}${unit}` : formatted;
}

function canonicalMetricItem(item) {
  const text = String(item || '').trim();
  if (text === '自費売上' || text === '自費売上高') return '自費売上';
  if (text === '保険売上' || text === '保険売上高') return '保険売上';
  if (text === '物販売上' || text === '物販売上高') return '物販合計';
  if (text === '月間述べ患者数') return '月間延べ患者数';
  if (text === '1日平均来院数' || text === '１日平均来院数') return '一日平均来院数';
  if (text === '自費率') return '自費率';
  return text;
}

function canonicalMetricCategory(category, item = '') {
  const itemKey = canonicalMetricItem(item);
  if (['総売上', '保険売上', '自費売上', '物販合計'].includes(itemKey)) return '売上';
  if (['月間延べ患者数', '一日平均来院数', '初診', '再初診'].includes(itemKey)) return '患者数';
  if (['自費率', '保険点数', 'レセプト枚数', '平均点数'].includes(itemKey)) return '診療指標';

  const categoryKey = String(category || '').trim();
  if (categoryKey === '自費' || categoryKey === '保険') return '診療指標';
  return CATEGORY_ORDER.has(categoryKey) ? categoryKey : 'その他';
}

function normalizedMetricData(metric) {
  const item = canonicalMetricItem(metric.item);
  return {
    ...metric,
    item,
    category: canonicalMetricCategory(metric.category, item)
  };
}

function metricItemRank(item) {
  const itemKey = canonicalMetricItem(item);
  return METRIC_ITEM_ORDER_MAP.has(itemKey) ? METRIC_ITEM_ORDER_MAP.get(itemKey) : 1000;
}

function compareMetrics(a, b) {
  const categoryA = canonicalMetricCategory(a.category, a.item);
  const categoryB = canonicalMetricCategory(b.category, b.item);
  const categoryDiff = (CATEGORY_ORDER.get(categoryA) ?? 999) - (CATEGORY_ORDER.get(categoryB) ?? 999);
  if (categoryDiff) return categoryDiff;
  const itemDiff = metricItemRank(a.item) - metricItemRank(b.item);
  if (itemDiff) return itemDiff;
  return String(a.item || '').localeCompare(String(b.item || ''), 'ja');
}

function effectiveMetricsForMonth(month, overrides = []) {
  const map = new Map();
  monthMetrics(month).forEach(metric => {
    map.set(canonicalMetricItem(metric.item), metric);
  });
  overrides
    .filter(metric => metric.month === month)
    .forEach(metric => {
      map.set(canonicalMetricItem(metric.item), metric);
    });
  return map;
}

function calculatedSelfPayRateValue(month, overrides = []) {
  const metrics = effectiveMetricsForMonth(month, overrides);
  const selfPaySales = parseNumber(metrics.get('自費売上')?.value);
  const insuranceSales = parseNumber(metrics.get('保険売上')?.value);
  if (selfPaySales === null || insuranceSales === null || selfPaySales + insuranceSales <= 0) return '';
  return formatImportValue((selfPaySales / (selfPaySales + insuranceSales)) * 100, 2);
}

function selfPayRateMetricData(month, overrides = []) {
  const value = calculatedSelfPayRateValue(month, overrides);
  if (!value) return null;
  return {
    month,
    category: '診療指標',
    item: '自費率',
    value,
    unit: '%',
    source: '自費売上・保険売上から自動計算',
    note: '自費売上 ÷ (保険売上 + 自費売上) × 100'
  };
}

function addAutoSelfPayRateCandidates(candidates) {
  const result = [...candidates];
  const months = [...new Set(result.map(candidate => candidate.month).filter(Boolean))];
  months.forEach(month => {
    const data = selfPayRateMetricData(month, result);
    if (!data) return;
    const existingIndex = result.findIndex(candidate => candidate.month === month && canonicalMetricItem(candidate.item) === '自費率');
    const candidate = {
      enabled: true,
      ...data,
      sourceText: data.note
    };
    if (existingIndex >= 0) {
      result[existingIndex] = { ...result[existingIndex], ...candidate };
    } else {
      result.push(candidate);
    }
  });
  return result;
}

async function savePrivateMetricData(data) {
  const normalizedData = normalizedMetricData(data);
  const existing = findExistingMetric(normalizedData.month, normalizedData.item);
  const payload = {
    ...(existing || {}),
    ...normalizedData,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };
  delete payload.id;
  if (existing) {
    await set(ref(db, `${DB_PATH}/${existing.id}`), payload);
    return existing.id;
  }
  const newRef = push(ref(db, DB_PATH));
  await set(newRef, {
    ...payload,
    createdAt: Date.now(),
    createdBy: currentUser.name
  });
  return newRef.key;
}

function addMonths(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function halfYearStart(month) {
  const [year, monthNumber] = month.split('-').map(Number);
  if (monthNumber >= 6 && monthNumber <= 11) return `${year}-06`;
  if (monthNumber === 12) return `${year}-12`;
  return `${year - 1}-12`;
}

function periodMonths(month) {
  const start = halfYearStart(month);
  return Array.from({ length: 6 }, (_, index) => addMonths(start, index));
}

function monthShortLabel(month) {
  if (!month || !month.includes('-')) return '-';
  const [, m] = month.split('-');
  return `${Number(m)}月`;
}

function computedGoalAverage(goals, targetGoal, overrides = []) {
  const months = new Set(periodMonths(targetGoal.month));
  const rows = Object.entries(goals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => months.has(goal.month || ''))
    .filter(goal => goal.item === '自費率');
  overrides
    .filter(goal => months.has(goal.month || '') && goal.item === '自費率')
    .forEach(goal => {
      if (!rows.some(row => row.month === goal.month && row.item === goal.item)) {
        rows.push({ ...targetGoal, ...goal });
      }
    });
  const actualRows = rows
    .map(goal => {
      const override = overrides.find(item => item.month === goal.month && item.item === '自費率');
      const actualValue = override?.actualValue ?? goal.actualValue;
      return { ...goal, actualValue, actualNumber: parseNumber(actualValue) };
    })
    .filter(goal => goal.actualNumber !== null)
    .sort((a, b) => (a.month || '').localeCompare(b.month || ''));
  if (!actualRows.length) return { currentValue: '', history: [] };
  const average = actualRows.reduce((sum, goal) => sum + goal.actualNumber, 0) / actualRows.length;
  return {
    currentValue: formatImportValue(average, 2),
    history: actualRows.map(goal => ({ label: monthShortLabel(goal.month), value: goal.actualValue }))
  };
}

async function syncGoalSelfPayRate(month, value) {
  const snap = await get(ref(db, GOAL_DB_PATH));
  const goals = snap.val() || {};
  const entries = Object.entries(goals);
  const existing = entries.find(([, goal]) => goal.month === month && goal.item === '自費率');
  const id = existing?.[0];
  const current = existing?.[1] || {};
  const average = computedGoalAverage(goals, { ...current, month, item: '自費率' }, [{ month, item: '自費率', actualValue: value }]);
  const payload = {
    ...current,
    month,
    department: current.department || '全体',
    item: '自費率',
    unit: '%',
    direction: current.direction || 'up',
    detail: current.detail || '自費売上 ÷ (保険売上 + 自費売上)',
    currentValue: average.currentValue,
    targetValue: current.targetValue || '',
    actualValue: value,
    owner: current.owner || currentUser.name,
    note: current.note || '',
    history: average.history,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };
  if (id) {
    await set(ref(db, `${GOAL_DB_PATH}/${id}`), payload);
  } else {
    await push(ref(db, GOAL_DB_PATH), {
      ...payload,
      createdAt: Date.now(),
      createdBy: currentUser.name
    });
  }
}

async function syncSelfPayRateForMonth(month, overrides = []) {

  if (!data) return false;
  await savePrivateMetricData(data);
  await syncGoalSelfPayRate(month, data.value);

function filteredMetrics() {
  const month = document.getElementById('monthFilter').value || currentMonth();
  const category = document.getElementById('categoryFilter').value;
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  return Object.entries(allMetrics)
    .map(([id, metric]) => normalizedMetricData({ id, ...metric }))
    .filter(metric => (metric.month || '') === month)
    .filter(metric => category === 'all' || metric.category === category)
    .filter(metric => {
      if (!query) return true;
      return [metric.item, metric.note, metric.category, metric.source]
        .filter(Boolean)
        .join(' ')
        .toLowerCase()
        .includes(query);
    })
    .sort(compareMetrics);
}

function monthMetrics(month) {
  return Object.entries(allMetrics)
    .map(([id, metric]) => normalizedMetricData({ id, ...metric }))
    .filter(metric => metric.month === month)
    .sort(compareMetrics);
}

function render() {
  const month = document.getElementById('monthFilter').value || currentMonth();
  const metrics = filteredMetrics();
  const totalForMonth = monthMetrics(month);
  document.getElementById('summaryTitle').textContent = `${monthLabel(month)}の経営数値`;
  document.getElementById('summarySub').textContent = `${metrics.length}件表示 / 月内${totalForMonth.length}件`;
  document.getElementById('listTitle').textContent = `${monthLabel(month)} 経営数値一覧`;
  document.getElementById('listSub').textContent = `${metrics.length}件表示 / 月内${totalForMonth.length}件`;
  renderStats(totalForMonth);
  renderAnalysis();
  renderPendingMetrics(totalForMonth);
  renderTable(metrics, totalForMonth.length);
}

function missingMetricFields(metric) {
  const fields = [];
  if (parseNumber(metric.value) === null) fields.push({ key: 'value', label: '数値' });
  if (!String(metric.source || '').trim()) fields.push({ key: 'source', label: '確認元' });
  return fields;
}

function renderPendingMetrics(metrics) {
  const panel = document.getElementById('pendingPanel');
  if (!panel || !isAdmin()) return;
  const pending = metrics
    .map(metric => ({ ...metric, missingFields: missingMetricFields(metric) }))
    .filter(metric => metric.missingFields.length)
    .sort((a, b) => b.missingFields.length - a.missingFields.length || compareMetrics(a, b));
  const valueMissing = pending.filter(metric => metric.missingFields.some(field => field.key === 'value')).length;
  const sourceMissing = pending.filter(metric => metric.missingFields.some(field => field.key === 'source')).length;

  panel.innerHTML = `
    <div class="pending-head">
      <div>
        <div class="pending-title">入力待ち</div>
        <div class="pending-sub">未入力の経営数値をここから順番に入力できます</div>
      </div>
      <div class="pending-count">${pending.length}件</div>
    </div>
    ${pending.length ? `
      <div class="pending-sub" style="margin-bottom:8px">数値未入力 ${valueMissing}件 / 確認元未入力 ${sourceMissing}件</div>
      <div class="pending-list">${pending.map(pendingMetricCardHtml).join('')}</div>
    ` : '<div class="pending-empty">この月の入力待ちはありません</div>'}`;
}

function pendingMetricCardHtml(metric) {
  const fields = metric.missingFields
    .map(field => `<span class="input-badge ${field.key}">${escapeHtml(field.label)}未入力</span>`)
    .join('');
  return `
    <div class="pending-card">
      <div>
        <div class="pending-name">${escapeHtml(metric.item || '')}</div>
        <div class="pending-meta">${escapeHtml(metric.category || '-')} / ${escapeHtml(metric.month || '-')}</div>
        <div style="margin-top:6px">${fields}</div>
      </div>
      <div class="pending-values">
        <span>数値: ${pendingMetricValueHtml(metric.value, metric.unit)}</span>
        <span>確認元: ${metric.source ? escapeHtml(metric.source) : '<span class="input-badge source">未入力</span>'}</span>
      </div>
      <button class="btn primary" onclick="openMetricModal('${metric.id}')">入力</button>
    </div>`;
}

function pendingMetricValueHtml(value, unit = '') {
  return parseNumber(value) === null
    ? '<span class="input-badge value">未入力</span>'
    : `<span class="num">${fmtNumber(value, unit)}</span>`;
}

function renderStats(metrics) {
  const total = metrics.length;
  const filled = metrics.filter(m => parseNumber(m.value) !== null).length;
  const missing = total - filled;
  const categories = new Set(metrics.map(m => m.category).filter(Boolean)).size;
  const updated = metrics
    .map(m => m.updatedAt || m.createdAt || 0)
    .filter(Boolean)
    .sort((a, b) => b - a)[0];

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">登録数</div><div class="stat-value">${total}</div><div class="stat-note">対象月の件数</div></div>
    <div class="stat"><div class="stat-label">数値入力済み</div><div class="stat-value" style="color:var(--green)">${filled}</div><div class="stat-note">未入力 ${missing}件</div></div>
    <div class="stat"><div class="stat-label">区分数</div><div class="stat-value" style="color:var(--sky)">${categories}</div><div class="stat-note">対象月の分類数</div></div>
    <div class="stat"><div class="stat-label">最終更新</div><div class="stat-value" style="font-size:20px;color:var(--amber)">${updated ? new Date(updated).toLocaleDateString('ja-JP') : '-'}</div><div class="stat-note">月内データ</div></div>`;
}

function selectedAnalysisYear() {
  const input = document.getElementById('analysisYear');
  const year = Number(input?.value);
  const fallback = new Date().getFullYear();
  if (!Number.isInteger(year) || year < 2020 || year > 2100) {
    if (input) input.value = fallback;
    return fallback;
  }
  return year;
}

function selectedAnalysisMode() {
  const key = document.getElementById('analysisMode')?.value || 'sales';
  return ANALYSIS_MODES[key] || ANALYSIS_MODES.sales;
}

function yearMonths(year) {
  return Array.from({ length: 12 }, (_, index) => `${year}-${String(index + 1).padStart(2, '0')}`);
}

function metricValueMap() {
  const map = new Map();
  Object.entries(allMetrics)
    .map(([id, metric]) => normalizedMetricData({ id, ...metric }))
    .forEach(metric => {
      const value = parseNumber(metric.value);
      if (value === null) return;
      map.set(`${metric.month}|${canonicalMetricItem(metric.item)}`, value);
    });
  return map;
}

function metricValueFor(map, month, item) {
  return map.get(`${month}|${canonicalMetricItem(item)}`) ?? null;
}

function analysisValueFor(map, month, series) {
  if (series.key === 'patientUnitPrice') {
    const totalSales = metricValueFor(map, month, '総売上');
    const patientTotal = metricValueFor(map, month, '月間延べ患者数');
    if (totalSales === null || patientTotal === null || patientTotal <= 0) return null;
    return totalSales / patientTotal;
  }
  return metricValueFor(map, month, series.item);
}

function buildAnalysisSeries(mode, year, map) {
  const months = yearMonths(year);
  return mode.series.map(series => ({
    ...series,
    values: months.map(month => analysisValueFor(map, month, series))
  }));
}

function primarySeries(mode, seriesList) {
  return seriesList.find(series => series.key === mode.primaryKey) || seriesList[0];
}

function filledValues(values) {
  return values.filter(value => value !== null && Number.isFinite(value));
}

function aggregateValues(values, mode) {
  const filled = filledValues(values);
  if (!filled.length) return null;
  const total = filled.reduce((sum, value) => sum + value, 0);
  return mode.aggregate === 'avg' ? total / filled.length : total;
}

function latestValueIndex(values) {
  for (let index = values.length - 1; index >= 0; index--) {
    if (values[index] !== null && Number.isFinite(values[index])) return index;
  }
  return -1;
}

function compactAxisValue(value, unit) {
  const n = parseNumber(value);
  if (n === null) return '-';
  if (unit === '円' && Math.abs(n) >= 10000) return `${Number((n / 10000).toFixed(1))}万`;
  return fmtNumber(n, unit);
}

function formatAnalysisValue(value, unit) {
  if (value === null || value === undefined || !Number.isFinite(value)) return '-';
  return fmtNumber(value, unit);
}

function comparisonInfo(current, previous, unit) {
  if (current === null || !Number.isFinite(current)) return { text: '当年未入力', cls: '' };
  if (previous === null || !Number.isFinite(previous)) return { text: '前年なし', cls: '' };
  if (unit === '%') {
    const diff = current - previous;
    return {
      text: `${diff >= 0 ? '+' : ''}${Number(diff.toFixed(1))}pt`,
      cls: Math.abs(diff) < 0.05 ? 'flat' : diff > 0 ? 'up' : 'down'
    };
  }
  if (previous === 0) return { text: '比較不可', cls: '' };
  const rate = ((current - previous) / Math.abs(previous)) * 100;
  return {
    text: `${rate >= 0 ? '+' : ''}${Number(rate.toFixed(1))}%`,
    cls: Math.abs(rate) < 0.05 ? 'flat' : rate > 0 ? 'up' : 'down'
  };
}

function yoyCell(current, previous, unit) {
  const info = comparisonInfo(current, previous, unit);
  return `<span class="yoy ${info.cls}">${escapeHtml(info.text)}</span>`;
}

function renderAnalysis() {
  const summary = document.getElementById('analysisSummary');
  const chartBox = document.getElementById('analysisChartBox');
  const legend = document.getElementById('analysisLegend');
  const tableWrap = document.getElementById('analysisTableWrap');
  if (!summary || !chartBox || !legend || !tableWrap) return;

  const year = selectedAnalysisYear();
  const mode = selectedAnalysisMode();
  const map = metricValueMap();
  const currentSeries = buildAnalysisSeries(mode, year, map);
  const previousSeries = buildAnalysisSeries(mode, year - 1, map);
  const months = yearMonths(year);

  document.getElementById('analysisSub').textContent = `${year}年1月〜12月 / ${mode.label}`;
  renderAnalysisSummary(summary, mode, currentSeries, previousSeries, months, year);
  renderAnalysisChart(chartBox, mode, currentSeries);
  renderAnalysisLegend(legend, currentSeries);
  renderAnalysisTable(tableWrap, mode, currentSeries, previousSeries, months, year);
}

function renderAnalysisSummary(container, mode, currentSeries, previousSeries, months, year) {
  const primary = primarySeries(mode, currentSeries);
  const previousPrimary = primarySeries(mode, previousSeries);
  const aggregate = aggregateValues(primary.values, mode);
  const previousAggregate = aggregateValues(previousPrimary.values, mode);
  const latestIndex = latestValueIndex(primary.values);
  const latestValue = latestIndex >= 0 ? primary.values[latestIndex] : null;
  const latestPrevious = latestIndex >= 0 ? previousPrimary.values[latestIndex] : null;
  const inputCount = filledValues(primary.values).length;
  const aggregateLabel = mode.aggregate === 'avg' ? `${primary.label}平均` : `${primary.label}合計`;
  const latestLabel = latestIndex >= 0 ? `${Number(months[latestIndex].slice(5, 7))}月` : '-';

  container.innerHTML = `
    <div class="analysis-chip">
      <div class="analysis-chip-label">${escapeHtml(year)}年 ${escapeHtml(aggregateLabel)}</div>
      <div class="analysis-chip-value">${formatAnalysisValue(aggregate, mode.unit)}</div>
      <div class="analysis-chip-note">${inputCount}ヶ月入力済み</div>
    </div>
    <div class="analysis-chip">
      <div class="analysis-chip-label">最新月 ${escapeHtml(latestLabel)}</div>
      <div class="analysis-chip-value">${formatAnalysisValue(latestValue, mode.unit)}</div>
      <div class="analysis-chip-note">${latestIndex >= 0 ? `${primary.label}の最新値` : '入力済み月がありません'}</div>
    </div>
    <div class="analysis-chip">
      <div class="analysis-chip-label">${mode.unit === '%' ? '前年同月差' : '前年同月比'}</div>
      <div class="analysis-chip-value">${latestIndex >= 0 ? yoyCell(latestValue, latestPrevious, mode.unit) : '<span class="yoy">-</span>'}</div>
      <div class="analysis-chip-note">年間${mode.aggregate === 'avg' ? '平均' : '合計'}: ${yoyCell(aggregate, previousAggregate, mode.unit)}</div>
    </div>`;
}

function renderAnalysisChart(container, mode, seriesList) {
  const values = seriesList.flatMap(series => filledValues(series.values));
  if (!values.length) {
    container.innerHTML = '<div class="chart-empty">この年の入力済みデータがありません</div>';
    return;
  }

  const width = 820;
  const height = 320;
  const margin = { top: 22, right: 24, bottom: 42, left: 70 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const maxValue = Math.max(...values);
  const yMin = 0;
  const yMax = maxValue <= 0 ? 1 : maxValue * 1.12;
  const xFor = index => margin.left + (plotWidth / 11) * index;
  const yFor = value => margin.top + plotHeight - ((value - yMin) / (yMax - yMin)) * plotHeight;
  const ticks = Array.from({ length: 5 }, (_, index) => yMin + ((yMax - yMin) / 4) * index);

  const grid = ticks.map(tick => {
    const y = yFor(tick);
    return `
      <line class="chart-grid" x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}"></line>
      <text class="chart-label" x="${margin.left - 8}" y="${y + 4}" text-anchor="end">${escapeHtml(compactAxisValue(tick, mode.unit))}</text>`;
  }).join('');

  const xLabels = Array.from({ length: 12 }, (_, index) => {
    const x = xFor(index);
    return `<text class="chart-label" x="${x}" y="${height - 14}" text-anchor="middle">${index + 1}月</text>`;
  }).join('');

  const seriesMarkup = seriesList.map(series => {
    const segments = [];
    let current = [];
    series.values.forEach((value, index) => {
      if (value === null || !Number.isFinite(value)) {
        if (current.length) segments.push(current);
        current = [];
        return;
      }
      current.push({ index, value, x: xFor(index), y: yFor(value) });
    });
    if (current.length) segments.push(current);
    const lines = segments
      .filter(segment => segment.length > 1)
      .map(segment => `<polyline class="chart-line" stroke="${series.color}" points="${segment.map(point => `${point.x},${point.y}`).join(' ')}"></polyline>`)
      .join('');
    const points = segments.flat().map(point => `
      <circle class="chart-point" cx="${point.x}" cy="${point.y}" r="4" fill="${series.color}">
        <title>${escapeHtml(series.label)} ${point.index + 1}月: ${escapeHtml(formatAnalysisValue(point.value, mode.unit))}</title>
      </circle>`).join('');
    return `${lines}${points}`;
  }).join('');

  container.innerHTML = `
    <svg class="analysis-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(mode.label)} 年間グラフ">
      <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff"></rect>
      ${grid}
      <line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
      <line class="chart-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
      ${xLabels}
      ${seriesMarkup}
    </svg>`;
}

}

function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  const existing = document.querySelector(`script[data-import-lib="${globalName}"]`);
  if (existing?.dataset.ready === '1') return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const script = existing || document.createElement('script');
    script.src = src;
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.dataset.importLib = globalName;
    script.onload = () => {
      script.dataset.ready = '1';
      window[globalName] ? resolve(window[globalName]) : reject(new Error(`${globalName}を読み込めませんでした`));
    };
    script.onerror = () => reject(new Error(`${globalName}の読み込みに失敗しました`));
    if (!existing) document.head.appendChild(script);
  });
}

function loadPdfJs() {
  if (!pdfJsLoader) {
    pdfJsLoader = loadScriptOnce(PDFJS_URL, 'pdfjsLib').then(pdfjs => {
      pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
      return pdfjs;
    });
  }
  return pdfJsLoader;
}

function loadTesseract() {

function japaneseTextScore(text) {
  const source = String(text || '');
  const keywords = ['月計表', '合計', '患者数', '再初診', '新患', '診療報酬', '自費', '物販', '保険種別', 'レセプト'];
  return keywords.reduce((score, keyword) => score + (source.includes(keyword) ? 2 : 0), 0)
    + (source.match(/[ぁ-んァ-ン一-龥]/g) || []).length / 40
    - (source.match(/[\u0080-\u009f�]/g) || []).length / 8;
}

function repairLegacyPdfText(text) {
  const source = String(text || '');
  if (!source || typeof TextDecoder === 'undefined') return source;
  const legacyChars = (source.match(/[\u0080-\u009f]/g) || []).length;
  if (legacyChars < 6) return source;
  try {
    const bytes = [];
    for (const ch of source) {
      const code = ch.charCodeAt(0);
      if (code <= 0xff) {
        bytes.push(code);
      } else {
        bytes.push(...new TextEncoder().encode(ch));
      }
    }
    const decoded = new TextDecoder('shift_jis').decode(new Uint8Array(bytes));
    return japaneseTextScore(decoded) > japaneseTextScore(source) + 2 ? decoded : source;
  } catch (error) {
    return source;
  }
}

async function readPdfText(file) {
  const pdfjs = await loadPdfJs();
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
    setImportStatus(`PDF読み取り中 ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    pages.push(content.items.map(item => item.str).join('\n'));
  }
  const text = repairLegacyPdfText(pages.join('\n\n').trim());
  if (text.length >= 20) return text;
  setImportStatus('PDFに文字データが少ないためOCRに切り替えます');
  return readPdfByOcr(pdf);
}

async function readPdfByOcr(pdf) {
  const Tesseract = await loadTesseract();
  const pages = [];
  const maxPages = Math.min(pdf.numPages, 5);
  for (let pageNo = 1; pageNo <= maxPages; pageNo++) {
    setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages}`);
    const page = await pdf.getPage(pageNo);
    const viewport = page.getViewport({ scale: 1.8 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const result = await Tesseract.recognize(blob, 'jpn+eng', {
      logger: info => {
        if (info.status === 'recognizing text') {
          setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages} ${Math.round((info.progress || 0) * 100)}%`);
        }
      }
    });
    pages.push(result.data.text || '');
  }
  return pages.join('\n\n');
}

async function readImageText(file) {
  const Tesseract = await loadTesseract();
  const result = await Tesseract.recognize(file, 'jpn+eng', {
    logger: info => {
      if (info.status) {
        const pct = typeof info.progress === 'number' ? ` ${Math.round(info.progress * 100)}%` : '';
        setImportStatus(`OCR中: ${info.status}${pct}`);
      }
    }
  });
  return result.data.text || '';
}

async function extractTextFromFile(file) {
  if (!file) return '';
  if (file.size > 25 * 1024 * 1024) {
    throw new Error('25MB以下のファイルを選択してください');
  }
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf' || name.endsWith('.pdf')) {
    return readPdfText(file);
  }
  if (file.type.startsWith('image/')) {
    return readImageText(file);
  }
  if (file.type.startsWith('text/') || name.endsWith('.txt')) {
    return file.text();
  }
  throw new Error('PDF、画像、テキストファイルに対応しています');
}

function normalizeImportText(text) {
  return String(text || '')
    .normalize('NFKC')
    .replace(/\u3000/g, ' ')
    .replace(/[，、]/g, ',')
    .replace(/[：]/g, ':');
}

function compactForMatch(text) {
  return normalizeImportText(text).toLowerCase().replace(/\s+/g, '');
}

function inferCategory(text) {
  const normalized = compactForMatch(text);
  const rules = [
    { category: '診療指標', keywords: ['自費率', '保険点数', 'レセプト', '平均点数', '診療報酬'] },
    { category: '経費', keywords: ['経費', '費用', '支出', '仕入', '人件費', '材料費', '技工'] },
    { category: '患者数', keywords: ['患者', '来院', '初診', '再初診', '新患', '人数'] },
    { category: '売上', keywords: ['売上', '収入', '入金', '総売上', '月商', '物販', '自費', '保険'] }
  ];
  for (const rule of rules) {
    if (rule.keywords.some(keyword => normalized.includes(compactForMatch(keyword)))) return rule.category;
  }
  return 'その他';
}

function inferUnit(text, category) {
  const normalized = normalizeImportText(text);
  if (/%|％|率|割合/.test(normalized)) return '%';
  if (/円|¥|￥/.test(normalized)) return '円';
  if (/人/.test(normalized)) return '人';
  if (/件/.test(normalized)) return '件';
  if (['売上', '経費'].includes(category)) return '円';
  if (category === '患者数') return '人';
  return '';
}

function normalizeMetricNumber(raw, unit) {
  let value = Number(String(raw || '').replace(/,/g, ''));
  if (!Number.isFinite(value)) return '';
  if (unit === '%' && value > 0 && value < 1) value *= 100;
  return Math.abs(value - Math.round(value)) < 0.000001
    ? String(Math.round(value))
    : String(Number(value.toFixed(2)));
}

function findMetricValueMatch(line, month, unit) {
  const text = normalizeImportText(line);
  const monthNumber = Number(String(month || '').split('-')[1]);
  if (monthNumber) {
    const monthPattern = new RegExp(`(^|[^0-9])${monthNumber}\\s*月\\s*:?\\s*([^\\n]+)`);
    const monthMatch = monthPattern.exec(text);
    if (monthMatch) {
      const segmentStart = monthMatch.index + monthMatch[0].length - monthMatch[2].length;
      const matches = [...monthMatch[2].matchAll(/-?\d[\d,]*(?:\.\d+)?/g)];
      if (matches.length) {
        const match = matches[0];
        return {
          value: normalizeMetricNumber(match[0], unit),
          index: segmentStart + match.index,
          end: segmentStart + match.index + match[0].length
        };
      }
    }
  }
  const matches = [...text.matchAll(/-?\d[\d,]*(?:\.\d+)?/g)];
  if (!matches.length) return null;
  const match = matches[matches.length - 1];
  return {
    value: normalizeMetricNumber(match[0], unit),
    index: match.index,
    end: match.index + match[0].length
  };
}

function extractMetricItem(line, valueMatch) {
  let text = normalizeImportText(line);
  if (valueMatch) {
    text = `${text.slice(0, valueMatch.index)} ${text.slice(valueMatch.end)}`;
  }
  text = text
    .replace(/\b20\d{2}[/-]\d{1,2}(?:[/-]\d{1,2})?\b/g, ' ')
    .replace(/\d{1,2}\s*月/g, ' ')
    .replace(/[¥￥円人件%％]/g, ' ')
    .replace(/[|｜,:]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  text = text.replace(/^(項目|科目|名称|内容)\s*/, '').trim();
  return text.slice(0, 50);
}

function hasImportNumber(line) {
  return /-?\d[\d,]*(?:\.\d+)?/.test(normalizeImportText(line));
}

function parseMetricCandidateLine(line, month, defaultSource) {
  const category = inferCategory(line);
  const unit = inferUnit(line, category);
  const valueMatch = findMetricValueMatch(line, month, unit);
  if (!valueMatch?.value) return null;
  const item = canonicalMetricItem(extractMetricItem(line, valueMatch));
  if (!item || item.length < 2) return null;
  return {
    enabled: true,
    month,
    category: canonicalMetricCategory(category, item),
    item,
    value: valueMatch.value,
    unit,
    source: defaultSource,
    note: '',
    sourceText: normalizeImportText(line).slice(0, 240)
  };
}

function formatImportValue(value, digits = 2) {
  if (value === null || value === undefined || value === '') return '';
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return Math.abs(n - Math.round(n)) < 0.000001
    ? String(Math.round(n))
    : String(Number(n.toFixed(digits)));
}

function numbersFromImportLine(line) {
  return [...normalizeImportText(line).matchAll(/-?\d[\d,]*(?:\.\d+)?/g)]
    .map(match => Number(match[0].replace(/,/g, '')))
    .filter(Number.isFinite);
}

function inferImportMonthFromText(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  let match = text.match(/令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月/);
  if (match) {
    const year = 2018 + Number(match[1]);
    return `${year}-${String(Number(match[2])).padStart(2, '0')}`;
  }
  match = text.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月/);
  if (match) return `${match[1]}-${String(Number(match[2])).padStart(2, '0')}`;
  return '';
}

function parseMonthlyReport(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  if (!text.includes('月計表')) return null;
  const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
  const totalLines = lines
    .filter(line => /^合計\s/.test(line))
    .map(line => ({ line, nums: numbersFromImportLine(line) }));
  const dailyTotal = totalLines.find(entry => entry.nums.length >= 15);
  if (!dailyTotal) return null;
  const insuranceTotal = totalLines.find(entry => /\([^)]*\)/.test(entry.line) && entry.nums.length >= 7)
    || totalLines.find(entry => entry !== dailyTotal && entry.nums.length >= 7);
  const treatmentDays = lines.filter(line => /^\d{1,2}\([^)]+\)\s+\d/.test(line)).length;
  const daily = dailyTotal.nums;
  const insurance = insuranceTotal?.nums || [];
  const insurancePoints = insurance[2] ?? daily[4] ?? null;
  const insuranceSales = insurance[4] ?? (Number.isFinite(insurancePoints) ? insurancePoints * 10 : null);
  return {
    patientTotal: daily[0],
    reportRevisit: daily[1],
    newPatients: daily[2],
    selfPaySales: daily[10],
    productSales: daily[12],
    insurancePoints,
    insuranceSales,
    receiptCount: insurance[0],
    averagePoints: insurance[3],
    treatmentDays,
    sourceText: `${dailyTotal.line}${insuranceTotal ? `\n${insuranceTotal.line}` : ''}`
  };
}

function metricCandidate(month, category, item, value, unit, source, sourceText, digits = 2) {
  const normalizedValue = formatImportValue(value, digits);
  if (!normalizedValue) return null;
  const normalizedItem = canonicalMetricItem(item);
  return {
    enabled: true,
    month,
    category: canonicalMetricCategory(category, normalizedItem),
    item: normalizedItem,
    value: normalizedValue,
    unit,
    source,
    note: '',
    sourceText
  };
}

function buildMonthlyReportMetricCandidates(rawText, month, defaultSource, apoInitialCount) {
  const report = parseMonthlyReport(rawText);
  if (!report) return [];
  const source = defaultSource || '月計表';
  const sourceText = `月計表合計\n${report.sourceText}`.slice(0, 240);
  const candidates = [
    metricCandidate(month, '患者数', '月間延べ患者数', report.patientTotal, '人', source, sourceText, 0),
    metricCandidate(month, '患者数', '一日平均来院数', report.treatmentDays > 0 ? report.patientTotal / report.treatmentDays : null, '人', source, `月間延べ患者数${report.patientTotal} ÷ 診療日数${report.treatmentDays}`, 2),
    metricCandidate(month, '診療指標', '自費率', Number.isFinite(report.selfPaySales) && Number.isFinite(report.insuranceSales) && report.selfPaySales + report.insuranceSales > 0 ? (report.selfPaySales / (report.insuranceSales + report.selfPaySales)) * 100 : null, '%', source, sourceText, 2),
    metricCandidate(month, '売上', '自費売上', report.selfPaySales, '円', source, sourceText, 0),
    metricCandidate(month, '売上', '物販合計', report.productSales, '円', source, sourceText, 0),
    metricCandidate(month, '診療指標', '保険点数', report.insurancePoints, '点', source, sourceText, 0),
    metricCandidate(month, '売上', '保険売上', Number.isFinite(report.insurancePoints) ? report.insurancePoints * 10 : null, '円', source, '保険点数 × 10', 0),
    metricCandidate(month, '診療指標', 'レセプト枚数', report.receiptCount, '枚', source, sourceText, 0),
    metricCandidate(month, '診療指標', '平均点数', report.averagePoints, '点', source, sourceText, 0)
  ].filter(Boolean);

  const initialCount = Number(apoInitialCount);
  if (apoInitialCount !== null && apoInitialCount !== '' && Number.isFinite(initialCount)) {
    candidates.splice(1, 0,
      metricCandidate(month, '患者数', '初診', initialCount, '人', 'アポツール', `アポツール初診数 ${formatImportValue(initialCount, 0)}`, 0),
      metricCandidate(month, '患者数', '再初診', Number.isFinite(report.newPatients) && Number.isFinite(report.reportRevisit) ? report.newPatients - initialCount + report.reportRevisit : null, '人', source, `月計表 新患${report.newPatients} - アポツール初診${formatImportValue(initialCount, 0)} + 月計表 再初診${report.reportRevisit}`, 0)
    );
  }
  return candidates.filter(Boolean);
}

function buildImportCandidates(rawText, month, defaultSource, apoInitialCount = null) {
  const monthlyReportCandidates = buildMonthlyReportMetricCandidates(rawText, month, defaultSource, apoInitialCount);
  if (monthlyReportCandidates.length) return addAutoSelfPayRateCandidates(monthlyReportCandidates).sort(compareMetrics);

  const lines = normalizeImportText(repairLegacyPdfText(rawText))
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);
  const candidates = [];
  const seen = new Set();
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (!hasImportNumber(line) && hasImportNumber(lines[i + 1] || '')) {
      line = `${line} ${lines[i + 1]}`;
      i++;
    }
    const candidate = parseMetricCandidateLine(line, month, defaultSource);
    if (!candidate) continue;
    const key = `${candidate.month}|${candidate.category}|${candidate.item}|${candidate.value}`;
    if (seen.has(key)) continue;
    seen.add(key);
    candidates.push(candidate);
    if (candidates.length >= 80) break;
  }
  return addAutoSelfPayRateCandidates(candidates).sort(compareMetrics);
}

function renderImportCandidates() {
  const wrap = document.getElementById('importCandidates');
  if (!importCandidates.length) {
    wrap.innerHTML = '<div class="empty">候補が見つかりません。読み取りテキストを修正してから候補作成してください。</div>';
    return;
  }
  wrap.innerHTML = importCandidates.map((candidate, index) => `
    <div class="import-candidate">
      <label>
        <span class="import-candidate-label">保存</span>
        <input type="checkbox" ${candidate.enabled ? 'checked' : ''} onchange="updateImportCandidate(${index}, 'enabled', this.checked)">
      </label>
      <div>
        <span class="import-candidate-label">区分</span>
        <select onchange="updateImportCandidate(${index}, 'category', this.value)">${categoryOptions(candidate.category, candidate.item)}</select>
      </div>
      <div>
        <span class="import-candidate-label">項目</span>
        <input type="text" value="${escapeHtml(candidate.item)}" onchange="updateImportCandidate(${index}, 'item', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">数値</span>
        <input type="text" inputmode="decimal" value="${escapeHtml(candidate.value)}" onchange="updateImportCandidate(${index}, 'value', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">単位</span>
        <input type="text" value="${escapeHtml(candidate.unit)}" onchange="updateImportCandidate(${index}, 'unit', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">確認元</span>
        <input type="text" value="${escapeHtml(candidate.source)}" onchange="updateImportCandidate(${index}, 'source', this.value)">
      </div>
      <div class="import-raw">${escapeHtml(candidate.sourceText || '')}</div>
    </div>`).join('');
}

function findExistingMetric(month, item) {
  const itemKey = canonicalMetricItem(item);
  const entry = Object.entries(allMetrics).find(([, metric]) => metric.month === month && canonicalMetricItem(metric.item) === itemKey);
  return entry ? { id: entry[0], ...entry[1] } : null;
}

window.handleImportFile = async function(file) {
  if (!file || !isAdmin()) return;
  importFileMeta = {
    name: file.name,
    type: file.type || 'unknown',
    size: file.size
  };
  if (!document.getElementById('importDefaultSource').value.trim()) {
    document.getElementById('importDefaultSource').value = file.name.replace(/\.[^.]+$/, '');
  }
  try {
    setImportStatus('読み取りを開始しました');
    document.getElementById('importRawText').value = '';
    importCandidates = [];
    renderImportCandidates();
    const text = await extractTextFromFile(file);
    document.getElementById('importRawText').value = text.trim();
    const inferredMonth = inferImportMonthFromText(text);
    if (inferredMonth) document.getElementById('importMonth').value = inferredMonth;
    setImportStatus(`読み取り完了: ${file.name}`, 'success');
    analyzeImportText();
  } catch (error) {
    setImportStatus(`読み取りに失敗しました: ${error.message}`, 'error');
  }
};

window.analyzeImportText = function() {
  const rawText = document.getElementById('importRawText').value;
  const month = document.getElementById('importMonth').value || document.getElementById('monthFilter').value || currentMonth();
  const defaultSource = document.getElementById('importDefaultSource').value.trim();
  const apoInitialCount = parseNumber(document.getElementById('importApoInitial').value);
  importCandidates = buildImportCandidates(rawText, month, defaultSource, apoInitialCount);
  renderImportCandidates();
  const monthlyReportNeedsInitial = parseMonthlyReport(rawText) && !(apoInitialCount !== null && Number.isFinite(Number(apoInitialCount)));
  const note = monthlyReportNeedsInitial ? ' 初診・再初診にはアポツール初診数が必要です。' : '';
  setImportStatus(`${importCandidates.length}件の候補を作成しました。保存前に内容を確認してください。${note}`, importCandidates.length ? 'success' : 'error');
};

window.saveImportCandidates = async function() {
  if (!isAdmin() || saving) return;
  let selected = importCandidates
    .map(candidate => ({
      ...candidate,
      month: String(candidate.month || '').trim(),
      category: String(candidate.category || 'その他').trim(),
      item: canonicalMetricItem(candidate.item),
      value: String(candidate.value ?? '').trim(),
      unit: String(candidate.unit || '').trim(),
      source: String(candidate.source || '').trim(),
      note: String(candidate.note || '').trim()
    }))
    .map(candidate => ({
      ...candidate,
      category: canonicalMetricCategory(candidate.category, candidate.item)
    }))
    .filter(candidate => candidate.enabled && candidate.month && candidate.item && candidate.value);
  selected = addAutoSelfPayRateCandidates(selected)
    .filter(candidate => candidate.enabled && candidate.month && candidate.item && candidate.value);
  if (!selected.length) {
    setImportStatus('保存対象の候補がありません', 'error');
    return;
  }

  saving = true;
  const saveBtn = document.getElementById('importSaveBtn');
  saveBtn.disabled = true;
  try {
    let saved = 0;
    const months = new Set();
    for (const candidate of selected) {
      const data = {
        month: candidate.month,
        category: canonicalMetricCategory(candidate.category, candidate.item),
        item: candidate.item,
        value: candidate.value,
        unit: candidate.unit || '',
        source: candidate.source || '',
        note: candidate.note || ''
      };
      await savePrivateMetricData(data);
      saved++;
      months.add(candidate.month);
    }

    let syncedRates = 0;
    for (const month of months) {
      const rateData = selfPayRateMetricData(month, selected);
      if (!rateData) continue;
      await syncGoalSelfPayRate(month, rateData.value);
      syncedRates++;
    }

    await push(ref(db, IMPORT_HISTORY_PATH), {
      fileName: importFileMeta?.name || '',
      fileType: importFileMeta?.type || '',
      fileSize: importFileMeta?.size || 0,
      importedAt: Date.now(),
      importedBy: currentUser.name,
      importedRows: saved,
      months: Array.from(months).sort(),
      source: 'private-metrics-upload'
    });

    const firstMonth = Array.from(months).sort()[0];
    if (firstMonth) document.getElementById('monthFilter').value = firstMonth;
    closeImportModal();
    showToast(`${saved}件を取り込みました${syncedRates ? `（自費率${syncedRates}ヶ月分を自動計算）` : ''}`);
    render();
  } catch (error) {
    setImportStatus(`保存に失敗しました: ${error.message}`, 'error');
  } finally {
    saving = false;
    saveBtn.disabled = false;
  }
};

    await remove(ref(db, `${DB_PATH}/${editingId}`));
    closeMetricModal();
    showToast('削除しました');
  } catch(e) {
    showToast('削除に失敗しました: ' + e.message);
  }
};

window.exportCSV = function() {
  if (!isAdmin()) return;
  const metrics = filteredMetrics();
  if (!metrics.length) { showToast('出力するデータがありません'); return; }
  const headers = ['対象月','区分','項目','数値','単位','確認元','メモ','更新者','更新日'];
  const rows = metrics.map(metric => [
    metric.month,
    metric.category,
    metric.item,
    metric.value,
    metric.unit,
    metric.source,
    metric.note,
    metric.updatedBy || metric.createdBy || '',
    metric.updatedAt ? new Date(metric.updatedAt).toLocaleDateString('ja-JP') : ''
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `非公開経営数値_${document.getElementById('monthFilter').value || currentMonth()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

window.render = render;
window.renderAnalysis = renderAnalysis;

init();
</script>
