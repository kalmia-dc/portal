<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>院内研修資料 | カルミアデンタル スタッフポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#4ecdc4;
  --sky:#74b9ff;
  --coral:#ff6b6b;
  --bg:#f4f8fb;
  --white:#fff;
  --dark:#273238;
  --gray:#64727a;
  --light:#dfe8ed;
  --line:#e8eef2;
  --shadow:0 10px 28px rgba(39,50,56,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
button,input,select,textarea{font-family:inherit}
header{height:58px;background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.07);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--sky));display:grid;place-items:center;color:white;font-weight:900}
.back{border:0;border-radius:10px;background:var(--light);color:var(--gray);font-weight:800;padding:8px 12px;text-decoration:none;font-size:13px}
.guard{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:24px;text-align:center;color:var(--gray)}
.app{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.top{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
.title-block{background:linear-gradient(135deg,#3fb8b3,#5a9ff0);color:white;border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;opacity:.82;margin-bottom:4px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-weight:900}
.lead{margin:0;font-size:13px;line-height:1.7;opacity:.9}
.auth-panel{background:var(--white);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
body.is-admin .auth-panel{display:none}
body.is-editing-material .auth-panel{display:none}
.auth-grid{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:end}
.admin-panel{display:none;background:var(--white);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
body.is-admin .admin-panel,
body.is-editing-material .admin-panel{display:block}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-title{font-weight:900;font-size:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:var(--gray)}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;background:white;color:var(--dark);padding:11px 12px;font-size:14px;outline:none}
textarea{min-height:86px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--mint)}
.file-box{border:2px dashed #b9dce2;border-radius:14px;padding:14px;background:#f8fdff}
.file-box input{border:0;padding:0;border-radius:0;background:transparent}
.mode-toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode-toggle label{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:white;color:var(--dark);text-align:center}
.mode-toggle input{position:absolute;opacity:0;pointer-events:none}
.mode-toggle label:has(input:checked){border-color:var(--mint);background:#effbfa;color:#19766f}
.hint{font-size:12px;line-height:1.6;color:var(--gray);margin-top:6px}
.hint.warn{color:#b96818;font-weight:800}
.form-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;line-height:1.2}
.btn.primary{background:linear-gradient(135deg,var(--mint),var(--sky));color:white}
.btn.secondary{background:var(--light);color:var(--gray)}
.btn.danger{background:#ffe7e7;color:#b43232}
.btn.ghost{background:#edf7f8;color:#247d85}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status{font-size:12px;color:var(--gray);min-height:18px;line-height:1.5}
.status.ok{color:#188060;font-weight:800}
.status.err{color:#c0392b;font-weight:800}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;display:none}
.progress.show{display:block}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .2s}
.toolbar{background:var(--white);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:14px}
.count{font-size:12px;color:var(--gray);font-weight:800;margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:214px}
.card-head{display:flex;gap:10px;align-items:flex-start}
.file-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#ecfbfa;color:#227873;font-family:'Nunito',sans-serif;font-weight:900;flex-shrink:0}
.card-title{font-size:16px;font-weight:900;line-height:1.35;margin:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--gray)}
.badge{border-radius:999px;background:#eef4f7;padding:4px 8px;font-weight:800}
.summary{font-size:13px;line-height:1.65;color:#405057;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;flex:1}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.empty{background:white;border-radius:16px;padding:28px 18px;text-align:center;color:var(--gray);box-shadow:var(--shadow)}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.comments{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.comments-title{font-size:12px;font-weight:900;color:var(--gray)}
.comment-list{display:flex;flex-direction:column;gap:8px;max-height:160px;overflow:auto}
.comment{background:#f8fdff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.comment-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900;color:var(--gray);margin-bottom:4px}
.comment-text{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:#405057}
.comment-empty{font-size:12px;color:var(--gray);line-height:1.6}
.comment-form{display:flex;flex-direction:column;gap:8px}
.comment-form textarea{min-height:68px;font-size:13px}
.comment-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.comment-status{font-size:12px;color:var(--gray);line-height:1.5}
.comment-status.ok{color:#188060;font-weight:800}
.comment-status.err{color:#c0392b;font-weight:800}
.hidden{display:none!important}
@media (min-width:820px){
  .top{grid-template-columns:1fr 1.2fr;align-items:start}
}
@media (max-width:680px){
  .toolbar{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .auth-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-mark">LIB</div><span>Training Materials</span></div>
  <a class="back" href="https://kalmia-dc.github.io/portal/">戻る</a>
</header>

<main class="app" id="app">
  <section class="top">
    <div class="title-block">
      <div class="eyebrow">IN-HOUSE TRAINING</div>
      <h1>院内研修資料</h1>
      <p class="lead">研修スライド、PDF、画像、動画などをまとめて保管し、必要なときにすぐ開けます。</p>
    </div>

    <section class="auth-panel" id="authPanel" aria-label="管理者ログイン">
      <div class="panel-head">
        <div class="panel-title">管理者ログイン</div>
      </div>
      <div class="auth-grid">
        <div class="field">
          <label for="adminStaff">管理者</label>
          <select id="adminStaff">
            <option value="sugihira">院長</option>
            <option value="momo">百々</option>
          </select>
        </div>
        <div class="field">
          <label for="adminPass">パスワード</label>
          <input id="adminPass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="パスワード">
        </div>
        <button class="btn primary" type="button" onclick="loginAdmin()">ログイン</button>
      </div>
      <div class="status" id="authStatus"></div>
    </section>

    <section class="admin-panel" aria-label="資料追加">
      <div class="panel-head">
        <div class="panel-title" id="formTitle">資料を追加</div>
        <button class="btn secondary hidden" type="button" id="cancelEditBtn" onclick="cancelEdit()">編集をやめる</button>
      </div>
      <form id="materialForm" onsubmit="saveMaterial(event)">
        <div class="form-grid">
          <div class="field full">
            <label>保存方法</label>
            <div class="mode-toggle" role="radiogroup" aria-label="保存方法">
              <label><input type="radio" name="materialMode" value="file" checked>ファイルを保存</label>
              <label><input type="radio" name="materialMode" value="link">URLを保存</label>
            </div>
          </div>
          <div class="field">
            <label for="materialTitle">タイトル</label>
            <input id="materialTitle" type="text" maxlength="80" required placeholder="例：歯周治療研修 FMD版">
          </div>
          <div class="field">
            <label for="materialCategory">カテゴリ</label>
            <select id="materialCategory">
              <option>歯周治療</option>
              <option>カウンセリング</option>
              <option>診療補助</option>
              <option>受付</option>
              <option>接遇</option>
              <option>安全管理</option>
              <option>その他</option>
            </select>
          </div>
          <div class="field full">
            <label for="materialSummary">メモ</label>
            <textarea id="materialSummary" maxlength="500" placeholder="対象スタッフ、研修日、補足メモなど"></textarea>
          </div>
          <div class="field full">
            <label for="materialFile">ファイル</label>
            <div class="file-box">
              <input id="materialFile" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,image/*,video/*">
            </div>
            <div class="hint" id="fileHint">動画はYouTubeの限定公開リンク保存も使えます。</div>
          </div>
          <div class="field full hidden" id="linkField">
            <label for="materialUrl">URL</label>
            <input id="materialUrl" type="url" maxlength="500" placeholder="https://www.youtube.com/watch?v=...">
            <div class="hint">YouTubeは限定公開でアップロードし、共有URLを貼り付けてください。</div>
          </div>
        </div>
        <div class="progress" id="uploadProgress"><div class="progress-bar" id="uploadProgressBar"></div></div>
        <div class="form-actions">
          <div class="status" id="formStatus"></div>
          <button class="btn primary" id="saveBtn" type="submit">保存</button>
        </div>
      </form>
    </section>
  </section>

  <section class="toolbar" aria-label="検索">
    <input id="searchText" type="search" placeholder="タイトル・メモ・ファイル名で検索" oninput="renderMaterials()">
    <select id="categoryFilter" onchange="renderMaterials()">
      <option value="">すべてのカテゴリ</option>
      <option>歯周治療</option>
      <option>カウンセリング</option>
      <option>診療補助</option>
      <option>受付</option>
      <option>接遇</option>
      <option>安全管理</option>
      <option>その他</option>
    </select>
  </section>

  <p class="count" id="materialCount">読み込み中です</p>
  <section class="list" id="materialList"></section>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, set, update, remove, onValue, get }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL, deleteObject }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const firebaseConfig = {
  apiKey:            'AIzaSyDdMe7feUF6CKPHH0YIx7Suk-WnXtOYUu8',
  authDomain:        'kalmia-shift.firebaseapp.com',
  databaseURL:       'https://kalmia-shift-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:         'kalmia-shift',
  storageBucket:     'kalmia-shift.firebasestorage.app',
  messagingSenderId: '714175473480',
  appId:             '1:714175473480:web:7d6626a46e4a9dcb1fb57d'
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const storage = getStorage(fbApp);
const DB_PATH = 'trainingMaterials';
const ADMIN_STAFF = ['sugihira', 'momo'];
const DEFAULT_ADMIN_PASSWORDS = { sugihira:'1001', momo:'3003' };
const STAFF_NAMES = {
  sugihira:'院長', shimanaka:'島中', hokari:'保刈', shinoda:'篠田',
  tsuruta:'鶴田', yoshida:'吉田', takagi:'高木', matsumoto:'松本',
  yamada:'山田', tamiya:'田宮', tanaka:'田中', momo:'百々'
};

const STAFF_ROLES = {
  sugihira:'DR', shimanaka:'DR', hokari:'DR', shinoda:'DR',
  tsuruta:'DH', yoshida:'DH', takagi:'DH', matsumoto:'DH', yamada:'DH', hanowa:'DH',
  tamiya:'DA', tanaka:'DA', momo:'DA',
  guest:'ゲスト'
};
const PORTAL_USER_STORAGE_KEY = 'portalUser';

let currentUser = readUser();
let materials = [];
let editingId = '';
let editingMaterial = null;
let syncedPasswords = {};
let passwordsReady = false;

renderAuthState();
document.getElementById('adminPass')?.addEventListener('keydown', event => {
  if (event.key === 'Enter') window.loginAdmin();
});
document.querySelectorAll('input[name="materialMode"]').forEach(input => {
  input.addEventListener('change', updateMaterialMode);
});
document.getElementById('materialFile')?.addEventListener('change', updateFileHint);
updateMaterialMode();

onValue(ref(db, DB_PATH), snap => {
  const data = snap.val() || {};
  materials = Object.entries(data).map(([id, item]) => ({ id, ...item }))
    .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
  renderMaterials();
}, error => {
  showListError(`資料一覧を読み込めませんでした: ${error.message}`);
  setStatus(`資料一覧を読み込めませんでした: ${error.message}`, 'err');
});

function readUser() {
  const params = new URLSearchParams(location.search);
  const sid = params.get('sid') || '';
  if (sid) {
    const user = normalizePortalUser({
      staffId: sid,
      sid,
      name: params.get('name'),
      role: params.get('role'),
      pass: params.get('p') || ''
    });
    savePortalUser(user);
    history.replaceState({}, '', location.pathname);
    return user;
  }
  return readStoredPortalUser();
}

function isInvalidUserText(value) {
  const text = String(value ?? '').trim();
  return !text || text.toLowerCase() === 'undefined' || text.toLowerCase() === 'null';
}

function normalizePortalUser(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const staffId = raw.staffId || raw.sid || '';
  if (!staffId) return null;
  const name = isInvalidUserText(raw.name) ? (STAFF_NAMES[staffId] || staffId) : String(raw.name).trim();
  const role = isInvalidUserText(raw.role) ? (STAFF_ROLES[staffId] || '') : String(raw.role).trim();
  const pass = isInvalidUserText(raw.pass) ? '' : String(raw.pass);
  return { ...raw, staffId, sid: staffId, name, role, pass };
}

function savePortalUser(user) {
  const normalized = normalizePortalUser(user);
  if (!normalized) return null;
  const serialized = JSON.stringify(normalized);
  sessionStorage.setItem(PORTAL_USER_STORAGE_KEY, serialized);
  localStorage.setItem(PORTAL_USER_STORAGE_KEY, serialized);
  return normalized;
}

function readStoredPortalUser() {
  for (const storage of [sessionStorage, localStorage]) {
    try {
      const saved = storage.getItem(PORTAL_USER_STORAGE_KEY);
      if (!saved) continue;
      const user = normalizePortalUser(JSON.parse(saved));
      if (user) return savePortalUser(user);
    } catch(e) {}
  }
  return null;
}

function readLocalPasswords() {
  try {
    return JSON.parse(localStorage.getItem('carmia_passwords') || '{}') || {};
  } catch(e) {
    return {};
  }
}

function updatePasswordCache(data) {
  if (data && typeof data === 'object') {
    syncedPasswords = { ...syncedPasswords, ...data };
    localStorage.setItem('carmia_passwords', JSON.stringify({ ...readLocalPasswords(), ...syncedPasswords }));
  }
  passwordsReady = true;
}

async function ensurePasswordsLoaded() {
  if (passwordsReady) return;
  try {
    const snap = await get(ref(db, 'passwords'));
    updatePasswordCache(snap.val() || {});
  } catch(e) {
    passwordsReady = true;
  }
}

function passwordForAdmin(staffId) {
  const localPasswords = readLocalPasswords();
  return syncedPasswords[staffId] || localPasswords[staffId] || DEFAULT_ADMIN_PASSWORDS[staffId] || '';
}

function renderAuthState() {
  document.body.classList.toggle('is-admin', isAdmin());
  if (isAdmin()) {
    const staffSelect = document.getElementById('adminStaff');
    if (staffSelect) staffSelect.value = currentUser.staffId;
  }
}

function setAuthStatus(text, type = '') {
  const el = document.getElementById('authStatus');
  if (!el) return;
  el.textContent = text || '';
  el.className = `status ${type}`.trim();
}

window.loginAdmin = async function() {
  const staffId = document.getElementById('adminStaff').value;
  const pass = document.getElementById('adminPass').value;
  if (!ADMIN_STAFF.includes(staffId)) return setAuthStatus('管理者を選択してください。', 'err');
  if (!pass) return setAuthStatus('パスワードを入力してください。', 'err');

  setAuthStatus('確認しています。');
  await ensurePasswordsLoaded();

  if (pass !== passwordForAdmin(staffId)) {
    return setAuthStatus('パスワードが違います。', 'err');
  }

  currentUser = savePortalUser({
    staffId,
    sid: staffId,
    name: STAFF_NAMES[staffId] || staffId,
    role: STAFF_ROLES[staffId] || '',
    pass
  });
  document.getElementById('adminPass').value = '';
  renderAuthState();
  setAuthStatus('管理者としてログインしました。', 'ok');
};

function isAdmin() {
  return ADMIN_STAFF.includes(currentUser?.staffId);
}

function currentStaffId() {
  return currentUser?.staffId || currentUser?.sid || '';
}

function canManageMaterial(item) {
  if (isAdmin()) return true;
  const staffId = currentStaffId();
  if (!staffId || !item) return false;
  if (item.createdById && item.createdById === staffId) return true;
  const userName = currentUser?.name || STAFF_NAMES[staffId] || '';
  return !item.createdById && userName && item.createdBy === userName;
}

function renderMaterials() {
  const list = document.getElementById('materialList');
  const q = document.getElementById('searchText').value.trim().toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const filtered = materials.filter(item => {
    if (category && item.category !== category) return false;
    if (!q) return true;
    return [item.title, item.summary, item.fileName, item.category]
      .some(value => String(value || '').toLowerCase().includes(q));
  });

  document.getElementById('materialCount').textContent = `${filtered.length}件の資料`;

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">条件に合う資料はありません。</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const title = esc(item.title || item.fileName || '無題の資料');
    const summary = esc(item.summary || '');
    const isLink = item.sourceType === 'link' || Boolean(item.linkUrl);
    const fileName = esc(isLink ? (item.linkUrl || item.url || '') : (item.fileName || ''));
    const type = fileLabel(item.fileType, item.fileName, item.url || item.linkUrl, isLink);
    const date = formatDate(item.updatedAt || item.createdAt);
    const size = formatSize(item.fileSize || 0);
    const openUrl = escAttr(item.url || item.linkUrl || '#');
    const downloadButton = isLink ? '' : `<a class="btn ghost" href="${openUrl}" target="_blank" rel="noopener" download>ダウンロード</a>`;
    const manageActions = canManageMaterial(item)
      ? `<div class="admin-actions">
          <button class="btn secondary" type="button" onclick="startEdit('${escAttr(item.id)}')">編集</button>
          <button class="btn danger" type="button" onclick="deleteMaterial('${escAttr(item.id)}')">削除</button>
        </div>`
      : '';
    return `
      <article class="card">
        <div class="card-head">
          <div class="file-icon">${esc(type.short)}</div>
          <div>
            <h2 class="card-title">${title}</h2>
            <div class="meta">
              <span class="badge">${esc(item.category || 'その他')}</span>
              <span class="badge">${esc(type.label)}</span>
              ${size ? `<span class="badge">${size}</span>` : ''}
              ${date ? `<span class="badge">${date}</span>` : ''}
            </div>
          </div>
        </div>
        ${summary ? `<p class="summary">${summary}</p>` : '<p class="summary">メモはありません。</p>'}
        <div class="meta">${fileName}</div>
        <div class="card-actions">
          <a class="btn primary" href="${openUrl}" target="_blank" rel="noopener">開く</a>
          ${downloadButton}
          ${manageActions}
        </div>
        ${renderCommentSection(item)}
      </article>
    `;
  }).join('');
}

window.saveMaterial = async function(event) {
  event.preventDefault();
  const existingMaterial = editingId ? (editingMaterial || materials.find(material => material.id === editingId)) : null;
  if (editingId) {
    if (!canManageMaterial(existingMaterial)) return setStatus('この資料を編集できません。', 'err');
  } else if (!isAdmin()) {
    return setStatus('資料の追加は管理者のみ可能です。', 'err');
  }

  const title = document.getElementById('materialTitle').value.trim();
  const category = document.getElementById('materialCategory').value;
  const summary = document.getElementById('materialSummary').value.trim();
  const mode = getMaterialMode();
  const linkUrl = document.getElementById('materialUrl').value.trim();
  const file = document.getElementById('materialFile').files[0] || null;
  if (!title) return setStatus('タイトルを入力してください。', 'err');
  if (mode === 'link' && !linkUrl) return setStatus('保存するURLを入力してください。', 'err');
  if (mode === 'link' && !normalizeUrl(linkUrl)) return setStatus('URLは http:// または https:// で入力してください。', 'err');
  if (!editingId && mode === 'file' && !file) return setStatus('保存するファイルを選択してください。', 'err');
  if (editingId && mode === 'file' && !file && (editingMaterial?.sourceType === 'link' || editingMaterial?.linkUrl)) {
    return setStatus('ファイル資料に変更する場合はファイルを選択してください。', 'err');
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  setStatus(mode === 'file' && file ? 'アップロードを開始します。' : '資料情報を保存しています。');

  try {
    let filePayload = mode === 'link' ? linkPayload(linkUrl) : {};
    if (mode === 'file' && file) {
      filePayload = await uploadFile(file);
    }

    const now = Date.now();
    if (editingId) {
      await update(ref(db, `${DB_PATH}/${editingId}`), {
        title,
        category,
        summary,
        ...filePayload,
        updatedAt: now,
        updatedBy: currentUser?.name || '不明',
        updatedById: currentStaffId()
      });
      if ((mode === 'link' || file) && editingMaterial?.storagePath && editingMaterial.storagePath !== filePayload.storagePath) {
        await deleteStorageFile(editingMaterial.storagePath, true);
      }
      setStatus('更新しました。', 'ok');
    } else {
      const itemRef = push(ref(db, DB_PATH));
      await set(itemRef, {
        title,
        category,
        summary,
        ...filePayload,
        createdAt: now,
        createdBy: currentUser?.name || '不明',
        createdById: currentStaffId(),
        updatedAt: now,
        updatedBy: currentUser?.name || '不明',
        updatedById: currentStaffId()
      });
      setStatus('保存しました。', 'ok');
    }
    resetForm();
  } catch(error) {
    setStatus(`保存できませんでした: ${error.message}`, 'err');
  } finally {
    saveBtn.disabled = false;
    setProgress(0, false);
  }
};

function uploadFile(file) {
  return new Promise((resolve, reject) => {
    const path = `training-materials/${Date.now()}_${safeStorageName(file.name)}`;
    const target = storageRef(storage, path);
    const task = uploadBytesResumable(target, file, { contentType: file.type || undefined });
    setProgress(1, true);
    task.on('state_changed',
      snapshot => {
        const pct = Math.max(1, Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100));
        setProgress(pct, true);
        setStatus(`アップロード中です。${pct}%`);
      },
      error => reject(error),
      async () => {
        try {
          const url = await getDownloadURL(task.snapshot.ref);
          resolve({
            sourceType: 'file',
            linkUrl: null,
            fileName: file.name,
            fileType: file.type || '',
            fileSize: file.size,
            storagePath: path,
            url
          });
        } catch(error) {
          reject(error);
        }
      }
    );
  });
}

window.startEdit = function(id) {
  const item = materials.find(material => material.id === id);
  if (!item) return;
  if (!canManageMaterial(item)) return setStatus('この資料を編集できません。', 'err');
  editingId = id;
  editingMaterial = item;
  document.body.classList.add('is-editing-material');
  document.getElementById('formTitle').textContent = '資料を編集';
  document.getElementById('materialTitle').value = item.title || '';
  document.getElementById('materialCategory').value = item.category || 'その他';
  document.getElementById('materialSummary').value = item.summary || '';
  setMaterialMode(item.sourceType === 'link' || item.linkUrl ? 'link' : 'file');
  document.getElementById('materialUrl').value = item.linkUrl || (item.sourceType === 'link' ? item.url : '') || '';
  document.getElementById('materialFile').value = '';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('saveBtn').textContent = '更新';
  setStatus(getMaterialMode() === 'link' ? 'URLを変更できます。' : 'ファイルを選び直さない場合は、現在のファイルをそのまま使います。');
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.cancelEdit = function() {
  resetForm();
  setStatus('');
};

window.deleteMaterial = async function(id) {
  const item = materials.find(material => material.id === id);
  if (!item) return;
  if (!canManageMaterial(item)) return setStatus('この資料を削除できません。', 'err');
  if (!confirm(`「${item.title || item.fileName || '資料'}」を削除しますか？`)) return;
  try {
    if (item.storagePath) await deleteStorageFile(item.storagePath, false);
    await remove(ref(db, `${DB_PATH}/${id}`));
    setStatus('削除しました。', 'ok');
  } catch(error) {
    setStatus(`削除できませんでした: ${error.message}`, 'err');
  }
};

function renderCommentSection(item) {
  const comments = normalizeComments(item.comments);
  const materialId = escAttr(item.id);
  const safeId = domId(item.id);
  const canComment = Boolean(currentStaffId());
  const disabled = canComment ? '' : 'disabled';
  const placeholder = canComment ? '質問や確認したいことを入力' : 'ポータルから開くと質問できます';
  const commentList = comments.length
    ? comments.map(comment => `
        <div class="comment">
          <div class="comment-head">
            <span>${esc(comment.createdBy || '不明')}</span>
            <span>${esc(formatDateTime(comment.createdAt))}</span>
          </div>
          <div class="comment-text">${esc(comment.text || '')}</div>
        </div>
      `).join('')
    : '<div class="comment-empty">まだ質問はありません。</div>';

  return `
    <section class="comments" aria-label="${escAttr(item.title || item.fileName || '資料')}への質問">
      <div class="comments-title">質問・コメント</div>
      <div class="comment-list">${commentList}</div>
      <form class="comment-form" onsubmit="saveComment(event, '${materialId}')">
        <textarea maxlength="500" placeholder="${escAttr(placeholder)}" ${disabled}></textarea>
        <div class="comment-actions">
          <span class="comment-status" id="commentStatus-${safeId}"></span>
          <button class="btn secondary" type="submit" ${disabled}>送信</button>
        </div>
      </form>
    </section>
  `;
}

function normalizeComments(rawComments) {
  if (!rawComments) return [];
  const entries = Array.isArray(rawComments)
    ? rawComments.map((comment, index) => [String(index), comment])
    : Object.entries(rawComments);

  return entries
    .map(([id, comment]) => ({ id, ...(comment || {}) }))
    .filter(comment => String(comment.text || '').trim())
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

window.saveComment = async function(event, id) {
  event.preventDefault();
  if (!currentStaffId()) return setCommentStatus(id, 'ポータルから開いてください。', 'err');

  const form = event.currentTarget;
  const textarea = form.querySelector('textarea');
  const button = form.querySelector('button[type="submit"]');
  const text = textarea.value.trim();
  if (!text) return setCommentStatus(id, '質問を入力してください。', 'err');

  button.disabled = true;
  setCommentStatus(id, '送信しています。');

  try {
    const item = materials.find(material => material.id === id);
    if (!item) throw new Error('資料が見つかりません');

    const now = Date.now();
    const commentRef = push(ref(db, `${DB_PATH}/${id}/comments`));
    await set(commentRef, {
      text,
      createdAt: now,
      createdBy: currentUser?.name || STAFF_NAMES[currentStaffId()] || '不明',
      createdById: currentStaffId()
    });
    textarea.value = '';
    setCommentStatus(id, '送信しました。', 'ok');
  } catch(error) {
    setCommentStatus(id, `送信できませんでした: ${error.message}`, 'err');
  } finally {
    button.disabled = false;
  }
};

function setCommentStatus(id, text, type = '') {
  const el = document.getElementById(`commentStatus-${domId(id)}`);
  if (!el) return;
  el.textContent = text || '';
  el.className = `comment-status ${type}`.trim();
}

async function deleteStorageFile(path, silent) {
  try {
    await deleteObject(storageRef(storage, path));
  } catch(error) {
    if (error?.code === 'storage/object-not-found') return;
    if (!silent) throw error;
  }
}

function resetForm() {
  editingId = '';
  editingMaterial = null;
  document.getElementById('materialForm').reset();
  setMaterialMode('file');
  document.getElementById('materialUrl').value = '';
  document.getElementById('formTitle').textContent = '資料を追加';
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('saveBtn').textContent = '保存';
  document.body.classList.remove('is-editing-material');
  updateFileHint();
}

function getMaterialMode() {
  return document.querySelector('input[name="materialMode"]:checked')?.value || 'file';
}

function setMaterialMode(mode) {
  const target = document.querySelector(`input[name="materialMode"][value="${mode}"]`);
  if (target) target.checked = true;
  updateMaterialMode();
}

function updateMaterialMode() {
  const mode = getMaterialMode();
  const fileField = document.getElementById('materialFile')?.closest('.field');
  const linkField = document.getElementById('linkField');
  fileField?.classList.toggle('hidden', mode === 'link');
  linkField?.classList.toggle('hidden', mode !== 'link');
  if (mode === 'link') {
    document.getElementById('materialFile').value = '';
    updateFileHint();
  }
}

function updateFileHint() {
  const hint = document.getElementById('fileHint');
  const file = document.getElementById('materialFile')?.files?.[0];
  if (!hint) return;
  const isVideo = file?.type?.startsWith('video/') || /\.(mp4|mov|m4v|avi|wmv)$/i.test(file?.name || '');
  hint.textContent = isVideo
    ? '動画はアップロードに時間がかかります。YouTubeの限定公開リンク保存を推奨します。'
    : '動画はYouTubeの限定公開リンク保存も使えます。';
  hint.classList.toggle('warn', Boolean(isVideo));
}

function normalizeUrl(value) {
  try {
    const url = new URL(value);
    if (!['http:', 'https:'].includes(url.protocol)) return '';
    return url.toString();
  } catch(e) {
    return '';
  }
}

function linkPayload(value) {
  const url = normalizeUrl(value);
  const isYoutube = isYouTubeUrl(url);
  return {
    sourceType: 'link',
    linkUrl: url,
    url,
    fileName: isYoutube ? 'YouTubeリンク' : new URL(url).hostname,
    fileType: isYoutube ? 'video/youtube' : 'text/uri-list',
    fileSize: 0,
    storagePath: ''
  };
}

function isYouTubeUrl(value) {
  try {
    const host = new URL(value).hostname.replace(/^www\./, '').toLowerCase();
    return host === 'youtube.com' || host === 'youtu.be' || host.endsWith('.youtube.com');
  } catch(e) {
    return false;
  }
}

function setProgress(value, show) {
  const wrap = document.getElementById('uploadProgress');
  const bar = document.getElementById('uploadProgressBar');
  wrap.classList.toggle('show', Boolean(show));
  bar.style.width = `${value}%`;
}

function setStatus(text, type = '') {
  const el = document.getElementById('formStatus');
  el.textContent = text || '';
  el.className = `status ${type}`.trim();
}

function showListError(text) {
  document.getElementById('materialCount').textContent = '読み込みエラー';
  document.getElementById('materialList').innerHTML = `<div class="empty">${esc(text)}</div>`;
}

function safeStorageName(name) {
  const ext = (name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
  const base = name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48);
  return `${base || 'file'}${ext}`;
}

function fileLabel(type = '', name = '', url = '', isLink = false) {
  if (isLink) {
    if (isYouTubeUrl(url)) return { short:'YT', label:'YouTube' };
    return { short:'URL', label:'リンク' };
  }
  const lowerName = String(name).toLowerCase();
  if (type.includes('pdf') || lowerName.endsWith('.pdf')) return { short:'PDF', label:'PDF' };
  if (lowerName.endsWith('.ppt') || lowerName.endsWith('.pptx')) return { short:'PPT', label:'PowerPoint' };
  if (lowerName.endsWith('.doc') || lowerName.endsWith('.docx')) return { short:'DOC', label:'Word' };
  if (lowerName.endsWith('.xls') || lowerName.endsWith('.xlsx')) return { short:'XLS', label:'Excel' };
  if (type.startsWith('image/')) return { short:'IMG', label:'画像' };
  if (type.startsWith('video/')) return { short:'MOV', label:'動画' };
  return { short:'FILE', label:'ファイル' };
}

function formatSize(bytes) {
  if (!bytes) return '';
  const units = ['B','KB','MB','GB'];
  let size = bytes;
  let unit = 0;
  while (size >= 1024 && unit < units.length - 1) {
    size /= 1024;
    unit++;
  }
  return `${size >= 10 || unit === 0 ? Math.round(size) : size.toFixed(1)}${units[unit]}`;
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`;
}

function formatDateTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return `${formatDate(value)} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}

function domId(value) {
  return String(value ?? '').replace(/[^a-zA-Z0-9_-]/g, '_') || 'item';
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(value) {
  return esc(value).replace(/`/g, '&#96;');
}

Object.assign(window, { renderMaterials });
</script>
