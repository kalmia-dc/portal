<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非公開経営数値 | カルミアデンタル ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #37b8a9;
    --mint-dark: #20796f;
    --sky: #3f8edb;
    --coral: #e65b5b;
    --amber: #d89226;
    --green: #2f9b65;
    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-alt: #eef6f8;
    --border: #d9e7ec;
    --text: #263238;
    --muted: #60727c;
    --shadow: 0 3px 14px rgba(31, 64, 74, .08);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Maru Gothic', system-ui, sans-serif;
    letter-spacing: 0;
  }

  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 60px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(31, 64, 74, .06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--text);
    text-decoration: none;
    font-weight: 900;
  }

  .title-wrap { min-width: 0; }
  h1 {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    line-height: 1.05;
    font-weight: 900;
  }

  .subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge, .mode-badge {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .mode-badge.admin {
    color: var(--mint-dark);
    background: #e6f7f4;
    border-color: #b9e7df;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    transition: border-color .15s, transform .15s, background .15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--mint);
    transform: translateY(-1px);
  }

  .btn.primary {
    border-color: var(--mint);
    background: var(--mint);
    color: #fff;
  }

  .btn.secondary { background: var(--surface-alt); }

  .btn.danger {
    border-color: #f1c2c2;
    color: #b43c3c;
    background: #fff5f5;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
  }

  main {
    width: min(1280px, calc(100% - 28px));
    margin: 18px auto 40px;
  }

  .guard-note {
    margin-bottom: 14px;
    padding: 12px 14px;
    border: 1px solid #efd39c;
    border-radius: var(--radius);
    background: #fff8e8;
    color: #7c5516;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.6;
  }

  .summary-board {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 16px;
    align-items: end;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .section-kicker {
    color: var(--mint-dark);
    font-size: 11px;
    font-weight: 900;
  }

  .summary-title {
    margin-top: 3px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 900;
  }

  .summary-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .summary-actions {
    display: grid;
    gap: 8px;
    justify-items: end;
  }

  .utility-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .utility-actions .btn {
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 160px 170px minmax(220px, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .field label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    outline: none;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .12);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    min-height: 88px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .stat-value {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
  }

  .stat-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fbfdfe;
  }

  .panel-title {
    font-weight: 900;
    font-size: 14px;
  }

  .panel-sub {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .table-wrap { overflow: auto; }

  table {
    width: 100%;
    min-width: 980px;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f7fbfc;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  td { font-size: 13px; }
  tr:hover td { background: #fbfefe; }

  .metric-main {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .metric-name {
    font-weight: 900;
    color: var(--text);
  }

  .metric-detail {
    max-width: 360px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .category-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 24px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    white-space: nowrap;
  }

  .num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    white-space: nowrap;
  }

  .actions-cell {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-width: 52px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-weight: 900;
  }

  .empty {
    padding: 34px 18px;
    text-align: center;
    color: var(--muted);
  }

  .empty strong {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 8px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 34, 40, .45);
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    width: min(760px, 100%);
    max-height: min(90vh, 820px);
    overflow: auto;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(10, 30, 40, .22);
  }

  .modal-head,
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-foot {
    border-top: 1px solid var(--border);
    border-bottom: 0;
    justify-content: flex-end;
    background: #fbfdfe;
  }

  .modal-title { font-weight: 900; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 16px;
  }

  .field.full { grid-column: 1 / -1; }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  .import-modal {
    width: min(980px, 100%);
  }

  .import-drop {
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 1px dashed #9fcbd3;
    border-radius: var(--radius);
    background: #f7fbfc;
  }

  .import-actions,
  .import-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .import-status {
    min-height: 24px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .import-status.error {
    color: #b43c3c;
  }

  .import-status.success {
    color: var(--green);
  }

  .import-preview {
    min-height: 120px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .import-candidate-list {
    display: grid;
    gap: 10px;
  }

  .import-candidate {
    display: grid;
    grid-template-columns: 28px minmax(110px, .85fr) minmax(160px, 1.2fr) minmax(90px, .7fr) minmax(70px, .55fr) minmax(120px, .9fr);
    gap: 10px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .import-candidate input,
  .import-candidate select {
    width: 100%;
    min-height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 8px;
  }

  .import-candidate-label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  .import-raw {
    grid-column: 2 / -1;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 80;
    display: none;
    transform: translateX(-50%);
    max-width: min(520px, calc(100% - 28px));
    padding: 10px 14px;
    border-radius: var(--radius);
    background: #20323a;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 13px;
    font-weight: 800;
  }

  .toast.show { display: block; }

  @media (max-width: 920px) {
    header { align-items: flex-start; flex-direction: column; }
    .header-actions { justify-content: flex-start; width: 100%; }
    .summary-board { grid-template-columns: 1fr; align-items: stretch; }
    .summary-actions { justify-items: stretch; }
    .utility-actions { justify-content: flex-start; }
    .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .import-candidate {
      grid-template-columns: 28px minmax(0, 1fr);
    }

    .import-candidate > div:not(.import-raw) {
      grid-column: 2;
    }

    .import-raw {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 560px) {
    main { width: min(100% - 18px, 1280px); }
    .toolbar { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .utility-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .btn { flex: 1 1 auto; }
    .user-badge, .mode-badge { max-width: 100%; }
  }

  @media print {
    header, .toolbar, .summary-actions, .panel-head .btn, .actions-cell, .modal-backdrop, .toast {
      display: none !important;
    }
    body { background: #fff; }
    main { width: 100%; margin: 0; }
    .panel, .stat { box-shadow: none; }
    table { min-width: 0; font-size: 10px; }
    th, td { padding: 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a class="back-link" href="./index.html" title="ポータルに戻る">←</a>
    <div class="title-wrap">
      <h1>非公開経営数値</h1>
      <div class="subtitle">管理者専用・スタッフ非公開データ</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="user-badge" id="userBadge">読み込み中</span>
    <span class="mode-badge" id="modeBadge">確認中</span>
  </div>
</header>

<main>
  <div class="guard-note" id="guardNote">このページは百々さんと杉平院長のみ閲覧・編集できます。</div>

  <section class="summary-board admin-only" aria-label="経営数値サマリー">
    <div>
      <div class="section-kicker">非公開データ</div>
      <div class="summary-title" id="summaryTitle">経営数値</div>
      <div class="summary-meta" id="summarySub">読み込み中</div>
    </div>
    <div class="summary-actions">
      <button class="btn primary" onclick="openMetricModal()">経営数値を登録</button>
      <div class="utility-actions">
        <button class="btn secondary" onclick="exportCSV()">CSV</button>
        <button class="btn secondary" onclick="window.print()">印刷</button>
        <button class="btn secondary" onclick="openImportModal()">写真/PDF取込</button>
      </div>
    </div>
  </section>

  <section class="toolbar admin-only" aria-label="検索条件">
    <div class="field">
      <label for="monthFilter">対象月</label>
      <input type="month" id="monthFilter" onchange="render()">
    </div>
    <div class="field">
      <label for="categoryFilter">区分</label>
      <select id="categoryFilter" onchange="render()">
        <option value="all">すべて</option>
        <option value="売上">売上</option>
        <option value="患者数">患者数</option>
        <option value="自費">自費</option>
        <option value="保険">保険</option>
        <option value="経費">経費</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="field">
      <label for="searchInput">検索</label>
      <input type="search" id="searchInput" placeholder="項目・メモで検索" oninput="render()">
    </div>
  </section>

  <section class="stats admin-only" id="stats"></section>

  <section class="panel admin-only">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="listTitle">経営数値一覧</div>
        <div class="panel-sub" id="listSub">読み込み中</div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
  </section>
</main>

<div class="modal-backdrop" id="metricModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">経営数値を登録</div>
      <button class="icon-btn" onclick="closeMetricModal()" title="閉じる">×</button>
    </div>
    <div class="form-grid">
      <div class="field">
        <label for="fMonth">対象月</label>
        <input type="month" id="fMonth">
      </div>
      <div class="field">
        <label for="fCategory">区分</label>
        <select id="fCategory">
          <option value="売上">売上</option>
          <option value="患者数">患者数</option>
          <option value="自費">自費</option>
          <option value="保険">保険</option>
          <option value="経費">経費</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="field">
        <label for="fItem">項目名</label>
        <input type="text" id="fItem" placeholder="例：総売上">
      </div>
      <div class="field">
        <label for="fValue">数値</label>
        <input type="text" id="fValue" inputmode="decimal" placeholder="例：1200000">
      </div>
      <div class="field">
        <label for="fUnit">単位</label>
        <input type="text" id="fUnit" placeholder="例：円、人、件、%">
      </div>
      <div class="field">
        <label for="fSource">確認元</label>
        <input type="text" id="fSource" placeholder="例：月計表、会計、レセコン">
      </div>
      <div class="field full">
        <label for="fNote">メモ</label>
        <textarea id="fNote" placeholder="補足・確認事項"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="deleteBtn" onclick="deleteMetric()" style="display:none;">削除</button>
      <button class="btn secondary" onclick="closeMetricModal()">キャンセル</button>
      <button class="btn primary" id="saveBtn" onclick="saveMetric()">保存</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="importModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal import-modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">写真/PDFから取り込み</div>
        <div class="panel-sub">読み取り後、候補を確認してから保存します</div>
      </div>
      <button class="icon-btn" onclick="closeImportModal()" title="閉じる">×</button>
    </div>
    <div class="form-grid">
      <div class="field">
        <label for="importMonth">反映する月</label>
        <input type="month" id="importMonth">
      </div>
      <div class="field">
        <label for="importDefaultSource">確認元</label>
        <input type="text" id="importDefaultSource" placeholder="例：月計表、会計、レセコン">
      </div>
      <div class="field">
        <label for="importApoInitial">アポツール初診数</label>
        <input type="text" id="importApoInitial" inputmode="numeric" placeholder="例：70">
      </div>
      <div class="field full">
        <label for="importFile">PDF / 写真</label>
        <div class="import-drop">
          <input type="file" id="importFile" accept="application/pdf,.pdf,image/*" onchange="handleImportFile(this.files[0])">
          <div class="import-actions">
            <button class="btn secondary" type="button" onclick="document.getElementById('importFile').click()">ファイルを選択</button>
            <button class="btn secondary" type="button" onclick="analyzeImportText()">テキストから候補作成</button>
          </div>
          <div class="import-status" id="importStatus">PDFは文字抽出、写真やスキャンPDFはOCRで読み取ります。</div>
        </div>
      </div>
      <div class="field full">
        <label for="importRawText">読み取りテキスト</label>
        <textarea class="import-preview" id="importRawText" placeholder="読み取り結果がここに入ります。手入力や貼り付けでも候補作成できます。"></textarea>
      </div>
      <div class="field full">
        <div class="import-row-actions">
          <button class="btn secondary" type="button" onclick="setAllImportCandidates(true)">すべて選択</button>
          <button class="btn secondary" type="button" onclick="setAllImportCandidates(false)">すべて解除</button>
        </div>
      </div>
      <div class="field full">
        <div class="import-candidate-list" id="importCandidates">
          <div class="empty">ファイルを読み込むか、テキストを貼り付けて候補を作成してください。</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeImportModal()">キャンセル</button>

function fmtNumber(value, unit = '') {

function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  const existing = document.querySelector(`script[data-import-lib="${globalName}"]`);
  if (existing?.dataset.ready === '1') return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const script = existing || document.createElement('script');
    script.src = src;
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.dataset.importLib = globalName;
    script.onload = () => {
      script.dataset.ready = '1';
      window[globalName] ? resolve(window[globalName]) : reject(new Error(`${globalName}を読み込めませんでした`));
    };
    script.onerror = () => reject(new Error(`${globalName}の読み込みに失敗しました`));
    if (!existing) document.head.appendChild(script);
  });
}

function loadPdfJs() {

function loadTesseract() {

function japaneseTextScore(text) {
  const source = String(text || '');
  const keywords = ['月計表', '合計', '患者数', '再初診', '新患', '診療報酬', '自費', '物販', '保険種別', 'レセプト'];
  return keywords.reduce((score, keyword) => score + (source.includes(keyword) ? 2 : 0), 0)
    + (source.match(/[ぁ-んァ-ン一-龥]/g) || []).length / 40
    - (source.match(/[\u0080-\u009f�]/g) || []).length / 8;
}

function repairLegacyPdfText(text) {
  const source = String(text || '');
  if (!source || typeof TextDecoder === 'undefined') return source;
  const legacyChars = (source.match(/[\u0080-\u009f]/g) || []).length;
  if (legacyChars < 6) return source;
  try {
    const bytes = [];
    for (const ch of source) {
      const code = ch.charCodeAt(0);
      if (code <= 0xff) {
        bytes.push(code);
      } else {
        bytes.push(...new TextEncoder().encode(ch));
      }
    }
    const decoded = new TextDecoder('shift_jis').decode(new Uint8Array(bytes));
    return japaneseTextScore(decoded) > japaneseTextScore(source) + 2 ? decoded : source;
  } catch (error) {
    return source;
  }
}

async function readPdfText(file) {
  const pdfjs = await loadPdfJs();
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
    setImportStatus(`PDF読み取り中 ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    pages.push(content.items.map(item => item.str).join('\n'));
  }
  const text = repairLegacyPdfText(pages.join('\n\n').trim());
  if (text.length >= 20) return text;
  setImportStatus('PDFに文字データが少ないためOCRに切り替えます');
  return readPdfByOcr(pdf);
}

async function readPdfByOcr(pdf) {
  const Tesseract = await loadTesseract();
  const pages = [];
  const maxPages = Math.min(pdf.numPages, 5);
  for (let pageNo = 1; pageNo <= maxPages; pageNo++) {
    setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages}`);
    const page = await pdf.getPage(pageNo);
    const viewport = page.getViewport({ scale: 1.8 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const result = await Tesseract.recognize(blob, 'jpn+eng', {
      logger: info => {
        if (info.status === 'recognizing text') {
          setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages} ${Math.round((info.progress || 0) * 100)}%`);
        }
      }
    });
    pages.push(result.data.text || '');
  }
  return pages.join('\n\n');
}

async function readImageText(file) {
  const Tesseract = await loadTesseract();
  const result = await Tesseract.recognize(file, 'jpn+eng', {
    logger: info => {
      if (info.status) {
        const pct = typeof info.progress === 'number' ? ` ${Math.round(info.progress * 100)}%` : '';
        setImportStatus(`OCR中: ${info.status}${pct}`);
      }
    }
  });
  return result.data.text || '';
}

async function extractTextFromFile(file) {
  if (!file) return '';
  if (file.size > 25 * 1024 * 1024) {
    throw new Error('25MB以下のファイルを選択してください');
  }
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf' || name.endsWith('.pdf')) {
    return readPdfText(file);
  }
  if (file.type.startsWith('image/')) {
    return readImageText(file);
  }
  if (file.type.startsWith('text/') || name.endsWith('.txt')) {
    return file.text();
  }
  throw new Error('PDF、画像、テキストファイルに対応しています');
}

function normalizeImportText(text) {
  return String(text || '')
    .normalize('NFKC')
    .replace(/\u3000/g, ' ')
    .replace(/[，、]/g, ',')
    .replace(/[：]/g, ':');
}

function compactForMatch(text) {
  return normalizeImportText(text).toLowerCase().replace(/\s+/g, '');
}

function inferCategory(text) {
  const normalized = compactForMatch(text);
  const rules = [
    { category: '自費', keywords: ['自費', 'インプラント', 'ジルコニア', 'ホワイトニング'] },
    { category: '保険', keywords: ['保険', '社保', '国保', '医保', 'レセプト'] },
    { category: '経費', keywords: ['経費', '費用', '支出', '仕入', '人件費', '材料費', '技工'] },
    { category: '患者数', keywords: ['患者', '来院', '初診', '再初診', '新患', '人数'] },
    { category: '売上', keywords: ['売上', '収入', '入金', '総売上', '月商', '物販'] }
  ];
  for (const rule of rules) {
    if (rule.keywords.some(keyword => normalized.includes(compactForMatch(keyword)))) return rule.category;
  }
  return 'その他';
}

function inferUnit(text, category) {
  const normalized = normalizeImportText(text);
  if (/%|％|率|割合/.test(normalized)) return '%';
  if (/円|¥|￥/.test(normalized)) return '円';
  if (/人/.test(normalized)) return '人';
  if (/件/.test(normalized)) return '件';
  if (['売上', '自費', '保険', '経費'].includes(category)) return '円';
  if (category === '患者数') return '人';
  return '';
}

function normalizeMetricNumber(raw, unit) {
  let value = Number(String(raw || '').replace(/,/g, ''));
  if (!Number.isFinite(value)) return '';
  if (unit === '%' && value > 0 && value < 1) value *= 100;
  return Math.abs(value - Math.round(value)) < 0.000001
    ? String(Math.round(value))
    : String(Number(value.toFixed(2)));
}

function findMetricValueMatch(line, month, unit) {
  const text = normalizeImportText(line);
  const monthNumber = Number(String(month || '').split('-')[1]);
  if (monthNumber) {
    const monthPattern = new RegExp(`(^|[^0-9])${monthNumber}\\s*月\\s*:?\\s*([^\\n]+)`);
    const monthMatch = monthPattern.exec(text);
    if (monthMatch) {
      const segmentStart = monthMatch.index + monthMatch[0].length - monthMatch[2].length;
      const matches = [...monthMatch[2].matchAll(/-?\d[\d,]*(?:\.\d+)?/g)];
      if (matches.length) {
        const match = matches[0];
        return {
          value: normalizeMetricNumber(match[0], unit),
          index: segmentStart + match.index,
          end: segmentStart + match.index + match[0].length
        };
      }
    }
  }
  const matches = [...text.matchAll(/-?\d[\d,]*(?:\.\d+)?/g)];
  if (!matches.length) return null;
  const match = matches[matches.length - 1];
  return {
    value: normalizeMetricNumber(match[0], unit),
    index: match.index,
    end: match.index + match[0].length
  };
}

function extractMetricItem(line, valueMatch) {
  let text = normalizeImportText(line);
  if (valueMatch) {
    text = `${text.slice(0, valueMatch.index)} ${text.slice(valueMatch.end)}`;
  }
  text = text
    .replace(/\b20\d{2}[/-]\d{1,2}(?:[/-]\d{1,2})?\b/g, ' ')
    .replace(/\d{1,2}\s*月/g, ' ')
    .replace(/[¥￥円人件%％]/g, ' ')
    .replace(/[|｜,:]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  text = text.replace(/^(項目|科目|名称|内容)\s*/, '').trim();
  return text.slice(0, 50);
}

function hasImportNumber(line) {
  return /-?\d[\d,]*(?:\.\d+)?/.test(normalizeImportText(line));
}

function parseMetricCandidateLine(line, month, defaultSource) {
  const category = inferCategory(line);
  const unit = inferUnit(line, category);
  const valueMatch = findMetricValueMatch(line, month, unit);
  if (!valueMatch?.value) return null;
  const item = extractMetricItem(line, valueMatch);
  if (!item || item.length < 2) return null;
  return {
    enabled: true,
    month,
    category,
    item,
    value: valueMatch.value,
    unit,
    source: defaultSource,
    note: '',
    sourceText: normalizeImportText(line).slice(0, 240)
  };
}

function formatImportValue(value, digits = 2) {
  if (value === null || value === undefined || value === '') return '';
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return Math.abs(n - Math.round(n)) < 0.000001
    ? String(Math.round(n))
    : String(Number(n.toFixed(digits)));
}

function numbersFromImportLine(line) {
  return [...normalizeImportText(line).matchAll(/-?\d[\d,]*(?:\.\d+)?/g)]
    .map(match => Number(match[0].replace(/,/g, '')))
    .filter(Number.isFinite);
}

function inferImportMonthFromText(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  let match = text.match(/令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月/);
  if (match) {
    const year = 2018 + Number(match[1]);
    return `${year}-${String(Number(match[2])).padStart(2, '0')}`;
  }
  match = text.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月/);
  if (match) return `${match[1]}-${String(Number(match[2])).padStart(2, '0')}`;
  return '';
}

function parseMonthlyReport(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  if (!text.includes('月計表')) return null;
  const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
  const totalLines = lines
    .filter(line => /^合計\s/.test(line))
    .map(line => ({ line, nums: numbersFromImportLine(line) }));
  const dailyTotal = totalLines.find(entry => entry.nums.length >= 15);
  if (!dailyTotal) return null;
  const insuranceTotal = totalLines.find(entry => /\([^)]*\)/.test(entry.line) && entry.nums.length >= 7)
    || totalLines.find(entry => entry !== dailyTotal && entry.nums.length >= 7);
  const treatmentDays = lines.filter(line => /^\d{1,2}\([^)]+\)\s+\d/.test(line)).length;
  const daily = dailyTotal.nums;
  const insurance = insuranceTotal?.nums || [];
  const insurancePoints = insurance[2] ?? daily[4] ?? null;
  const insuranceSales = insurance[4] ?? (Number.isFinite(insurancePoints) ? insurancePoints * 10 : null);
  return {
    patientTotal: daily[0],
    reportRevisit: daily[1],
    newPatients: daily[2],
    selfPaySales: daily[10],
    productSales: daily[12],
    insurancePoints,
    insuranceSales,
    receiptCount: insurance[0],
    averagePoints: insurance[3],
    treatmentDays,
    sourceText: `${dailyTotal.line}${insuranceTotal ? `\n${insuranceTotal.line}` : ''}`
  };
}

function metricCandidate(month, category, item, value, unit, source, sourceText, digits = 2) {
  const normalizedValue = formatImportValue(value, digits);
  if (!normalizedValue) return null;
  return {
    enabled: true,
    month,
    category,
    item,
    value: normalizedValue,
    unit,
    source,
    note: '',
    sourceText
  };
}

function buildMonthlyReportMetricCandidates(rawText, month, defaultSource, apoInitialCount) {
  const report = parseMonthlyReport(rawText);
  if (!report) return [];
  const source = defaultSource || '月計表';
  const sourceText = `月計表合計\n${report.sourceText}`.slice(0, 240);
  const candidates = [
    metricCandidate(month, '患者数', '月間延べ患者数', report.patientTotal, '人', source, sourceText, 0),
    metricCandidate(month, '患者数', '一日平均来院数', report.treatmentDays > 0 ? report.patientTotal / report.treatmentDays : null, '人', source, `月間延べ患者数${report.patientTotal} ÷ 診療日数${report.treatmentDays}`, 2),
    metricCandidate(month, '自費', '自費率', Number.isFinite(report.selfPaySales) && Number.isFinite(report.insuranceSales) && report.selfPaySales + report.insuranceSales > 0 ? (report.selfPaySales / (report.insuranceSales + report.selfPaySales)) * 100 : null, '%', source, sourceText, 2),
    metricCandidate(month, '自費', '自費売上', report.selfPaySales, '円', source, sourceText, 0),
    metricCandidate(month, '売上', '物販合計', report.productSales, '円', source, sourceText, 0),
    metricCandidate(month, '保険', '保険点数', report.insurancePoints, '点', source, sourceText, 0),
    metricCandidate(month, '保険', '保険売上', Number.isFinite(report.insurancePoints) ? report.insurancePoints * 10 : null, '円', source, '保険点数 × 10', 0),
    metricCandidate(month, '保険', 'レセプト枚数', report.receiptCount, '枚', source, sourceText, 0),
    metricCandidate(month, '保険', '平均点数', report.averagePoints, '点', source, sourceText, 0)
  ].filter(Boolean);

  const initialCount = Number(apoInitialCount);
  if (apoInitialCount !== null && apoInitialCount !== '' && Number.isFinite(initialCount)) {
    candidates.splice(1, 0,
      metricCandidate(month, '患者数', '初診', initialCount, '人', 'アポツール', `アポツール初診数 ${formatImportValue(initialCount, 0)}`, 0),
      metricCandidate(month, '患者数', '再初診', Number.isFinite(report.newPatients) && Number.isFinite(report.reportRevisit) ? report.newPatients - initialCount + report.reportRevisit : null, '人', source, `月計表 新患${report.newPatients} - アポツール初診${formatImportValue(initialCount, 0)} + 月計表 再初診${report.reportRevisit}`, 0)
    );
  }
  return candidates.filter(Boolean);
}

function buildImportCandidates(rawText, month, defaultSource, apoInitialCount = null) {
  const monthlyReportCandidates = buildMonthlyReportMetricCandidates(rawText, month, defaultSource, apoInitialCount);
  if (monthlyReportCandidates.length) return monthlyReportCandidates;

  const lines = normalizeImportText(repairLegacyPdfText(rawText))
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);
  const candidates = [];
  const seen = new Set();
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (!hasImportNumber(line) && hasImportNumber(lines[i + 1] || '')) {
      line = `${line} ${lines[i + 1]}`;
      i++;
    }
    const candidate = parseMetricCandidateLine(line, month, defaultSource);
    if (!candidate) continue;
    const key = `${candidate.month}|${candidate.category}|${candidate.item}|${candidate.value}`;
    if (seen.has(key)) continue;
    seen.add(key);
    candidates.push(candidate);
    if (candidates.length >= 80) break;
  }
  return candidates;
}

function renderImportCandidates() {
  const wrap = document.getElementById('importCandidates');
  if (!importCandidates.length) {
    wrap.innerHTML = '<div class="empty">候補が見つかりません。読み取りテキストを修正してから候補作成してください。</div>';
    return;
  }
  wrap.innerHTML = importCandidates.map((candidate, index) => `
    <div class="import-candidate">
      <label>
        <span class="import-candidate-label">保存</span>
        <input type="checkbox" ${candidate.enabled ? 'checked' : ''} onchange="updateImportCandidate(${index}, 'enabled', this.checked)">
      </label>
      <div>
        <span class="import-candidate-label">区分</span>
        <select onchange="updateImportCandidate(${index}, 'category', this.value)">${categoryOptions(candidate.category)}</select>
      </div>
      <div>
        <span class="import-candidate-label">項目</span>
        <input type="text" value="${escapeHtml(candidate.item)}" onchange="updateImportCandidate(${index}, 'item', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">数値</span>
        <input type="text" inputmode="decimal" value="${escapeHtml(candidate.value)}" onchange="updateImportCandidate(${index}, 'value', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">単位</span>
        <input type="text" value="${escapeHtml(candidate.unit)}" onchange="updateImportCandidate(${index}, 'unit', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">確認元</span>
        <input type="text" value="${escapeHtml(candidate.source)}" onchange="updateImportCandidate(${index}, 'source', this.value)">
      </div>
      <div class="import-raw">${escapeHtml(candidate.sourceText || '')}</div>
    </div>`).join('');
}

function findExistingMetric(month, item) {
  const entry = Object.entries(allMetrics).find(([, metric]) => metric.month === month && metric.item === item);
  return entry ? { id: entry[0], ...entry[1] } : null;
}

window.openImportModal = function() {
  if (!isAdmin()) return;
  document.getElementById('importMonth').value = document.getElementById('monthFilter').value || currentMonth();
  document.getElementById('importDefaultSource').value = '';
  document.getElementById('importApoInitial').value = '';
  document.getElementById('importSaveBtn').disabled = false;
  setImportStatus('PDFは文字抽出、写真やスキャンPDFはOCRで読み取ります。');
  document.getElementById('importModal').classList.add('open');
};

window.closeImportModal = function() {
  document.getElementById('importModal').classList.remove('open');
};

window.handleImportFile = async function(file) {
  if (!file || !isAdmin()) return;
  importFileMeta = {
    name: file.name,
    type: file.type || 'unknown',
    size: file.size
  };
  if (!document.getElementById('importDefaultSource').value.trim()) {
    document.getElementById('importDefaultSource').value = file.name.replace(/\.[^.]+$/, '');
  }
  try {
    setImportStatus('読み取りを開始しました');
    document.getElementById('importRawText').value = '';
    importCandidates = [];
    renderImportCandidates();
    const text = await extractTextFromFile(file);
    document.getElementById('importRawText').value = text.trim();
    const inferredMonth = inferImportMonthFromText(text);
    if (inferredMonth) document.getElementById('importMonth').value = inferredMonth;
    setImportStatus(`読み取り完了: ${file.name}`, 'success');
    analyzeImportText();
  } catch (error) {
    setImportStatus(`読み取りに失敗しました: ${error.message}`, 'error');
  }
};

window.analyzeImportText = function() {
  const rawText = document.getElementById('importRawText').value;
  const month = document.getElementById('importMonth').value || document.getElementById('monthFilter').value || currentMonth();
  const defaultSource = document.getElementById('importDefaultSource').value.trim();
  const apoInitialCount = parseNumber(document.getElementById('importApoInitial').value);
  importCandidates = buildImportCandidates(rawText, month, defaultSource, apoInitialCount);
  renderImportCandidates();
  const monthlyReportNeedsInitial = parseMonthlyReport(rawText) && !(apoInitialCount !== null && Number.isFinite(Number(apoInitialCount)));
  const note = monthlyReportNeedsInitial ? ' 初診・再初診にはアポツール初診数が必要です。' : '';
  setImportStatus(`${importCandidates.length}件の候補を作成しました。保存前に内容を確認してください。${note}`, importCandidates.length ? 'success' : 'error');
};

window.updateImportCandidate = function(index, field, value) {
  if (!importCandidates[index]) return;
  importCandidates[index][field] = value;
};

window.setAllImportCandidates = function(enabled) {
  importCandidates = importCandidates.map(candidate => ({ ...candidate, enabled }));
  renderImportCandidates();
};

window.saveImportCandidates = async function() {
  if (!isAdmin() || saving) return;
  const selected = importCandidates
    .map(candidate => ({
      ...candidate,
      month: String(candidate.month || '').trim(),
      category: String(candidate.category || 'その他').trim(),
      item: String(candidate.item || '').trim(),
      value: String(candidate.value ?? '').trim(),
      unit: String(candidate.unit || '').trim(),
      source: String(candidate.source || '').trim(),
      note: String(candidate.note || '').trim()
    }))
    .filter(candidate => candidate.enabled && candidate.month && candidate.item && candidate.value);
  if (!selected.length) {
    setImportStatus('保存対象の候補がありません', 'error');
    return;
  }

  saving = true;
  const saveBtn = document.getElementById('importSaveBtn');
  saveBtn.disabled = true;
  try {
    let saved = 0;
    const months = new Set();
    for (const candidate of selected) {
      const existing = findExistingMetric(candidate.month, candidate.item);
      const data = {
        ...(existing || {}),
        month: candidate.month,
        category: candidate.category || existing?.category || 'その他',
        item: candidate.item,
        value: candidate.value,
        unit: candidate.unit || existing?.unit || '',
        source: candidate.source || existing?.source || '',
        note: candidate.note || existing?.note || '',
        updatedAt: Date.now(),
        updatedBy: currentUser.name
      };
      delete data.id;
      if (existing) {
        await set(ref(db, `${DB_PATH}/${existing.id}`), data);
      } else {
        await push(ref(db, DB_PATH), {
          ...data,
          createdAt: Date.now(),
          createdBy: currentUser.name
        });
      }
      saved++;
      months.add(candidate.month);
    }

    await push(ref(db, IMPORT_HISTORY_PATH), {
      fileName: importFileMeta?.name || '',
      fileType: importFileMeta?.type || '',
      fileSize: importFileMeta?.size || 0,
      importedAt: Date.now(),
      importedBy: currentUser.name,
      importedRows: saved,
      months: Array.from(months).sort(),
      source: 'private-metrics-upload'
    });

    const firstMonth = Array.from(months).sort()[0];
    if (firstMonth) document.getElementById('monthFilter').value = firstMonth;
    closeImportModal();
    showToast(`${saved}件を取り込みました`);
    render();
  } catch (error) {
    setImportStatus(`保存に失敗しました: ${error.message}`, 'error');
  } finally {
    saving = false;
    saveBtn.disabled = false;
  }
};

window.openMetricModal = function(id = null) {
  if (!isAdmin()) return;
  editingId = id;
  const metric = id ? allMetrics[id] : null;
  document.getElementById('modalTitle').textContent = metric ? '経営数値を編集' : '経営数値を登録';
  document.getElementById('deleteBtn').style.display = metric ? 'inline-flex' : 'none';

  const month = document.getElementById('monthFilter').value || currentMonth();
  setFormValue('fMonth', metric?.month || month);
  setFormValue('fCategory', metric?.category || '売上');
  setFormValue('fItem', metric?.item || '');
  setFormValue('fValue', metric?.value ?? '');
  setFormValue('fUnit', metric?.unit || '円');
  setFormValue('fSource', metric?.source || '');
  setFormValue('fNote', metric?.note || '');

  document.getElementById('metricModal').classList.add('open');
};

function setFormValue(id, value) {
  document.getElementById(id).value = value;
}

window.closeMetricModal = function() {
  document.getElementById('metricModal').classList.remove('open');
  editingId = null;
};

window.closeModalOnBackdrop = function(event) {
  if (event.target.id === 'metricModal') closeMetricModal();
  if (event.target.id === 'importModal') closeImportModal();
};

window.saveMetric = async function() {
  if (!isAdmin() || saving) return;
  const month = document.getElementById('fMonth').value;
  const item = document.getElementById('fItem').value.trim();
  if (!month) { showToast('対象月を選択してください'); return; }
  if (!item) { showToast('項目名を入力してください'); return; }

  const data = {
    month,
    category: document.getElementById('fCategory').value,
    item,
    value: document.getElementById('fValue').value.trim(),
    unit: document.getElementById('fUnit').value.trim(),
    source: document.getElementById('fSource').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };

  saving = true;
  document.getElementById('saveBtn').disabled = true;
  try {
    if (editingId) {
      const existing = allMetrics[editingId] || {};
      await set(ref(db, `${DB_PATH}/${editingId}`), { ...existing, ...data });
      showToast('経営数値を更新しました');
    } else {
      await push(ref(db, DB_PATH), {
        ...data,
        createdAt: Date.now(),
        createdBy: currentUser.name
      });
      showToast('経営数値を登録しました');
    }
    document.getElementById('monthFilter').value = month;
    closeMetricModal();
  } catch(e) {
    showToast('保存に失敗しました: ' + e.message);
  } finally {
    saving = false;
    document.getElementById('saveBtn').disabled = false;
  }
};

window.deleteMetric = async function() {
  if (!isAdmin() || !editingId) return;
  if (!confirm('この経営数値を削除しますか？')) return;
  try {
    await remove(ref(db, `${DB_PATH}/${editingId}`));
    closeMetricModal();
    showToast('削除しました');
  } catch(e) {
    showToast('削除に失敗しました: ' + e.message);
  }
};

window.exportCSV = function() {
  if (!isAdmin()) return;
  const metrics = filteredMetrics();
  if (!metrics.length) { showToast('出力するデータがありません'); return; }
  const headers = ['対象月','区分','項目','数値','単位','確認元','メモ','更新者','更新日'];
  const rows = metrics.map(metric => [
    metric.month,
    metric.category,
    metric.item,
    metric.value,
    metric.unit,
    metric.source,
    metric.note,
    metric.updatedBy || metric.createdBy || '',
    metric.updatedAt ? new Date(metric.updatedAt).toLocaleDateString('ja-JP') : ''
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `非公開経営数値_${document.getElementById('monthFilter').value || currentMonth()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

window.render = render;

init();
</script>
