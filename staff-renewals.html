<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>契約更新 | カルミアDC</title>
  <link rel="stylesheet" href="portal-common.css">
  <link rel="stylesheet" href="staff-onboarding.css">
</head>
<body>
  <main>
    <a id="back" href="index.html">ポータルへ戻る</a>
    <h1>契約更新</h1>
    <p id="portalAccessMessage" role="status" hidden></p>
    <p id="message" role="status">利用許可を確認しています…</p>
    <section id="case" hidden aria-labelledby="staffName">
      <h2 id="staffName"></h2>
      <button id="newRenewal" type="button" hidden>新しい更新契約書を作成</button>
      <button id="refreshRenewals" type="button">再読み込み</button>
      <div id="renewals"></div>
    </section>
    <dialog id="detail" aria-labelledby="detailTitle">
      <form>
        <h2 id="detailTitle"></h2>
        <p id="detailMessage" role="status"></p>
        <div id="fields"></div>
        <div id="actions"></div>
      </form>
    </dialog>
  </main>
  <script type="module" src="staff-renewals.js?v=20261114"></script>
</body>
</html>
