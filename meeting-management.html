<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミーティング管理 | カルミアデンタル ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#4ecdc4;
  --sky:#74b9ff;
  --coral:#ff6b6b;
  --yellow:#ffd93d;
  --ink:#2f3437;
  --muted:#7b858c;
  --line:#e6eaed;
  --soft:#f6f8f9;
  --white:#fff;
  --ok:#2e7d32;
  --warn:#b7791f;
  --bad:#c62828;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Zen Maru Gothic',sans-serif;
  color:var(--ink);
  background:var(--soft);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 16px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
}
.back-link{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:var(--ink);
  text-decoration:none;
  border:1px solid var(--line);
  background:#fff;
  font-weight:900;
}
.page-title{min-width:0;flex:1}
.page-title h1{
  margin:0;
  font-size:18px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:0;
}
.page-title p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}
.user-chip{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  max-width:42vw;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:12px;
  font-weight:800;
}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--mint);
  flex:0 0 auto;
}
.role-director .role-dot{background:var(--coral)}
.role-leader .role-dot{background:var(--sky)}
.main{
  width:min(1120px,100%);
  margin:0 auto;
  padding:18px 16px 80px;
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:2px 0 14px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  border-radius:8px;
  padding:10px 14px;
  min-height:42px;
  font-weight:900;
  white-space:nowrap;
}
.tab-btn.active{
  color:var(--ink);
  border-color:var(--mint);
  box-shadow:0 0 0 3px rgba(78,205,196,.18);
}
.section{display:none}
.section.active{display:block}
.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin:8px 0 12px;
}
.section-head h2{
  margin:0;
  font-size:18px;
  line-height:1.3;
  font-weight:900;
}
.count-badge{
  flex:0 0 auto;
  padding:5px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}
.form-panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  margin-bottom:14px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:900;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  padding:10px 11px;
  outline:none;
}
.field textarea{min-height:92px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--mint);
  box-shadow:0 0 0 3px rgba(78,205,196,.16);
}
.file-note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}
.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:8px;
  padding:9px 12px;
  min-height:38px;
  font-weight:900;
}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.sky{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.warn{background:#fff8e7;border-color:#f1c46d;color:var(--warn)}
.btn.danger{background:#fff1f1;border-color:#ffb3b3;color:var(--bad)}
.btn.ghost{background:#fff;color:var(--muted)}
.btn:disabled{opacity:.48;cursor:not-allowed}
.list{
  display:grid;
  gap:10px;
}
.item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
}
.item-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.item-title{
  min-width:0;
}
.item-title h3{
  margin:0;
  font-size:16px;
  line-height:1.45;
  font-weight:900;
  word-break:break-word;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}
.task-elapsed{
  display:inline-flex;
  align-items:center;
  border:1px solid #74b48a;
  border-radius:999px;
  background:#e9f7ee;
  color:#17602b;
  padding:2px 8px;
  font-size:13px;
  font-weight:900;
}
.item-badges{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  font-weight:900;
  border:1px solid var(--line);
  background:#fff;
  white-space:nowrap;
}
.status-todo{background:#f3f6f8;color:#68737a}
.status-in_progress{background:#e9f7ff;color:#1769aa;border-color:#b9def7}
.status-review{background:#fff7df;color:#9a6500;border-color:#f4d58a}
.status-confirmed{background:#e8f5e9;color:var(--ok);border-color:#a5d6a7}
.decision-pending{background:#f3f6f8;color:#68737a}
.decision-approved{background:#e8f5e9;color:var(--ok);border-color:#a5d6a7}
.decision-rejected{background:#fff1f1;color:var(--bad);border-color:#ffb3b3}
.decision-hold{background:#fff7df;color:var(--warn);border-color:#f4d58a}
.text-block{
  margin:10px 0 0;
  padding:10px 12px;
  background:#f8fafb;
  border:1px solid #edf1f3;
  border-radius:8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}
.text-label{
  margin-bottom:4px;
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}
.image-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:8px;
  margin-top:10px;
}
.image-thumb{
  display:block;
  width:100%;
  aspect-ratio:1;
  padding:0;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}
.image-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.item-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.read-status{
  display:inline-flex;
  align-items:center;
  margin-top:12px;
  padding:7px 10px;
  border-radius:8px;
  border:1px solid #a5d6a7;
  background:#e8f5e9;
  color:var(--ok);
  font-size:12px;
  font-weight:900;
}
.read-summary{
  margin-top:12px;
  padding:10px 12px;
  border:1px solid #edf1f3;
  border-radius:8px;
  background:#fffdf6;
}
.read-summary-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:13px;
  font-weight:900;
}
.read-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}
.read-group-title{
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}
.read-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:6px;
}
.read-chip{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  font-weight:900;
  border:1px solid var(--line);
  background:#fff;
}
.read-chip.read{background:#e8f5e9;color:var(--ok);border-color:#a5d6a7}
.read-chip.unread{background:#fff1f1;color:var(--bad);border-color:#ffb3b3}
.progress-box{
  margin-top:12px;
  display:grid;
  gap:8px;
}
.progress-box textarea{
  width:100%;
  min-height:88px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  resize:vertical;
}
.decision-grid{
  margin-top:12px;
  display:grid;
  grid-template-columns:180px 1fr;
  gap:8px;
}
.decision-reasons{
  grid-column:1 / -1;
  display:grid;
  gap:8px;
}
.decision-reason-field{
  display:grid;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}
.decision-reason-field[hidden]{display:none}
.decision-grid textarea{
  min-height:80px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  resize:vertical;
}
.decision-grid select{
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
}
.empty{
  border:1px dashed #cfd8dc;
  border-radius:8px;
  background:#fff;
  padding:22px 14px;
  text-align:center;
  color:var(--muted);
  font-weight:800;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  z-index:40;
  opacity:0;
  pointer-events:none;
  background:#263238;
  color:#fff;
  border-radius:8px;
  padding:10px 14px;
  max-width:min(92vw,420px);
  font-weight:800;
  transition:.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.viewer{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(25,31,36,.78);
  padding:18px;
}
.viewer.open{display:flex}
.viewer-inner{
  width:min(920px,100%);
  max-height:94vh;
  display:grid;
  gap:10px;
}
.viewer img{
  max-width:100%;
  max-height:82vh;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
}
.viewer .btn{justify-self:end}
.guard{
  width:min(520px,calc(100% - 32px));
  margin:80px auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:20px;
}
.guard h1{font-size:18px;margin:0 0 8px}
.guard p{margin:0 0 14px;color:var(--muted);line-height:1.6}
[hidden]{display:none!important}
@media(max-width:720px){
  .topbar{align-items:flex-start}
  .page-title h1{font-size:16px}
  .user-chip{max-width:34vw}
  .main{padding:14px 12px 76px}
  .form-grid,.decision-grid{grid-template-columns:1fr}
  .read-columns{grid-template-columns:1fr}
  .section-head{align-items:flex-start}
  .item-top{flex-direction:column}
  .item-badges{justify-content:flex-start}
  .item-actions,.form-actions{justify-content:stretch}
  .btn{width:100%}
}
</style>
</head>
<body>
<div id="app" class="app-shell" hidden>
  <header class="topbar">
    <a class="back-link" href="./index.html" title="ポータルに戻る">←</a>
    <div class="page-title">
      <h1>ミーティング管理</h1>
      <p id="scopeText">取り組み</p>
    </div>
    <div class="user-chip" id="userChip"><i class="role-dot"></i><span></span></div>
  </header>

  <main class="main">
    <nav class="tabs" aria-label="表示切替">
      <button class="tab-btn active" type="button" data-tab="tasks">取り組み</button>
      <button class="tab-btn" type="button" data-tab="notices">お知らせ</button>
      <button class="tab-btn" type="button" data-tab="opinions">スタッフ提言</button>
    </nav>

    <section id="tasksSection" class="section active">
      <div class="section-head">
        <h2>取り組み</h2>
        <span class="count-badge" id="taskCount">0件</span>
      </div>
      <div class="form-panel" id="taskFormPanel" hidden>
        <form id="taskForm">
          <div class="form-grid">
            <div class="field">
              <label for="taskTitle">取り組み名</label>
              <input id="taskTitle" required maxlength="80">
            </div>
            <div class="field">
              <label for="taskImages">画像</label>
              <input id="taskImages" type="file" accept="image/*" multiple>
              <div class="file-note">最大3枚。未選択なら既存画像を保持します。</div>
            </div>
            <div class="field full">
              <label for="taskDetail">詳細</label>
              <textarea id="taskDetail" required></textarea>
            </div>
            <div class="field full">
              <label for="taskCompletion">完了条件</label>
              <select id="taskCompletion" required>
                <option value="" disabled selected>選択してください</option>
                <option value="[取り組み内容] が1か月を目安に継続確認され、院長が定着を確認できたら完了">[取り組み内容] が1か月を目安に継続確認され、院長が定着を確認できたら完了</option>
                <option value="実際に運用されている状態を1か月を目安に継続確認し、院長が定着を確認できたら完了">実際に運用されている状態を1か月を目安に継続確認し、院長が定着を確認できたら完了</option>
                <option value="スタッフが正しく説明できる状態を1か月を目安に継続確認し、院長が定着を確認できたら完了">スタッフが正しく説明できる状態を1か月を目安に継続確認し、院長が定着を確認できたら完了</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn ghost" type="button" id="taskCancelBtn" hidden>キャンセル</button>
            <button class="btn primary" type="submit" id="taskSubmitBtn">取り組みを登録</button>
          </div>
        </form>
      </div>
      <div class="list" id="taskList"></div>
    </section>

    <section id="noticesSection" class="section">
      <div class="section-head">
        <h2>お知らせ</h2>
        <span class="count-badge" id="noticeCount">0件</span>
      </div>
      <div class="form-panel" id="noticeFormPanel" hidden>
        <form id="noticeForm">
          <div class="form-grid">
            <div class="field">
              <label for="noticeTitle">タイトル</label>
              <input id="noticeTitle" required maxlength="80">
            </div>
            <div class="field">
              <label for="noticeImages">画像</label>
              <input id="noticeImages" type="file" accept="image/*" multiple>
              <div class="file-note">最大3枚。未選択なら既存画像を保持します。</div>
            </div>
            <div class="field full">
              <label for="noticeBody">本文</label>
              <textarea id="noticeBody" required></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn ghost" type="button" id="noticeCancelBtn" hidden>キャンセル</button>
            <button class="btn primary" type="submit" id="noticeSubmitBtn">お知らせを登録</button>
          </div>
        </form>
      </div>
      <div class="list" id="noticeList"></div>
    </section>

    <section id="opinionsSection" class="section">
      <div class="section-head">
        <h2>スタッフ提言</h2>
        <span class="count-badge" id="opinionCount">0件</span>
      </div>
      <div class="form-panel" id="opinionFormPanel" hidden>
        <form id="opinionForm">
          <div class="form-grid">
            <div class="field full">
              <label for="opinionContent">提言内容</label>
              <textarea id="opinionContent" required></textarea>
            </div>
            <div class="field full">
              <label for="opinionReason">背景/理由</label>
              <textarea id="opinionReason" required></textarea>
            </div>
            <div class="field">
              <label for="opinionImages">画像</label>
              <input id="opinionImages" type="file" accept="image/*" multiple>
              <div class="file-note">最大3枚。</div>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit">提言を登録</button>
          </div>
        </form>
      </div>
      <div class="list" id="opinionList"></div>
    </section>
  </main>
</div>

<div id="guard" class="guard" hidden>
  <h1>ログイン情報が見つかりません</h1>
  <p>ポータルから開き直してください。</p>
  <a class="btn primary" href="./index.html">ポータルへ戻る</a>
</div>

<div class="viewer" id="viewer" aria-modal="true" role="dialog">
  <div class="viewer-inner">
    <button class="btn" type="button" id="viewerClose">閉じる</button>
    <img id="viewerImage" alt="">
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, set, update, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey:            'AIzaSyDdMe7feUF6CKPHH0YIx7Suk-WnXtOYUu8',
  authDomain:        'kalmia-shift.firebaseapp.com',
  databaseURL:       'https://kalmia-shift-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:         'kalmia-shift',
  storageBucket:     'kalmia-shift.firebasestorage.app',
  messagingSenderId: '714175473480',
  appId:             '1:714175473480:web:7d6626a46e4a9dcb1fb57d'
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const NOTIFY_URL = 'https://kalmia-notify.chibakenmin-sugihey.workers.dev';
const DIRECTOR_ID = 'sugihira';
const LEADER_IDS = ['momo', 'yamada'];
const STAFF_NAMES = {
  sugihira:'杉平', shimanaka:'嶋中', hokari:'保刈', shinoda:'篠田',
  tsuruta:'鶴田', yoshida:'吉田', takagi:'高木', matsumoto:'松本',
  yamada:'山田', tamiya:'田宮', tanaka:'田中', momo:'百々'
};
const NOTICE_TARGETS = {
  tsuruta:{ name:'鶴田', role:'DH' },
  yoshida:{ name:'吉田', role:'DH' },
  takagi:{ name:'高木', role:'DH' },
  matsumoto:{ name:'松本', role:'DH' },
  yamada:{ name:'山田', role:'DH' },
  tamiya:{ name:'田宮', role:'DA' },
  tanaka:{ name:'田中', role:'DA' },
  momo:{ name:'百々', role:'DA' }
};
const NOTICE_TARGET_IDS = Object.keys(NOTICE_TARGETS);
const STATUS_LABELS = {
  todo:'未着手',
  in_progress:'進行中',
  review:'確認依頼',
  confirmed:'定着確認済み'
};
const DECISION_LABELS = {
  pending:'未判断',
  approved:'承認',
  rejected:'不承認',
  hold:'保留'
};
const DECISION_REASON_KEYS = ['approved', 'rejected', 'hold'];
const PATHS = {
  tasks:'meetingManagement/tasks',
  notices:'meetingManagement/notices',
  opinions:'meetingManagement/opinions'
};

let currentUser = readUser();
let editingTaskId = null;
let editingNoticeId = null;
let dailyTaskNotificationInFlight = false;
let dailyTaskNotificationDoneFor = '';
let dailyNoticeNotificationInFlight = false;
let dailyNoticeNotificationDoneFor = '';
const state = { tasks:[], notices:[], opinions:[] };

if (!currentUser?.staffId) {
  document.getElementById('guard').hidden = false;
} else {
  boot();
}

function boot() {
  setupUser();
  setupTabs();
  setupForms();
  setupViewer();
  attachDataListeners();
  document.getElementById('app').hidden = false;
}

function readUser() {
  const params = new URLSearchParams(location.search);
  const paramStaffId = params.get('sid');
  if (paramStaffId) {
    const user = normalizeUser({
      staffId: paramStaffId,
      sid: paramStaffId,
      name: params.get('name') || STAFF_NAMES[paramStaffId] || paramStaffId,
      pass: params.get('p') || ''
    });
    sessionStorage.setItem('portalUser', JSON.stringify(user));
    history.replaceState({}, '', location.pathname);
    return user;
  }

  try {
    const saved = sessionStorage.getItem('portalUser');
    if (saved) {
      const raw = JSON.parse(saved);
      const staffId = raw.staffId || raw.sid;
      if (staffId) return normalizeUser({ ...raw, staffId });
    }
  } catch(e) {}
  return null;
}

function normalizeUser(raw) {
  const staffId = raw.staffId || raw.sid || '';
  return {
    staffId,
    sid: staffId,
    name: raw.name || STAFF_NAMES[staffId] || staffId,
    pass: raw.pass || raw.p || ''
  };
}

function roleKey() {
  if (currentUser.staffId === DIRECTOR_ID) return 'director';
  if (LEADER_IDS.includes(currentUser.staffId)) return 'leader';
  return 'staff';
}

function isDirector() { return roleKey() === 'director'; }
function isLeader() { return roleKey() === 'leader'; }
function isNoticeTarget() { return Boolean(NOTICE_TARGETS[currentUser.staffId]); }
function canSeeNotices() { return isDirector() || isLeader() || isNoticeTarget(); }
function canSeeOpinions() { return isDirector() || isLeader(); }
function canCreateManagedItems() { return isDirector() || isLeader(); }
function canManageOwnItem(item) {
  return isDirector() || (isLeader() && item?.createdById === currentUser.staffId);
}

function setupUser() {
  const role = roleKey();
  document.body.classList.add(`role-${role}`);
  const chip = document.getElementById('userChip');
  chip.classList.add(`role-${role}`);
  const staffRole = NOTICE_TARGETS[currentUser.staffId]?.role || 'スタッフ';
  const label = role === 'director' ? '院長' : role === 'leader' ? '主任' : staffRole;
  chip.querySelector('span').textContent = `${currentUser.name} / ${label}`;
  document.getElementById('scopeText').textContent = canSeeOpinions()
    ? '取り組み・お知らせ・スタッフ提言'
    : canSeeNotices()
      ? '取り組み・お知らせ'
      : '取り組みのみ閲覧';
  document.querySelector('[data-tab="notices"]').hidden = !canSeeNotices();
  document.querySelector('[data-tab="opinions"]').hidden = !canSeeOpinions();
  document.getElementById('taskFormPanel').hidden = !canCreateManagedItems();
  document.getElementById('noticeFormPanel').hidden = !canCreateManagedItems();
  document.getElementById('opinionFormPanel').hidden = !isLeader();

function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.hidden) return;
      activateTab(btn.dataset.tab);
    });
  });
}

function activateTab(tab) {
  if (tab === 'notices' && !canSeeNotices()) tab = 'tasks';
  if (tab === 'opinions' && !canSeeOpinions()) tab = 'tasks';
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
  document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
  document.getElementById(`${tab}Section`).classList.add('active');
}

function setupForms() {
  document.getElementById('taskForm').addEventListener('submit', saveTask);
  document.getElementById('taskCancelBtn').addEventListener('click', resetTaskForm);
  document.getElementById('noticeForm').addEventListener('submit', saveNotice);
  document.getElementById('noticeCancelBtn').addEventListener('click', resetNoticeForm);
  document.getElementById('opinionForm').addEventListener('submit', saveOpinion);
  document.addEventListener('change', handleDecisionChange);
  document.addEventListener('click', handleActions);
}

function setupViewer() {
  const viewer = document.getElementById('viewer');
  document.getElementById('viewerClose').addEventListener('click', () => viewer.classList.remove('open'));
  viewer.addEventListener('click', e => {
    if (e.target === viewer) viewer.classList.remove('open');
  });
}

function attachDataListeners() {
  onValue(ref(db, PATHS.tasks), snap => {
    state.tasks = toList(snap.val()).sort(sortTasks);
    renderTasks();
    maybeSendDailyTaskReadNotification();
  });
  onValue(ref(db, PATHS.notices), snap => {
    state.notices = toList(snap.val()).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (canSeeNotices()) renderNotices();
    maybeSendDailyNoticeReadNotification();
  });
  if (canSeeOpinions()) {
    onValue(ref(db, PATHS.opinions), snap => {
      state.opinions = toList(snap.val()).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
      renderOpinions();
    });
  }
}

function toList(data) {
  return Object.entries(data || {}).map(([id, value]) => ({ id, ...value }));
}

function sortTasks(a, b) {
  const weight = { review:0, in_progress:1, todo:2, confirmed:3 };
  const aw = weight[a.status || 'todo'] ?? 2;
  const bw = weight[b.status || 'todo'] ?? 2;
  if (aw !== bw) return aw - bw;
  return (b.createdAt || 0) - (a.createdAt || 0);
}

async function saveTask(event) {
  event.preventDefault();
  if (!canCreateManagedItems()) return;
  const title = valueOf('taskTitle');
  const detail = valueOf('taskDetail');
  const completion = valueOf('taskCompletion');
  if (!title || !detail || !completion) return showToast('未入力の項目があります');

  const existing = state.tasks.find(item => item.id === editingTaskId);
  if (editingTaskId && !canManageOwnItem(existing)) return;
  try {
    const images = await imagesFromInput('taskImages', existing?.images || []);
    const payload = {
      title, detail, completion, images,
      updatedAt: Date.now(),
      updatedBy: currentUser.name
    };
    if (editingTaskId) {
      await update(ref(db, `${PATHS.tasks}/${editingTaskId}`), payload);
      showToast('取り組みを更新しました');
    } else {
      await set(push(ref(db, PATHS.tasks)), {
        ...payload,
        progress:'',
        status:'todo',
        createdAt: Date.now(),
        createdBy: currentUser.name,
        createdById: currentUser.staffId
      });
      showToast('取り組みを登録しました');
    }
    resetTaskForm();
  } catch (err) {
    showToast(err.message || '保存できませんでした');
  }
}

function resetTaskForm() {
  editingTaskId = null;
  document.getElementById('taskForm').reset();
  resetTaskCompletionOptions();
  document.getElementById('taskCancelBtn').hidden = true;
  document.getElementById('taskSubmitBtn').textContent = '取り組みを登録';
}

function ensureCompletionOption(value) {
  const completion = String(value || '').trim();
  const select = document.getElementById('taskCompletion');
  if (!completion || !select) return;
  if ([...select.options].some(option => option.value === completion)) return;
  const option = document.createElement('option');
  option.value = completion;
  option.textContent = completion;
  option.dataset.legacy = 'true';
  select.appendChild(option);
}

function resetTaskCompletionOptions() {
  document.querySelectorAll('#taskCompletion option[data-legacy="true"]').forEach(option => option.remove());
  const select = document.getElementById('taskCompletion');
  if (select) select.value = '';
}

async function saveOpinion(event) {

async function handleActions(event) {
  const imageBtn = event.target.closest('.image-thumb');
  if (imageBtn) {
    const img = imageBtn.querySelector('img');
    document.getElementById('viewerImage').src = img.src;
    document.getElementById('viewer').classList.add('open');
    return;
  }

  const btn = event.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if (action === 'edit-task') return fillTaskForm(id);
  if (action === 'delete-task') return deleteItem(PATHS.tasks, id, '取り組み', state.tasks.find(task => task.id === id));
  if (action === 'confirm-task') return updateTaskStatus(id, 'confirmed');
  if (action === 'task-status') return updateTaskStatus(id, btn.dataset.status);
  if (action === 'save-progress') return saveProgress(id);
  if (action === 'read-task') return markTaskRead(id);
  if (action === 'edit-notice') return fillNoticeForm(id);
  if (action === 'delete-notice') return deleteItem(PATHS.notices, id, 'お知らせ', state.notices.find(notice => notice.id === id));
  if (action === 'read-notice') return markNoticeRead(id);
  if (action === 'delete-opinion') return deleteItem(PATHS.opinions, id, '提言');
  if (action === 'save-judgment') return saveJudgment(id);
}

function fillTaskForm(id) {
  const item = state.tasks.find(task => task.id === id);
  if (!canManageOwnItem(item)) return;
  if (!item) return;
  editingTaskId = id;
  document.getElementById('taskTitle').value = item.title || '';
  document.getElementById('taskDetail').value = item.detail || '';
  ensureCompletionOption(item.completion);
  document.getElementById('taskCompletion').value = item.completion || '';
  document.getElementById('taskImages').value = '';
  document.getElementById('taskCancelBtn').hidden = false;
  document.getElementById('taskSubmitBtn').textContent = '取り組みを更新';
  document.getElementById('taskFormPanel').scrollIntoView({ behavior:'smooth', block:'start' });
}

function fillNoticeForm(id) {
  const item = state.notices.find(notice => notice.id === id);
  if (!canManageOwnItem(item)) return;
  if (!item) return;
  editingNoticeId = id;
  document.getElementById('noticeTitle').value = item.title || '';
  document.getElementById('noticeBody').value = item.body || '';
  document.getElementById('noticeImages').value = '';
  document.getElementById('noticeCancelBtn').hidden = false;
  document.getElementById('noticeSubmitBtn').textContent = 'お知らせを更新';
  document.getElementById('noticeFormPanel').scrollIntoView({ behavior:'smooth', block:'start' });
}

async function deleteItem(path, id, label, item) {
  if (!canManageOwnItem(item)) return;
  if (!confirm(`${label}を削除しますか？`)) return;
  await remove(ref(db, `${path}/${id}`));
  showToast(`${label}を削除しました`);
}

async function updateTaskStatus(id, status) {
  const item = state.tasks.find(task => task.id === id);
  if (!item) return;
  if (status === 'confirmed' && !isDirector()) return;
  if (status !== 'confirmed' && !(isLeader() || isDirector())) return;
  const payload = {
    status,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };
  if (status === 'confirmed') {
    payload.confirmedAt = Date.now();
    payload.confirmedBy = currentUser.name;
  }
  await update(ref(db, `${PATHS.tasks}/${id}`), payload);
  showToast('ステータスを更新しました');
}

async function saveProgress(id) {
  if (!isLeader()) return;
  const input = document.querySelector(`[data-progress-id="${cssEscape(id)}"]`);
  const item = state.tasks.find(task => task.id === id);
  if (!input || !item || item.status === 'confirmed') return;
  const payload = {
    progress: input.value.trim(),
    status: item.status === 'todo' ? 'in_progress' : item.status,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };
  await update(ref(db, `${PATHS.tasks}/${id}`), payload);
  showToast('進捗を保存しました');
}

async function saveJudgment(id) {
  if (!isDirector()) return;
  const decision = document.querySelector(`[data-decision-id="${cssEscape(id)}"]`)?.value || 'pending';
  const decisionReasons = collectDecisionReasons(id);
  const reason = decision === 'pending' ? '' : decisionReasons[decision];
  if (decision !== 'pending' && !reason) {
    const activeInput = document.querySelector(`[data-reason-id="${cssEscape(id)}"][data-reason-decision="${decision}"]`);
    if (activeInput) activeInput.focus();
    return showToast(`${DECISION_LABELS[decision]}理由を入力してください`);
  }
  await update(ref(db, `${PATHS.opinions}/${id}`), {
    decision,
    decisionReasons,
    directorMemo: reason,
    decidedAt: Date.now(),
    decidedBy: currentUser.name,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  });
  showToast('判断を保存しました');
}

function collectDecisionReasons(id) {
  const reasons = {};
  document.querySelectorAll(`[data-reason-id="${cssEscape(id)}"]`).forEach(input => {
    const key = input.dataset.reasonDecision;
    if (DECISION_REASON_KEYS.includes(key)) reasons[key] = input.value.trim();
  });
  return reasons;
}

function handleDecisionChange(event) {
  const select = event.target.closest('[data-decision-id]');
  if (!select) return;
  updateDecisionReasonFields(select.dataset.decisionId, select.value);
}

function updateDecisionReasonFields(id, decision) {
  document.querySelectorAll(`[data-reason-wrap="${cssEscape(id)}"]`).forEach(field => {
    const active = field.dataset.reasonDecision === decision && DECISION_REASON_KEYS.includes(decision);
    field.hidden = !active;
    const input = field.querySelector('textarea');
    if (!input) return;
    if (active) input.setAttribute('required', '');
    else input.removeAttribute('required');
  });
}

async function markTaskRead(id) {
  if (!isNoticeTarget()) return;
  const task = state.tasks.find(item => item.id === id);
  if (!task) return;
  const currentRead = readByMap(task)[currentUser.staffId];
  if (currentRead) return showToast('確認済みです');
  await set(ref(db, `${PATHS.tasks}/${id}/readBy/${currentUser.staffId}`), {
    staffId: currentUser.staffId,
    name: currentUser.name,
    role: NOTICE_TARGETS[currentUser.staffId]?.role || '',
    readAt: Date.now()
  });
  showToast('確認済みにしました');
}

async function markNoticeRead(id) {
  if (!isNoticeTarget()) return;
  const notice = state.notices.find(item => item.id === id);
  if (!notice) return;
  const currentRead = readByMap(notice)[currentUser.staffId];
  if (currentRead) return showToast('確認済みです');
  const readEntry = {
    staffId: currentUser.staffId,
    name: currentUser.name,
    role: NOTICE_TARGETS[currentUser.staffId]?.role || '',
    readAt: Date.now()
  };
  await set(ref(db, `${PATHS.notices}/${id}/readBy/${currentUser.staffId}`), readEntry);
  const latestSnap = await get(ref(db, `${PATHS.notices}/${id}`));
  const latestNotice = latestSnap.val();
  if (latestNotice && isNoticeFullyRead(latestNotice, { [currentUser.staffId]: readEntry })) {
    await remove(ref(db, `${PATHS.notices}/${id}`));
    return showToast('全員確認済みのため、お知らせを削除しました');
  }
  showToast('確認済みにしました');
}

async function maybeSendDailyTaskReadNotification() {
  const dateKey = todayKey();
  if (dailyTaskNotificationInFlight || dailyTaskNotificationDoneFor === dateKey) return;

  dailyTaskNotificationInFlight = true;

  try {
    await requestTaskUnreadCheck();
    dailyTaskNotificationDoneFor = dateKey;
  } catch (err) {
    console.warn('取り組み未確認通知に失敗しました:', err);
  } finally {
    dailyTaskNotificationInFlight = false;
  }
}

async function maybeSendDailyNoticeReadNotification() {
  const dateKey = todayKey();
  if (dailyNoticeNotificationInFlight || dailyNoticeNotificationDoneFor === dateKey) return;

  dailyNoticeNotificationInFlight = true;

  try {
    await requestNoticeUnreadCheck();
    dailyNoticeNotificationDoneFor = dateKey;
  } catch (err) {
    console.warn('お知らせ未確認通知に失敗しました:', err);
  } finally {
    dailyNoticeNotificationInFlight = false;
  }
}

async function requestNoticeUnreadCheck() {

async function requestTaskUnreadCheck() {

    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ action:'taskUnreadCheck' })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

function renderTasks() {
  document.getElementById('taskCount').textContent = `${state.tasks.length}件`;
  const list = document.getElementById('taskList');
  if (!state.tasks.length) {
    list.innerHTML = '<div class="empty">取り組みはありません</div>';
    return;
  }
  list.innerHTML = state.tasks.map(task => `
    <article class="item">
      <div class="item-top">
        <div class="item-title">
          <h3>${esc(task.title || '')}</h3>
          <div class="meta">
            <span>${formatDate(task.createdAt)}</span>
            <span>登録: ${esc(displayCreatedBy(task))}</span>
            ${task.updatedBy ? `<span>更新: ${esc(task.updatedBy)}</span>` : ''}
          </div>
        </div>
        <div class="item-badges">
          <span class="task-elapsed">${esc(formatElapsedSince(task.createdAt))}</span>
          <span class="badge status-${escAttr(task.status || 'todo')}">${STATUS_LABELS[task.status || 'todo'] || STATUS_LABELS.todo}</span>
        </div>
      </div>
      ${textBlock('詳細', task.detail)}
      ${textBlock('完了条件', task.completion)}
      ${task.progress ? textBlock('進捗メモ', task.progress) : ''}
      ${imagesHtml(task.images)}
      ${taskReadButtonHtml(task)}
      ${taskReadSummaryHtml(task)}
      ${leaderProgressHtml(task)}
      ${taskActionsHtml(task)}
    </article>
  `).join('');
}

function leaderProgressHtml(task) {
  if (!isLeader() || task.status === 'confirmed') return '';
  return `
    <div class="progress-box">
      <textarea data-progress-id="${escAttr(task.id)}" placeholder="進捗メモ">${esc(task.progress || '')}</textarea>
      <div class="item-actions">
        <button class="btn sky" type="button" data-action="save-progress" data-id="${escAttr(task.id)}">進捗保存</button>
        ${task.status === 'todo' ? `<button class="btn" type="button" data-action="task-status" data-status="in_progress" data-id="${escAttr(task.id)}">進行中にする</button>` : ''}
        ${task.status !== 'review' ? `<button class="btn warn" type="button" data-action="task-status" data-status="review" data-id="${escAttr(task.id)}">確認依頼</button>` : ''}
      </div>
    </div>
  `;
}

function taskActionsHtml(task) {
  if (!canManageOwnItem(task)) return '';
  return `
    <div class="item-actions">
      <button class="btn" type="button" data-action="edit-task" data-id="${escAttr(task.id)}">編集</button>
      ${isDirector() && task.status !== 'confirmed' ? `<button class="btn primary" type="button" data-action="confirm-task" data-id="${escAttr(task.id)}">定着確認済みにする</button>` : ''}

function taskReadButtonHtml(task) {

  }
  return `
    <div class="item-actions">
      <button class="btn primary" type="button" data-action="read-task" data-id="${escAttr(task.id)}">確認しました</button>

function taskReadSummaryHtml(task) {

function noticeReadButtonHtml(notice) {
  if (!isNoticeTarget()) return '';
  const read = readByMap(notice)[currentUser.staffId];
  if (read) {
    return `<div class="read-status">確認済み：${formatDate(read.readAt)}</div>`;

  return `
    <div class="item-actions">
      <button class="btn primary" type="button" data-action="read-notice" data-id="${escAttr(notice.id)}">確認しました</button>

function noticeReadSummaryHtml(notice) {
  if (!canSeeOpinions()) return '';
  return readSummaryHtml(notice);
}

function readSummaryHtml(item) {
  const readBy = readByMap(item);
  const readIds = NOTICE_TARGET_IDS.filter(id => readBy[id]);
  const unreadIds = NOTICE_TARGET_IDS.filter(id => !readBy[id]);
  return `
    <div class="read-summary">
      <div class="read-summary-head">
        <span>確認済み ${readIds.length}/${NOTICE_TARGET_IDS.length}名</span>
      </div>
      <div class="read-columns">
        <div>
          <div class="read-group-title">未確認</div>
          <div class="read-list">
            ${unreadIds.length ? unreadIds.map(id => readChip(id, false)).join('') : '<span class="read-chip read">全員確認済み</span>'}
          </div>
        </div>
        <div>
          <div class="read-group-title">確認済み</div>
          <div class="read-list">
            ${readIds.length ? readIds.map(id => readChip(id, true, readBy[id])).join('') : '<span class="read-chip unread">まだありません</span>'}
          </div>
        </div>
      </div>
    </div>
  `;
}

function readByMap(notice) {
  return notice?.readBy && typeof notice.readBy === 'object' ? notice.readBy : {};
}

function isNoticeFullyRead(notice, extraReadBy = {}) {
  const readBy = { ...readByMap(notice), ...extraReadBy };
  return NOTICE_TARGET_IDS.length > 0 && NOTICE_TARGET_IDS.every(id => readBy[id]);
}

function readChip(id, isRead, read) {
  const name = NOTICE_TARGETS[id]?.name || STAFF_NAMES[id] || id;
  const suffix = isRead && read?.readAt ? ` ${formatDate(read.readAt)}` : '';
  return `<span class="read-chip ${isRead ? 'read' : 'unread'}">${esc(name)}${esc(suffix)}</span>`;
}

function renderOpinions() {
  document.getElementById('opinionCount').textContent = `${state.opinions.length}件`;
  const list = document.getElementById('opinionList');
  if (!state.opinions.length) {
    list.innerHTML = '<div class="empty">スタッフ提言はありません</div>';
    return;
  }
  list.innerHTML = state.opinions.map(opinion => `
    <article class="item">
      <div class="item-top">
        <div class="item-title">
          <h3>${esc(shortTitle(opinion.content))}</h3>
          <div class="meta">
            <span>${formatDate(opinion.createdAt)}</span>
            <span>登録: ${esc(opinion.createdBy || '-')}</span>
          </div>
        </div>
        <span class="badge decision-${escAttr(opinion.decision || 'pending')}">${DECISION_LABELS[opinion.decision || 'pending'] || DECISION_LABELS.pending}</span>
      </div>
      ${textBlock('提言内容', opinion.content)}
      ${textBlock('背景/理由', opinion.reason)}
      ${decisionReasonHtml(opinion)}
      ${imagesHtml(opinion.images)}
      ${judgmentHtml(opinion)}
    </article>
  `).join('');
}

function judgmentHtml(opinion) {
  if (!isDirector()) return '';
  const decision = opinion.decision || 'pending';
  const reasons = decisionReasonsOf(opinion);
  return `
    <div class="decision-grid">
      <select data-decision-id="${escAttr(opinion.id)}">
        ${Object.entries(DECISION_LABELS).map(([value, label]) => `<option value="${value}" ${value === decision ? 'selected' : ''}>${label}</option>`).join('')}
      </select>
      <div class="decision-reasons">
        ${DECISION_REASON_KEYS.map(key => {
          const active = key === decision;
          const label = `${DECISION_LABELS[key]}理由`;
          const value = reasons[key] || (active ? opinion.directorMemo || '' : '');
          return `
            <label class="decision-reason-field" data-reason-wrap="${escAttr(opinion.id)}" data-reason-decision="${key}" ${active ? '' : 'hidden'}>
              <span>${label}</span>
              <textarea data-reason-id="${escAttr(opinion.id)}" data-reason-decision="${key}" placeholder="${label}" ${active ? 'required' : ''}>${esc(value)}</textarea>
            </label>
          `;
        }).join('')}
      </div>
    </div>
    <div class="item-actions">
      <button class="btn primary" type="button" data-action="save-judgment" data-id="${escAttr(opinion.id)}">判断を保存</button>
      <button class="btn danger" type="button" data-action="delete-opinion" data-id="${escAttr(opinion.id)}">削除</button>
    </div>
  `;
}

function decisionReasonHtml(opinion) {
  const decision = opinion.decision || 'pending';
  const reason = currentDecisionReason(opinion);
  if (!reason) return '';
  const label = DECISION_REASON_KEYS.includes(decision) ? `${DECISION_LABELS[decision]}理由` : '院長判断メモ';
  return textBlock(label, reason);
}

function currentDecisionReason(opinion) {
  const decision = opinion.decision || 'pending';
  const reasons = decisionReasonsOf(opinion);
  if (DECISION_REASON_KEYS.includes(decision)) return reasons[decision] || opinion.directorMemo || '';
  return opinion.directorMemo || '';
}

function decisionReasonsOf(opinion) {
  return opinion?.decisionReasons && typeof opinion.decisionReasons === 'object' ? opinion.decisionReasons : {};
}

function textBlock(label, value) {
  if (!value) return '';
  return `<div class="text-block"><div class="text-label">${esc(label)}</div>${esc(value)}</div>`;
}

function imagesHtml(images = []) {
  if (!images.length) return '';
  return `
    <div class="image-grid">
      ${images.map((image, index) => `
        <button class="image-thumb" type="button" aria-label="添付画像${index + 1}">
          <img src="${escAttr(image.data || image)}" alt="">
        </button>
      `).join('')}
    </div>
  `;
}

async function imagesFromInput(inputId, existingImages) {
  const input = document.getElementById(inputId);
  const files = Array.from(input.files || []);
  if (!files.length) return existingImages || [];
  if (files.length > 3) throw new Error('画像は最大3枚までです');
  const images = [];
  for (const file of files) {
    if (!file.type.startsWith('image/')) throw new Error('画像ファイルを選択してください');
    images.push(await resizeImage(file));
  }
  return images;
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('画像を読み込めませんでした'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.onload = () => {
        const max = 1200;
        let width = img.width;
        let height = img.height;
        if (width > max || height > max) {
          const ratio = Math.min(max / width, max / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve({
          name: file.name,
          type: 'image/jpeg',
          data: canvas.toDataURL('image/jpeg', 0.72)
        });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function valueOf(id) {
  return document.getElementById(id).value.trim();
}

function todayKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatDate(ts) {
  if (!ts) return '-';
  return new Intl.DateTimeFormat('ja-JP', {
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit'
  }).format(new Date(ts));
}

function formatElapsedSince(ts) {
  if (!ts) return '開始日未設定';
  const start = new Date(ts);
  if (Number.isNaN(start.getTime())) return '開始日未設定';
  const diffMs = Date.now() - start.getTime();
  if (diffMs < 0) return '開始前';
  const days = Math.floor(diffMs / 86400000);
  const months = Math.floor(days / 30);
  return `取り組み開始から${months}か月`;
}

function displayCreatedBy(item) {
  const name = String(item?.createdBy || '').trim();
  if (item?.createdById === DIRECTOR_ID || name === '院長' || name === '杉平') return '院長';
  return name || '-';
}

function shortTitle(text = '') {
  const clean = String(text).replace(/\s+/g, ' ').trim();
  return clean.length > 34 ? `${clean.slice(0, 34)}...` : clean || 'スタッフ提言';
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(value) {
  return esc(value);
}

function cssEscape(value) {
  if (window.CSS?.escape) return CSS.escape(value);
  return String(value).replace(/["\\]/g, '\\$&');
}

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
