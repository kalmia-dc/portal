<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>身元確認書 | カルミアDC</title>
  <style>
    body{max-width:170mm;margin:1.5rem auto;padding:0 1rem;color:#111;font:16px/1.75 system-ui,sans-serif}
    h1{text-align:center;margin:2rem 0}
    dl{margin:2rem 0} dt{margin-top:1.2rem} dd{min-height:1.6rem;border-bottom:1px solid;margin-left:0}
    .date{margin:2.25rem 0;text-align:right}
    @page{size:A4;margin:20mm}
    @media print{body{padding:0;margin:0}.instructions{display:none}}
  </style>
</head>
<body>
  <p class="instructions">印刷して確認者本人に記入・署名を依頼し、記入後の用紙全体を撮影してください。</p>
  <h1>身元確認書</h1>
  <p>カルミアデンタルクリニック　御中</p>
  <p>私は、下記の新入職員との関係と、下記の連絡先が私本人のものであることを確認します。</p>
  <dl>
    <dt>新入職員の氏名</dt><dd></dd>
    <dt>新入職員との続柄・関係</dt><dd></dd>
    <dt>確認者の連絡先（電話番号）</dt><dd></dd>
    <dt>確認者の氏名（自署）</dt><dd></dd>
  </dl>
  <p class="date">年　　　　月　　　　日</p>
</body>
</html>
