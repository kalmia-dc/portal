<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Googleアカウントの利用申請 | カルミアDC</title>
<link rel="stylesheet" href="./portal-common.css?v=20261005"><script defer src="./portal-common.js?v=20261005"></script>
<style>*{box-sizing:border-box}body{font-family:"Yu Gothic UI",Meiryo,sans-serif;background:#f4f8f6;color:#20352c;margin:0;padding:24px 16px}main{max-width:620px;margin:auto;background:white;border:1px solid #cfe0d8;border-radius:20px;padding:28px}h1{font-size:1.5rem;color:#176b4b}p,li{line-height:1.8}a{color:#176b4b;overflow-wrap:anywhere}.button{display:block;padding:16px;border-radius:10px;background:#176b4b;color:white;text-align:center;text-decoration:none}</style>
<style>button,input,select{font:inherit;padding:12px;border:1px solid #aec8bb;border-radius:8px;max-width:100%;width:100%}button{background:#176b4b;color:white;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}label{display:block;margin-top:18px}label input,label select{margin-top:6px}#status{white-space:pre-line;overflow-wrap:anywhere}.secondary{background:#e8f1ed;color:#174f3c}[hidden]{display:none!important}</style>
</head><body><main><h1>スタッフ登録の申請</h1>
<p>Googleアカウントで本人確認し、氏名と職種を入力してください。管理者の承認後にポータルを利用できます。</p>
<p>SafariまたはChromeで開いてください。Googleのパスワードを医院へ伝える必要はありません。</p>
<p id="status" role="status" aria-live="polite">ログイン状態を確認しています。</p>
<button id="login" hidden>Googleアカウントでログイン</button>
<div id="account" hidden><p>申請するアカウント：<strong id="email"></strong></p>
<form id="application" hidden><label for="applicantName">氏名<input id="applicantName" required maxlength="60" autocomplete="name"></label>
<label for="applicantRole">職種<select id="applicantRole" required><option value="">選んでください</option><option value="DR">DR（歯科医師）</option><option value="DH">DH（歯科衛生士）</option><option value="DA">DA（歯科助手）</option></select></label>
<p>職種・雇用形態・利用許可は管理者が確認します。承認前は医院の業務データを閲覧できません。</p>
<button id="submitApplication" type="submit">この内容で申請する</button></form>
<button id="reloadApplication" type="button" class="secondary">申請状況を再読み込み</button>
<button id="changeAccount" type="button" class="secondary">別のGoogleアカウントを使う</button></div>
<p><a href="./index.html">ポータルへ</a></p>
</main><script type="module" src="./portal-join.js"></script></body></html>
