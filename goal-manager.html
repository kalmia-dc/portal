<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目標管理 | カルミアデンタル ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #37b8a9;
    --mint-dark: #20796f;
    --sky: #3f8edb;
    --coral: #e65b5b;
    --amber: #d89226;
    --green: #2f9b65;
    --violet: #7257c9;
    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-alt: #eef6f8;
    --border: #d9e7ec;
    --text: #263238;
    --muted: #60727c;
    --shadow: 0 3px 14px rgba(31, 64, 74, .08);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Maru Gothic', system-ui, sans-serif;
    letter-spacing: 0;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 60px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(31, 64, 74, .06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--text);
    text-decoration: none;
    font-weight: 900;
  }

  .title-wrap { min-width: 0; }
  h1 {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    line-height: 1.05;
    font-weight: 900;
  }
  .subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge, .mode-badge {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .mode-badge.editor {
    color: var(--mint-dark);
    background: #e6f7f4;
    border-color: #b9e7df;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    transition: border-color .15s, transform .15s, background .15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--mint);
    transform: translateY(-1px);
  }

  .btn.primary {
    border-color: var(--mint);
    background: var(--mint);
    color: #fff;
  }

  .btn.secondary {
    background: var(--surface-alt);
  }

  .btn.danger {
    border-color: #f1c2c2;
    color: #b43c3c;
    background: #fff5f5;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
  }

  main {
    width: min(1280px, calc(100% - 28px));
    margin: 18px auto 40px;
  }

  .month-board {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 16px;
    align-items: end;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .section-kicker {
    color: var(--mint-dark);
    font-size: 11px;
    font-weight: 900;
  }

  .month-title {
    margin-top: 3px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 900;
  }

  .month-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .month-controls {
    display: grid;
    grid-template-columns: 220px 130px repeat(2, auto);
    gap: 10px;
    align-items: end;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 160px 150px minmax(220px, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .utility-bar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fbfdfe;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .utility-title {
    font-size: 13px;
    font-weight: 900;
  }

  .utility-note {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .utility-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .utility-actions .btn {
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .field label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    outline: none;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .12);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    min-height: 88px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .stat-value {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
  }

  .stat-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pending-panel {
    margin-bottom: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .pending-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .pending-title {
    font-size: 14px;
    font-weight: 900;
  }

  .pending-sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .pending-count {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 4px 9px;
    border: 1px solid #efd39c;
    border-radius: 999px;
    background: #fff8e8;
    color: #7c5516;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
  }

  .pending-list {
    display: grid;
    gap: 8px;
  }

  .pending-card {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) minmax(220px, .8fr);
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .pending-name {
    font-weight: 900;
  }

  .pending-meta,
  .pending-values {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
  }

  .pending-values {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pending-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .input-badge {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 3px 7px;
    border: 1px solid #efd39c;
    border-radius: 999px;
    background: #fff8e8;
    color: #7c5516;
    font-size: 11px;
    font-weight: 900;
  }

  .input-badge.actual { border-color: #f1c2c2; background: #fff5f5; color: #a23a3a; }
  .input-badge.target { border-color: #c9e1f5; background: #eef7ff; color: #2f6797; }
  .input-badge.average { border-color: #d7cee9; background: #f6f2ff; color: #6149a8; }

  button.input-badge {
    cursor: pointer;
    font-family: inherit;
  }

  button.input-badge:hover {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .1);
  }

  .pending-empty {
    padding: 10px 12px;
    border-radius: var(--radius);
    background: #eef9f4;
    color: #176d46;
    font-size: 13px;
    font-weight: 900;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fbfdfe;
  }

  .panel-title {
    font-weight: 900;
    font-size: 14px;
  }

  .panel-sub {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .table-wrap {
    overflow: auto;
  }

  table {
    width: 100%;
    min-width: 1120px;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f7fbfc;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  td {
    font-size: 13px;
  }

  tr:hover td {
    background: #fbfefe;
  }

  .goal-row.blank td {
    background: #fffdf5;
  }

  .goal-row.blank:hover td {
    background: #fff9e8;
  }

  .goal-main {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .goal-name {
    font-weight: 900;
    color: var(--text);
  }

  .goal-detail {
    max-width: 320px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .average-col {
    min-width: 260px;
  }

  .average-cell {
    display: grid;
    gap: 7px;
  }

  .average-main {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .history-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-width: 380px;
  }

  .history-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 23px;
    padding: 3px 7px;
    border: 1px solid #d6e5ec;
    border-radius: 999px;
    background: #f5fbfd;
    color: var(--text);
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
  }

  .history-chip .history-label {
    color: var(--muted);
    font-weight: 800;
  }

  .history-chip.missing {
    border-color: #efd39c;
    background: #fff8e8;
    color: #7c5516;
  }

  .history-input-btn {
    min-height: 28px;
    padding: 4px 9px;
    border: 1px solid #c9e1f5;
    border-radius: var(--radius);
    background: #eef7ff;
    color: #2f6797;
    font-size: 11px;
    font-weight: 900;
  }

  .monthly-col {
    min-width: 360px;
  }

  .month-value-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 560px;
  }

  .month-value-chip {
    display: grid;
    gap: 2px;
    min-width: 92px;
    padding: 6px 8px;
    border: 1px solid #d6e5ec;
    border-radius: var(--radius);
    background: #f8fbfc;
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
  }

  .month-value-chip.done { border-color: #c5ead4; background: #f2fbf6; }
  .month-value-chip.close { border-color: #efd39c; background: #fff9ea; }
  .month-value-chip.behind { border-color: #edc5c5; background: #fff5f5; }
  .month-value-chip.noTarget { border-color: #c9e1f5; background: #f1f8ff; }
  .month-value-chip.blank { border-color: #efd39c; background: #fff8e8; color: #7c5516; }
  .month-value-chip.future { border-color: #e1e8ec; background: #f6f8f9; color: var(--muted); }

  .month-value-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-weight: 900;
  }

  .month-value-rate {
    color: var(--muted);
    font-size: 10px;
  }

  .month-value-main {
    color: var(--text);
    white-space: nowrap;
  }

  .month-value-sub {
    color: var(--muted);
    white-space: nowrap;
  }

  .month-value-chip.clickable {
    cursor: pointer;
  }

  .month-value-chip.clickable:hover {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .1);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    min-height: 24px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    white-space: nowrap;
  }

  .status-pill.done { color: #176d46; background: #e9f8ef; border-color: #c5ead4; }
  .status-pill.close { color: #8b5b0f; background: #fff5db; border-color: #efd39c; }
  .status-pill.behind { color: #a23a3a; background: #fff0f0; border-color: #edc5c5; }
  .status-pill.noTarget { color: var(--sky); background: #eef7ff; border-color: #c9e1f5; }
  .status-pill.blank { color: var(--muted); }

  .value-missing {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #8a5d11;
    background: #fff3d7;
    border: 1px solid #f0d49a;
    font-size: 11px;
    font-weight: 900;
  }

  .num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    white-space: nowrap;
  }

  .progress {
    display: grid;
    grid-template-columns: 58px 1fr;
    align-items: center;
    gap: 8px;
    min-width: 160px;
  }

  .bar {
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #e5eef2;
  }

  .bar-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--sky);
  }

  .bar-fill.done { background: var(--green); }
  .bar-fill.close { background: var(--amber); }
  .bar-fill.behind { background: var(--coral); }
  .bar-fill.noTarget { background: var(--sky); }

  .actions-cell {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-weight: 900;
  }

  .action-btn {
    width: auto;
    min-width: 52px;
    padding: 0 10px;
  }

  .empty {
    padding: 34px 18px;
    text-align: center;
    color: var(--muted);
  }

  .empty strong {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 8px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 34, 40, .45);
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    width: min(760px, 100%);
    max-height: min(90vh, 820px);
    overflow: auto;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(10, 30, 40, .22);
  }

  .modal-head,
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-foot {
    border-top: 1px solid var(--border);
    border-bottom: 0;
    justify-content: flex-end;
    background: #fbfdfe;
  }

  .modal-title {
    font-weight: 900;
  }

  .quick-input-meta {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
  }

  .quick-input-target {
    display: grid;
    gap: 4px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--surface-alt);
    font-size: 13px;
    font-weight: 900;
  }

  .form-section {
    grid-column: 1 / -1;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--mint-dark);
    font-size: 12px;
    font-weight: 900;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 16px;
  }

  .field.entry-field input {
    border-color: #b9e7df;
    background: #f8fffd;
    font-weight: 900;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  textarea {
    min-height: 86px;
    resize: vertical;
  }

  .history-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 80;
    display: none;
    transform: translateX(-50%);
    max-width: min(520px, calc(100% - 28px));
    padding: 10px 14px;
    border-radius: var(--radius);
    background: #20323a;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 13px;
    font-weight: 800;
  }

  .toast.show {
    display: block;
  }

  .readonly-note {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid #efd39c;
    border-radius: var(--radius);
    background: #fff8e8;
    color: #7c5516;
    font-size: 13px;
    font-weight: 800;
  }

  .import-modal {
    width: min(980px, 100%);
  }

  .import-drop {
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 1px dashed #9fcbd3;
    border-radius: var(--radius);
    background: #f7fbfc;
  }

  .import-actions,
  .import-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .import-status {
    min-height: 24px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .import-status.error {
    color: #b43c3c;
  }

  .import-status.success {
    color: var(--green);
  }

  .import-preview {
    min-height: 120px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .import-candidate-list {
    display: grid;
    gap: 10px;
  }

  .import-candidate {
    display: grid;
    grid-template-columns: 28px minmax(120px, 1.1fr) minmax(130px, 1.2fr) minmax(90px, .7fr) minmax(90px, .7fr);
    gap: 10px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .import-candidate input,
  .import-candidate select {
    width: 100%;
    min-height: 36px;

    .utility-bar { grid-template-columns: 1fr; }
    .utility-actions { justify-content: flex-start; }
    .month-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .history-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 560px) {
    main { width: min(100% - 18px, 1280px); }
    .month-controls { grid-template-columns: 1fr; }

    .toolbar { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .history-grid { grid-template-columns: 1fr; }

      padding: 10px 12px;

    }

    h1 { font-size: 18px; }
    .subtitle { line-height: 1.35; }

    .header-actions {

      grid-template-columns: repeat(2, minmax(0, 1fr));

    .header-actions .btn,

      text-align: center;

    .month-board,
    .utility-bar,
    .toolbar,
    .panel {
      box-shadow: none;
    }

    .month-board { padding: 12px; }
    .month-title { font-size: 20px; }

    .month-controls,
    .utility-actions,
    .toolbar {
      grid-template-columns: 1fr;
    }

    .stats {

    }

    .pending-card {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .pending-card .btn {
      width: 100%;
    }

    .stat {
      min-height: 76px;
      padding: 12px;
    }

    .stat-value { font-size: 24px; }
    .stat-note { white-space: normal; }

    .panel-head {
      align-items: stretch;
      flex-direction: column;
    }

    .panel-head .btn { width: 100%; }

    .table-wrap {
      overflow: visible;
      padding: 10px;
      background: #f7fbfc;
    }

    table {
      display: block;
      min-width: 0;
      border-collapse: separate;
    }

    thead { display: none; }

    tbody {
      display: grid;
      gap: 10px;
    }

    tr.goal-row {
      display: block;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    tr.goal-row:hover td,
    tr.goal-row.blank:hover td,
    tr.goal-row.blank td {
      background: var(--surface);
    }

    tr.goal-row td {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    tr.goal-row td:first-child {
      display: block;
      padding: 12px;
      background: #fbfdfe;
    }

    tr.goal-row td:last-child {
      grid-template-columns: 1fr;
      border-bottom: 0;
      background: #fbfdfe;
    }

    tr.goal-row td::before {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.4;
    }

    tr.goal-row td:first-child::before,
    tr.goal-row td:last-child::before {
      content: none;
    }

    tr.goal-row td:nth-child(2)::before { content: "6ヶ月平均"; }
    tr.goal-row td:nth-child(3)::before { content: "月別数値"; }
    tr.goal-row td:nth-child(4)::before { content: "達成率"; }
    tr.goal-row td:nth-child(5)::before { content: "状況"; }
    tr.goal-row td:nth-child(6)::before { content: "更新"; }

    .goal-detail { max-width: none; }
    .average-col { min-width: 0; }
    .monthly-col { min-width: 0; }
    .history-chips { max-width: none; }
    .month-value-grid { max-width: none; }
    .progress { width: 100%; }
    .actions-cell,
    .action-btn { width: 100%; }

    .modal-backdrop.open {
      align-items: flex-end;
      padding: 0;
    }

    .modal {
      width: 100%;
      max-height: 92vh;
      border-radius: 12px 12px 0 0;
    }

    .modal-head,
    .modal-foot {
      padding: 12px;
    }

    .modal-foot {
      flex-wrap: wrap;
    }

    .modal-foot .btn {
      flex: 1 1 130px;
    }

    .form-grid,
    .history-grid {
      grid-template-columns: 1fr;
    }

    .import-candidate {
      grid-template-columns: 28px minmax(0, 1fr);
    }

    .import-candidate > div:not(.import-raw) {
      grid-column: 2;
    }

    .import-raw {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 420px) {
    .header-actions,
    .stats {
      grid-template-columns: 1fr;
    }

    tr.goal-row td {
      grid-template-columns: 84px minmax(0, 1fr);
    }
  }

  @media print {
    header, .toolbar, .month-controls, .utility-bar, .panel-head .btn, .actions-cell, .readonly-note, .modal-backdrop, .toast {
      display: none !important;
    }
    body { background: #fff; }
    main { width: 100%; margin: 0; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .panel, .stat { box-shadow: none; }
    table { min-width: 0; font-size: 10px; }
    th, td { padding: 6px; }
  }
</style>

<body>
<header>
  <div class="brand">
    <a class="back-link" href="./index.html" title="ポータルに戻る">←</a>
    <div class="title-wrap">
      <h1>目標管理</h1>
      <div class="subtitle">月別入力・6ヶ月平均・半期達成状況</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="user-badge" id="userBadge">読み込み中</span>
    <span class="mode-badge" id="modeBadge">確認中</span>
  </div>
</header>

<main>
  <div class="readonly-note" id="readonlyNote" style="display:none;">閲覧モードです。登録・編集は百々さん（管理者）と杉平院長のみ可能です。</div>

  <section class="month-board" aria-label="月次入力">
    <div>
      <div class="section-kicker">半期集計・月次入力</div>
      <div class="month-title" id="monthActionTitle">集計期間の目標</div>
      <div class="month-meta" id="monthActionSub">読み込み中</div>
    </div>
    <div class="month-controls">
      <div class="field">
        <label for="monthFilter">集計期間</label>
        <select id="monthFilter" onchange="render()"></select>
      </div>
      <div class="field editor-only">
        <label for="entryMonthFilter">追加する月</label>
        <select id="entryMonthFilter" onchange="render()"></select>
      </div>
      <button class="btn primary editor-only" id="seedBtn" onclick="seedTemplates()">この月の標準項目を作成</button>
      <button class="btn secondary editor-only" onclick="openGoalModal()">個別目標を追加</button>
    </div>
  </section>

  <section class="utility-bar" aria-label="補助操作">
    <div>
      <div class="utility-title">出力・通知・取込</div>
      <div class="utility-note">日常入力は上の月次入力から行い、補助操作はこちらにまとめています。</div>
    </div>
    <div class="utility-actions">
      <button class="btn secondary" onclick="exportCSV()">CSV</button>
      <button class="btn secondary" onclick="window.print()">印刷</button>
      <button class="btn secondary editor-only" onclick="openImportModal()">写真/PDF取込</button>
      <button class="btn secondary editor-only" onclick="sendLineWorksSummary()">LINE WORKS通知</button>
    </div>
  </section>

  <section class="toolbar" aria-label="絞り込み">
    <div class="field">
      <label for="statusFilter">達成状況</label>
      <select id="statusFilter" onchange="render()">
        <option value="all">すべて</option>
        <option value="done">達成</option>
        <option value="close">あと少し</option>
        <option value="behind">未達</option>
        <option value="noTarget">目標未設定</option>
        <option value="blank">実績未入力</option>
      </select>
    </div>
    <div class="field">
      <label for="searchInput">検索</label>
      <input type="search" id="searchInput" placeholder="項目・詳細・メモで検索" oninput="render()">
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="pending-panel editor-only" id="pendingPanel"></section>

  <section class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="listTitle">目標一覧</div>
        <div class="panel-sub" id="listSub">読み込み中</div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
  </section>
</main>

<div class="modal-backdrop" id="goalModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">目標を登録</div>
      <button class="icon-btn" onclick="closeGoalModal()" title="閉じる">×</button>
    </div>
    <div class="form-grid">
      <div class="form-section">基本情報</div>
      <div class="field">
        <label for="fMonth">対象月</label>
        <input type="month" id="fMonth">
      </div>
      <div class="field">
        <label for="fItem">項目</label>
        <input type="text" id="fItem" placeholder="例：初診">
      </div>
      <div class="field">
        <label for="fUnit">単位</label>
        <input type="text" id="fUnit" placeholder="例：人、件、円、%">
      </div>
      <div class="field full">
        <label for="fDetail">詳細</label>
        <textarea id="fDetail" placeholder="計算方法・対象範囲など"></textarea>
      </div>
      <div class="form-section">毎月入力する数値</div>
      <div class="field">
        <label for="fDirection">判定方向</label>
        <select id="fDirection">
          <option value="up">多いほど達成</option>
          <option value="down">少ないほど達成</option>
        </select>
      </div>
      <div class="field">
        <label for="fCurrent">6ヶ月平均</label>
        <input type="text" id="fCurrent" inputmode="decimal" placeholder="例：31">
      </div>
      <div class="field full" id="historySection">
        <label>6ヶ月平均の内訳</label>
        <div class="history-grid">
          <input type="text" id="fHistoryLabel1" placeholder="月">
          <input type="text" id="fHistoryLabel2" placeholder="月">
          <input type="text" id="fHistoryLabel3" placeholder="月">

          <input type="text" id="fHistoryLabel5" placeholder="月">
          <input type="text" id="fHistoryLabel6" placeholder="月">

          <input type="text" id="fHistoryValue3" inputmode="decimal" placeholder="数値">
          <input type="text" id="fHistoryValue4" inputmode="decimal" placeholder="数値">
          <input type="text" id="fHistoryValue5" inputmode="decimal" placeholder="数値">
          <input type="text" id="fHistoryValue6" inputmode="decimal" placeholder="数値">
        </div>
      </div>
      <div class="field">
        <label for="fTarget">今月の目標値</label>
        <input type="text" id="fTarget" inputmode="decimal" placeholder="例：35">
      </div>
      <div class="field entry-field">
        <label for="fActual">今月の実績値</label>
        <input type="text" id="fActual" inputmode="decimal" placeholder="例：32">
      </div>
      <div class="form-section">補足</div>
      <div class="field">
        <label for="fOwner">入力担当</label>
        <input type="text" id="fOwner" placeholder="例：百々">
      </div>
      <div class="field full">
        <label for="fNote">メモ</label>
        <textarea id="fNote" placeholder="補足・確認事項"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="deleteBtn" onclick="deleteGoal()" style="display:none;">削除</button>
      <button class="btn secondary" onclick="closeGoalModal()">キャンセル</button>
      <button class="btn primary" id="saveBtn" onclick="saveGoal()">保存</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="quickInputModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal" style="width:min(460px,100%);">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="quickInputTitle">数値を入力</div>
        <div class="quick-input-meta" id="quickInputSub"></div>
      </div>
      <button class="icon-btn" onclick="closeQuickInputModal()" title="閉じる">×</button>
    </div>
    <div class="form-grid">
      <div class="field full">
        <div class="quick-input-target" id="quickInputTarget"></div>
      </div>
      <div class="field full">
        <label for="quickInputValue" id="quickInputLabel">数値</label>
        <input type="text" id="quickInputValue" inputmode="decimal" placeholder="数値を入力" onkeydown="if(event.key==='Enter') saveQuickGoalInput()">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeQuickInputModal()">キャンセル</button>
      <button class="btn primary" id="quickInputSaveBtn" onclick="saveQuickGoalInput()">保存</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="importModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal import-modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">写真/PDFから取り込み</div>
        <div class="panel-sub">読み取り後、候補を確認してから保存します</div>
      </div>
      <button class="icon-btn" onclick="closeImportModal()" title="閉じる">×</button>
    </div>
    <div class="form-grid">
      <div class="form-section">ファイル</div>
      <div class="field">
        <label for="importMonth">反映する月</label>
        <input type="month" id="importMonth">
      </div>
      <div class="field">
        <label for="importApoInitial">アポツール初診数</label>
        <input type="text" id="importApoInitial" inputmode="numeric" placeholder="例：70">
      </div>
      <div class="field full">
        <label for="importFile">PDF / 写真</label>
        <div class="import-drop">
          <input type="file" id="importFile" accept="application/pdf,.pdf,image/*" onchange="handleImportFile(this.files[0])">
          <div class="import-actions">
            <button class="btn secondary" type="button" onclick="document.getElementById('importFile').click()">ファイルを選択</button>
            <button class="btn secondary" type="button" onclick="analyzeImportText()">テキストから候補作成</button>

          <div class="import-status" id="importStatus">PDFは文字抽出、写真やスキャンPDFはOCRで読み取ります。</div>

      </div>
      <div class="form-section">読み取りテキスト</div>
      <div class="field full">
        <label for="importRawText">抽出結果</label>
        <textarea class="import-preview" id="importRawText" placeholder="読み取り結果がここに入ります。手入力や貼り付けでも候補作成できます。"></textarea>
      </div>
      <div class="form-section">保存前確認</div>
      <div class="field full">
        <div class="import-row-actions">
          <button class="btn secondary" type="button" onclick="setAllImportCandidates(true)">すべて選択</button>

      </div>
      <div class="field full">
        <div class="import-candidate-list" id="importCandidates">
          <div class="empty">ファイルを読み込むか、テキストを貼り付けて候補を作成してください。</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeImportModal()">キャンセル</button>
      <button class="btn primary" id="importSaveBtn" onclick="saveImportCandidates()">選択した候補を保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let currentUser = resolveUser();

let allPrivateMetrics = {};

let renderedGoalGroups = new Map();
let quickInputContext = null;
let saving = false;

function resolveUser() {
  try {
    const saved = sessionStorage.getItem('portalUser');
    if (saved) {
      const user = JSON.parse(saved);
      if (user?.staffId) return normalizeUser(user);
    }
  } catch(e) {}

  const params = new URLSearchParams(location.search);
  const sid = params.get('sid') || '';
  if (sid) {
    return normalizeUser({
      staffId: sid,
      name: params.get('name') || STAFF_NAMES[sid] || sid,
      pass: params.get('p') || '',
      role: roleFromStaffId(sid)
    });
  }

  return { staffId: '', name: 'ゲスト', role: '', pass: '' };
}

function normalizeUser(user) {
  const sid = user.staffId || '';
  return {
    ...user,
    staffId: sid,
    name: sid === 'sugihira' ? '杉平院長' : (user.name || STAFF_NAMES[sid] || 'ゲスト'),
    role: user.role || roleFromStaffId(sid)
  };
}

function roleFromStaffId(sid) {
  if (['sugihira', 'shimanaka', 'hokari', 'shinoda'].includes(sid)) return 'DR';
  if (['tsuruta', 'yoshida', 'takagi', 'matsumoto', 'yamada', 'hanowa'].includes(sid)) return 'DH';
  if (['tamiya', 'tanaka', 'momo'].includes(sid)) return 'DA';
  return '';
}

function isEditor() {
  return EDITOR_IDS.includes(currentUser.staffId);
}

function init() {
  populatePeriodFilter(false);
  populateEntryMonthFilter();
  document.getElementById('userBadge').textContent = currentUser.name;

    modeBadge.classList.add('editor');

    document.getElementById('readonlyNote').style.display = 'block';
    document.querySelectorAll('.editor-only').forEach(el => el.style.display = 'none');

    populateEntryMonthFilter();

function currentMonth(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function selectedPeriodMonth() {
  return document.getElementById('monthFilter')?.value || halfYearStart(currentMonth());
}

function defaultInputMonthForPeriod(periodMonth = selectedPeriodMonth()) {
  const months = periodMonths(periodMonth);
  const available = months.filter(month => month <= currentMonth());
  return available.length ? available[available.length - 1] : months[0];
}

function selectedEntryMonth() {
  return document.getElementById('entryMonthFilter')?.value || defaultInputMonthForPeriod();
}

function availablePeriodStarts() {
  const starts = new Set([
    halfYearStart(addMonths(currentMonth(), -6)),
    halfYearStart(currentMonth())
  ]);
  Object.values(allGoals).forEach(goal => {
    if (goal.month) starts.add(halfYearStart(goal.month));
  });
  Object.values(allPrivateMetrics).forEach(metric => {
    if (metric.month) starts.add(halfYearStart(metric.month));
  });
  return Array.from(starts).sort();
}

function populatePeriodFilter(preserve = true) {
  const select = document.getElementById('monthFilter');
  if (!select) return;
  const currentValue = preserve ? select.value : '';
  const fallback = halfYearStart(currentMonth());
  const starts = availablePeriodStarts();
  if (currentValue) starts.push(currentValue);
  select.innerHTML = Array.from(new Set(starts)).sort()
    .map(start => `<option value="${start}">${periodLabel(start)}</option>`)
    .join('');
  select.value = currentValue && starts.includes(currentValue) ? currentValue : fallback;
}

function populateEntryMonthFilter() {
  const select = document.getElementById('entryMonthFilter');
  if (!select) return;
  const currentValue = select.value;
  const months = periodMonths(selectedPeriodMonth());
  select.innerHTML = months
    .map(month => `<option value="${month}">${monthShortLabel(month)}</option>`)
    .join('');
  select.value = months.includes(currentValue) ? currentValue : defaultInputMonthForPeriod();
}

function monthLabel(month) {
  const [y, m] = month.split('-');
  return `${y}年${Number(m)}月`;
}

function monthShortLabel(month) {
  if (!month || !month.includes('-')) return '-';
  const [, m] = month.split('-');
  return `${Number(m)}月`;
}

function addMonths(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function halfYearStart(month) {
  const [year, monthNumber] = month.split('-').map(Number);
  if (monthNumber >= 6 && monthNumber <= 11) return `${year}-06`;
  if (monthNumber === 12) return `${year}-12`;
  return `${year - 1}-12`;
}

function periodMonths(month) {
  const start = halfYearStart(month);
  return Array.from({ length: 6 }, (_, index) => addMonths(start, index));
}

function averageInputMonths(month) {
  const selectedMonth = month || document.getElementById('monthFilter')?.value || currentMonth();
  const months = periodMonths(selectedMonth);
  const periodEnd = months[months.length - 1];
  const cutoffMonth = periodEnd <= currentMonth() ? periodEnd : currentMonth();
  return months.filter(item => item <= cutoffMonth);
}

function periodLabel(month) {
  const months = periodMonths(month);
  return `${monthLabel(months[0])}〜${monthLabel(months[months.length - 1])}`;
}

function periodFileLabel(month) {
  const months = periodMonths(month);
  return `${months[0]}_${months[months.length - 1]}`;
}

function blankHistory() {
  return Array.from({ length: HISTORY_MONTH_COUNT }, () => ({ label: '', value: '' }));
}

function normalizeHistory(history = []) {
  return blankHistory().map((blank, index) => {
    const item = history[index] || {};
    return {
      label: item.label || blank.label,
      value: item.value ?? blank.value
    };
  });
}

function parseNumber(value) {
  if (value === null || value === undefined) return null;
  const text = String(value).replace(/,/g, '').trim();
  if (text === '') return null;
  const n = Number(text);
  return Number.isFinite(n) ? n : null;
}

function canonicalGoalItem(item) {
  const text = String(item || '').trim();
  if (['一日平均来院数', '1日平均来院数', '１日平均来院数', '1日平均来院者数'].includes(text)) {
    return '一日平均来院数';
  }
  return text;
}

function canonicalPrivateMetricItem(item) {
  const text = String(item || '').trim();
  if (text === '自費売上' || text === '自費売上高') return '自費売上';
  if (text === '保険売上' || text === '保険売上高') return '保険売上';
  return text;
}

function privateMetricValue(month, item) {
  const itemKey = canonicalPrivateMetricItem(item);
  const metric = Object.values(allPrivateMetrics)
    .find(row => row.month === month && canonicalPrivateMetricItem(row.item) === itemKey);
  return parseNumber(metric?.value);
}

function calculatedSelfPayRateValue(month) {
  const selfPaySales = privateMetricValue(month, '自費売上');
  const insuranceSales = privateMetricValue(month, '保険売上');
  if (selfPaySales === null || insuranceSales === null || selfPaySales + insuranceSales <= 0) return '';
  return formatAverageValue((selfPaySales / (selfPaySales + insuranceSales)) * 100);
}

function actualValueForGoal(goal) {
  if (canonicalGoalItem(goal.item) !== '自費率') return goal.actualValue;
  return calculatedSelfPayRateValue(goal.month) || goal.actualValue;
}

function displayGoalItem(item) {
  return canonicalGoalItem(item);
}

function goalGroupKey(goal) {
  return [
    canonicalGoalItem(goal.item),
    goal.unit || ''
  ].join('|');
}

function formatAverageValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return Math.abs(n - Math.round(n)) < 0.000001
    ? String(Math.round(n))
    : String(Number(n.toFixed(2)));
}

function goalRowsForAverage(goal) {
  const key = goalGroupKey(goal);
  return Object.entries(allGoals)
    .map(([id, item]) => ({ id, ...item }))
    .filter(item => goalGroupKey(item) === key);
}

function goalActualForMonth(goal, month) {
  const row = goalRowsForAverage(goal).find(item => item.month === month);
  if (!row) return null;
  const actualValue = actualValueForGoal(row);
  const actualNumber = parseNumber(actualValue);
  return actualNumber === null ? null : { ...row, month, actualValue, actualNumber };
}

function selfPayRateActualForMonth(month) {
  const calculatedValue = calculatedSelfPayRateValue(month);
  const calculatedNumber = parseNumber(calculatedValue);
  if (calculatedNumber !== null) {
    return {
      month,
      item: '自費率',
      unit: '%',
      actualValue: calculatedValue,
      actualNumber: calculatedNumber
    };
  }

  const fallback = Object.entries(allGoals)
    .map(([id, item]) => ({ id, ...item }))
    .find(item => item.month === month && canonicalGoalItem(item.item) === '自費率');
  const fallbackNumber = parseNumber(fallback?.actualValue);
  return fallbackNumber === null ? null : {
    ...fallback,
    month,
    actualValue: fallback.actualValue,
    actualNumber: fallbackNumber
  };
}

function actualForAverageMonth(goal, month) {
  return canonicalGoalItem(goal.item) === '自費率'
    ? selfPayRateActualForMonth(month)
    : goalActualForMonth(goal, month);
}

function actualGoalsForAverage(goal) {
  const baseMonth = goal.month || document.getElementById('monthFilter')?.value || currentMonth();
  return averageInputMonths(baseMonth)
    .map(month => actualForAverageMonth(goal, month))
    .filter(Boolean)
    .sort((a, b) => (a.month || '').localeCompare(b.month || ''));
}

function computedAverage(goal) {
  const goals = actualGoalsForAverage(goal);
  if (!goals.length) return { value: '', history: [] };
  const average = goals.reduce((sum, item) => sum + item.actualNumber, 0) / goals.length;
  return {
    value: formatAverageValue(average),
    history: goals.map(item => ({
      month: item.month,
      label: monthShortLabel(item.month),
      value: item.actualValue
    }))
  };
}

function currentValueForDisplay(goal) {
  const computed = computedAverage(goal);
  return computed.value !== '' ? computed.value : goal.currentValue;
}

function historyForDisplay(goal) {
  const computed = computedAverage(goal);
  if (computed.history.length) return computed.history;
  return normalizeHistory(goal.history || []).filter(item => item.label || item.value !== '');
}

function fmtNumber(value, unit = '') {
  const n = parseNumber(value);
  if (n === null) return '-';
  const formatted = Math.abs(n) >= 1000
    ? n.toLocaleString('ja-JP', { maximumFractionDigits: 2 })
    : String(Number(n.toFixed(2)));
  return unit ? `${formatted}${unit}` : formatted;
}

function calcRateValues(actual, target, direction = 'up') {
  if (target === null || target === 0 || actual === null) return null;
  if (direction === 'down') {
    if (actual <= 0) return 100;
    return Math.min(200, (target / actual) * 100);
  }
  return Math.min(200, (actual / target) * 100);
}

function calcRate(goal) {
  const target = parseNumber(goal.targetValue);
  const actual = parseNumber(actualValueForGoal(goal));
  return calcRateValues(actual, target, goal.direction);
}

function goalStatus(goal) {
  const target = parseNumber(goal.targetValue);
  const actual = parseNumber(actualValueForGoal(goal));
  if (actual === null) return 'blank';
  if (target === null || target === 0) return 'noTarget';
  const rate = calcRate(goal);
  if (rate >= 100) return 'done';
  if (rate >= 80) return 'close';
  return 'behind';
}

function statusLabel(status) {
  return {
    done: '達成',
    close: 'あと少し',
    behind: '未達',
    noTarget: '目標未設定',
    blank: '実績未入力'
  }[status] || '-';
}

function monthGoals(month) {
  return Object.entries(allGoals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => goal.month === month);
}

function periodGoals(month) {
  const periodSet = new Set(periodMonths(month));
  return Object.entries(allGoals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => periodSet.has(goal.month || ''));
}

function periodGoalGroups(periodMonth) {
  const groups = new Map();
  periodGoals(periodMonth).forEach(goal => {
    const key = goalGroupKey(goal);
    if (!groups.has(key)) {
      groups.set(key, {
        key,
        periodMonth,
        item: canonicalGoalItem(goal.item),
        unit: goal.unit || '',
        detail: goal.detail || '',
        direction: goal.direction || 'up',
        owner: goal.owner || '',
        note: goal.note || '',
        rows: [],
        rowsByMonth: {}
      });
    }
    const group = groups.get(key);
    group.rows.push(goal);
    group.rowsByMonth[goal.month] = goal;
  });

  groups.forEach(group => {
    group.rows.sort((a, b) => (a.month || '').localeCompare(b.month || ''));
    const latest = [...group.rows].reverse().find(row => row.month <= currentMonth()) || group.rows[group.rows.length - 1];
    group.prototype = latest;
    group.item = canonicalGoalItem(latest.item);
    group.unit = latest.unit || group.unit;
    group.detail = latest.detail || group.detail;
    group.direction = latest.direction || group.direction;
    group.owner = latest.owner || group.owner;
    group.note = latest.note || group.note;
    group.targetValue = latest.targetValue ?? '';
    group.updatedAt = Math.max(...group.rows.map(row => Number(row.updatedAt || row.createdAt || 0)));
    group.updatedBy = latest.updatedBy || latest.createdBy || '';
  });

  return Array.from(groups.values()).sort((a, b) => displayGoalItem(a.item).localeCompare(displayGoalItem(b.item), 'ja'));
}

function groupSearchText(group) {
  return [
    displayGoalItem(group.item),
    group.item,
    group.detail,
    group.note,
    group.owner,
    ...group.rows.map(row => row.note)
  ].filter(Boolean).join(' ').toLowerCase();
}

function monthStatusForGroup(group, month) {
  const actual = actualForAverageMonth(group.prototype, month);
  if (month > currentMonth() && !actual) return 'future';
  const targetValue = group.rowsByMonth[month]?.targetValue ?? group.targetValue;
  const target = parseNumber(targetValue);
  if (!actual) return 'blank';
  if (target === null || target === 0) return 'noTarget';
  const rate = calcRateValues(actual.actualNumber, target, group.direction);
  if (rate >= 100) return 'done';
  if (rate >= 80) return 'close';
  return 'behind';
}

function groupStatus(group) {
  const statuses = averageInputMonths(group.periodMonth).map(month => monthStatusForGroup(group, month));
  if (!statuses.length) return 'blank';
  if (statuses.includes('blank')) return 'blank';
  if (statuses.includes('noTarget')) return 'noTarget';
  if (statuses.includes('behind')) return 'behind';
  if (statuses.includes('close')) return 'close';
  return 'done';
}

function filterGoalGroups(groups) {
  const status = document.getElementById('statusFilter').value;
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  return groups
    .filter(group => status === 'all' || groupStatus(group) === status)
    .filter(group => !query || groupSearchText(group).includes(query));
}

function filteredGoalGroups() {
  return filterGoalGroups(periodGoalGroups(selectedPeriodMonth()));
}

function render() {
  populateEntryMonthFilter();
  const periodMonth = selectedPeriodMonth();
  const goalsForPeriod = periodGoals(periodMonth);
  const allGroups = periodGoalGroups(periodMonth);
  allGroups.forEach((group, index) => { group.uiKey = `g${index}`; });
  renderedGoalGroups = new Map(allGroups.map(group => [group.uiKey, group]));
  const groups = filterGoalGroups(allGroups);
  document.getElementById('listTitle').textContent = `${periodLabel(periodMonth)} 目標一覧`;
  document.getElementById('listSub').textContent = `${groups.length}項目表示 / 半期${allGroups.length}項目 / 月別データ${goalsForPeriod.length}件`;
  renderMonthBoard(periodMonth, goalsForPeriod, allGroups);
  renderStats(allGroups, goalsForPeriod, periodMonth);
  renderPendingGoals(allGroups, periodMonth);
  renderTable(groups, allGroups.length);
}

function missingGoalFields(goal) {
  const fields = [];
  const target = parseNumber(goal.targetValue);
  const actual = parseNumber(actualValueForGoal(goal));
  const average = parseNumber(currentValueForDisplay(goal));
  const history = historyForDisplay(goal);
  if (target === null || target === 0) fields.push({ key: 'target', label: '目標値' });
  if (actual === null) fields.push({ key: 'actual', label: '実績' });
  if (average === null && !history.length) fields.push({ key: 'average', label: '6ヶ月平均' });
  return fields;
}

function missingFieldsForGroupMonth(group, month) {
  if (month > currentMonth()) return [];
  const row = group.rowsByMonth[month];
  const actual = actualForAverageMonth(group.prototype, month);
  const targetValue = row?.targetValue ?? group.targetValue;
  const fields = [];
  if (parseNumber(targetValue) === null || parseNumber(targetValue) === 0) fields.push({ key: 'target', label: '目標値' });
  if (!actual) fields.push({ key: 'actual', label: '実績' });
  return fields;
}

function renderPendingGoals(groups, periodMonth) {
  const panel = document.getElementById('pendingPanel');
  if (!panel || !isEditor()) return;
  const inputMonths = averageInputMonths(periodMonth);
  const pending = groups
    .map(group => {
      const missingMonths = inputMonths
        .map(month => ({ month, fields: missingFieldsForGroupMonth(group, month) }))
        .filter(item => item.fields.length);
      return { ...group, missingMonths };
    })
    .filter(group => group.missingMonths.length)
    .sort((a, b) => b.missingMonths.length - a.missingMonths.length || displayGoalItem(a.item).localeCompare(displayGoalItem(b.item), 'ja'));
  const actualMissing = pending.reduce((count, group) => count + group.missingMonths.filter(item => item.fields.some(field => field.key === 'actual')).length, 0);
  const targetMissing = pending.reduce((count, group) => count + group.missingMonths.filter(item => item.fields.some(field => field.key === 'target')).length, 0);

  panel.innerHTML = `
    <div class="pending-head">
      <div>
        <div class="pending-title">入力待ち</div>
        <div class="pending-sub">半期内の未入力月をここから順番に入力できます</div>
      </div>
      <div class="pending-count">${pending.length}件</div>
    </div>
    ${pending.length ? `
      <div class="pending-sub" style="margin-bottom:8px">実績未入力 ${actualMissing}件 / 目標未設定 ${targetMissing}件</div>
      <div class="pending-list">${pending.map(pendingGoalCardHtml).join('')}</div>
    ` : '<div class="pending-empty">この半期の入力待ちはありません</div>'}`;
}

function pendingGoalCardHtml(group) {
  const buttons = group.missingMonths
    .flatMap(item => item.fields.map(field => ({ month: item.month, field })))
    .map(item => `
      <button class="input-badge ${item.field.key}" onclick="openQuickGoalInput('${group.uiKey}','${item.month}','${item.field.key}')">
        ${escapeHtml(monthShortLabel(item.month))} ${escapeHtml(item.field.label)}
      </button>`)
    .join('');
  return `
    <div class="pending-card">
      <div>
        <div class="pending-name">${escapeHtml(displayGoalItem(group.item))}</div>
        <div class="pending-meta">${escapeHtml(group.detail || '')}</div>
        <div class="pending-actions" style="margin-top:6px">${buttons}</div>
      </div>
      <div class="pending-values">
        <span>不足月: ${group.missingMonths.length}件</span>
        <span>平均: ${pendingValueHtml(currentValueForDisplay(group.prototype), group.unit)}</span>
      </div>
    </div>`;
}

function pendingValueHtml(value, unit = '', zeroIsMissing = false) {
  const parsed = parseNumber(value);
  return parsed === null || (zeroIsMissing && parsed === 0)
    ? '<span class="input-badge">未入力</span>'
    : `<span class="num">${fmtNumber(value, unit)}</span>`;
}

function renderMonthBoard(periodMonth, periodGoals, groups) {
  const blank = groups.filter(group => groupStatus(group) === 'blank').length;
  const noTarget = groups.filter(group => groupStatus(group) === 'noTarget').length;
  const done = groups.filter(group => groupStatus(group) === 'done').length;
  const seedBtn = document.getElementById('seedBtn');
  const entryMonth = selectedEntryMonth();
  document.getElementById('monthActionTitle').textContent = periodLabel(periodMonth);
  document.getElementById('monthActionSub').textContent = periodGoals.length
    ? `追加する月: ${monthLabel(entryMonth)} / 半期${groups.length}項目 / 月別データ${periodGoals.length}件 / 入力待ち${blank}項目 / 目標未設定${noTarget}項目 / 達成${done}項目`
    : `追加する月: ${monthLabel(entryMonth)} / この半期の目標は未作成`;
  if (seedBtn) {
    seedBtn.textContent = monthGoals(entryMonth).length ? '標準項目を追加' : '選択月の標準項目を作成';
  }
}

function renderStats(groups, goals, periodMonth) {
  const total = groups.length;
  const done = groups.filter(group => groupStatus(group) === 'done').length;
  const close = groups.filter(group => groupStatus(group) === 'close').length;
  const behind = groups.filter(group => groupStatus(group) === 'behind').length;
  const noTarget = groups.filter(group => groupStatus(group) === 'noTarget').length;
  const blank = groups.filter(group => groupStatus(group) === 'blank').length;
  const avgRates = goals.map(calcRate).filter(v => v !== null);
  const avg = avgRates.length ? avgRates.reduce((a, b) => a + b, 0) / avgRates.length : null;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">半期項目</div><div class="stat-value">${total}</div><div class="stat-note">${periodLabel(periodMonth)}</div></div>
    <div class="stat"><div class="stat-label">入力待ち</div><div class="stat-value" style="color:var(--amber)">${blank}</div><div class="stat-note">不足月がある項目</div></div>
    <div class="stat"><div class="stat-label">達成</div><div class="stat-value" style="color:var(--green)">${done}</div><div class="stat-note">入力済み月がすべて達成</div></div>
    <div class="stat"><div class="stat-label">要確認</div><div class="stat-value" style="color:var(--coral)">${behind}</div><div class="stat-note">あと少し ${close} / 目標未設定 ${noTarget} / 平均 ${avg === null ? '-' : `${Math.round(avg)}%`}</div></div>`;
}

function renderTable(groups, totalGroups) {
  const wrap = document.getElementById('tableWrap');
  if (!totalGroups) {
    wrap.innerHTML = `
      <div class="empty">
        <strong>この半期の目標は未登録です</strong>
        <div>管理者または院長は、追加する月を選んで標準項目を作成できます。</div>
      </div>`;

      <div class="empty">
        <strong>条件に合う目標がありません</strong>
