<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目標管理 | カルミアデンタル ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #37b8a9;
    --mint-dark: #20796f;
    --sky: #3f8edb;
    --coral: #e65b5b;
    --amber: #d89226;
    --green: #2f9b65;
    --violet: #7257c9;
    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-alt: #eef6f8;
    --border: #d9e7ec;
    --text: #263238;
    --muted: #60727c;
    --shadow: 0 3px 14px rgba(31, 64, 74, .08);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Maru Gothic', system-ui, sans-serif;
    letter-spacing: 0;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 60px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(31, 64, 74, .06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--text);
    text-decoration: none;
    font-weight: 900;
  }

  .title-wrap { min-width: 0; }
  h1 {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    line-height: 1.05;
    font-weight: 900;
  }
  .subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge, .mode-badge {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .mode-badge.editor {
    color: var(--mint-dark);
    background: #e6f7f4;
    border-color: #b9e7df;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    transition: border-color .15s, transform .15s, background .15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--mint);
    transform: translateY(-1px);
  }

  .btn.primary {
    border-color: var(--mint);
    background: var(--mint);
    color: #fff;
  }

  .btn.secondary {
    background: var(--surface-alt);
  }

  .btn.danger {
    border-color: #f1c2c2;
    color: #b43c3c;
    background: #fff5f5;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
  }

  main {
    width: min(1280px, calc(100% - 28px));
    margin: 18px auto 40px;
  }

  .month-board {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 16px;
    align-items: end;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .section-kicker {
    color: var(--mint-dark);
    font-size: 11px;
    font-weight: 900;
  }

  .month-title {
    margin-top: 3px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 900;
  }

  .month-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .month-controls {
    display: grid;
    grid-template-columns: 160px repeat(2, auto);
    gap: 10px;
    align-items: end;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 160px 150px minmax(220px, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .utility-bar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fbfdfe;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .utility-title {
    font-size: 13px;
    font-weight: 900;
  }

  .utility-note {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .utility-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .utility-actions .btn {
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .field label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    outline: none;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(55, 184, 169, .12);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    min-height: 88px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .stat-value {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
  }

  .stat-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: #fbfdfe;
  }

  .panel-title {
    font-weight: 900;
    font-size: 14px;
  }

  .panel-sub {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .table-wrap {
    overflow: auto;
  }

  table {
    width: 100%;
    min-width: 1120px;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f7fbfc;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  td {
    font-size: 13px;
  }

  tr:hover td {
    background: #fbfefe;
  }

  .goal-row.blank td {
    background: #fffdf5;
  }

  .goal-row.blank:hover td {
    background: #fff9e8;
  }

  .goal-main {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .goal-name {
    font-weight: 900;
    color: var(--text);
  }

  .goal-detail {
    max-width: 320px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  .dept-pill, .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    min-height: 24px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    white-space: nowrap;
  }

  .dept-pill.all { color: #2d6574; background: #e9f5f8; border-color: #cde5ed; }
  .dept-pill.director { color: #7a4a14; background: #fff3df; border-color: #f2d6aa; }
  .dept-pill.reception { color: #8b3f67; background: #fdebf5; border-color: #f2bfd9; }
  .dept-pill.dh { color: #315f9d; background: #eaf2ff; border-color: #cbdcf6; }
  .dept-pill.da { color: #5f4aa2; background: #f1edff; border-color: #d9cef8; }

  .status-pill.done { color: #176d46; background: #e9f8ef; border-color: #c5ead4; }
  .status-pill.close { color: #8b5b0f; background: #fff5db; border-color: #efd39c; }
  .status-pill.behind { color: #a23a3a; background: #fff0f0; border-color: #edc5c5; }
  .status-pill.noTarget { color: var(--sky); background: #eef7ff; border-color: #c9e1f5; }
  .status-pill.blank { color: var(--muted); }

  .value-missing {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #8a5d11;
    background: #fff3d7;
    border: 1px solid #f0d49a;
    font-size: 11px;
    font-weight: 900;
  }

  .num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    white-space: nowrap;
  }

  .progress {
    display: grid;
    grid-template-columns: 58px 1fr;
    align-items: center;
    gap: 8px;
    min-width: 160px;
  }

  .bar {
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #e5eef2;
  }

  .bar-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--sky);
  }

  .bar-fill.done { background: var(--green); }
  .bar-fill.close { background: var(--amber); }
  .bar-fill.behind { background: var(--coral); }
  .bar-fill.noTarget { background: var(--sky); }

  .actions-cell {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-weight: 900;
  }

  .action-btn {
    width: auto;
    min-width: 52px;
    padding: 0 10px;
  }

  .empty {
    padding: 34px 18px;
    text-align: center;
    color: var(--muted);
  }

  .empty strong {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 8px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 34, 40, .45);
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    width: min(760px, 100%);
    max-height: min(90vh, 820px);
    overflow: auto;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(10, 30, 40, .22);
  }

  .modal-head,
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-foot {
    border-top: 1px solid var(--border);
    border-bottom: 0;
    justify-content: flex-end;
    background: #fbfdfe;
  }

  .modal-title {
    font-weight: 900;
  }

  .form-section {
    grid-column: 1 / -1;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--mint-dark);
    font-size: 12px;
    font-weight: 900;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 16px;
  }

  .field.entry-field input {
    border-color: #b9e7df;
    background: #f8fffd;
    font-weight: 900;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  textarea {
    min-height: 86px;
    resize: vertical;
  }

  .history-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 80;
    display: none;
    transform: translateX(-50%);
    max-width: min(520px, calc(100% - 28px));
    padding: 10px 14px;
    border-radius: var(--radius);
    background: #20323a;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 13px;
    font-weight: 800;
  }

  .toast.show {
    display: block;
  }

  .readonly-note {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid #efd39c;
    border-radius: var(--radius);
    background: #fff8e8;
    color: #7c5516;
    font-size: 13px;
    font-weight: 800;
  }

  .import-modal {
    width: min(980px, 100%);
  }

  .import-drop {
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 1px dashed #9fcbd3;
    border-radius: var(--radius);
    background: #f7fbfc;
  }

  .import-actions,
  .import-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .import-status {
    min-height: 24px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .import-status.error {
    color: #b43c3c;
  }

  .import-status.success {
    color: var(--green);
  }

  .import-preview {
    min-height: 120px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .import-candidate-list {
    display: grid;
    gap: 10px;
  }

  .import-candidate {
    display: grid;
    grid-template-columns: 28px minmax(120px, 1.1fr) minmax(130px, 1.2fr) minmax(90px, .7fr) minmax(90px, .7fr);
    gap: 10px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fbfdfe;
  }

  .import-candidate input,
  .import-candidate select {
    width: 100%;
    min-height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 8px;
  }

  .import-candidate-label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  .import-raw {
    grid-column: 2 / -1;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }

  @media (max-width: 920px) {
    header { align-items: flex-start; flex-direction: column; }
    .header-actions { justify-content: flex-start; width: 100%; }
    .month-board { grid-template-columns: 1fr; align-items: stretch; }
    .utility-bar { grid-template-columns: 1fr; }
    .utility-actions { justify-content: flex-start; }
    .month-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .month-controls .field { grid-column: 1 / -1; }
    .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .history-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 560px) {
    main { width: min(100% - 18px, 1280px); }
    .month-controls { grid-template-columns: 1fr; }
    .month-controls .field { grid-column: auto; }
    .toolbar { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .history-grid { grid-template-columns: 1fr; }
    .utility-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .btn { flex: 1 1 auto; }
    .user-badge, .mode-badge { max-width: 100%; }
  }

  @media (max-width: 720px) {
    header {
      position: static;
      align-items: flex-start;
      padding: 10px 12px;
    }

    .brand {
      width: 100%;
      align-items: flex-start;
    }

    h1 { font-size: 18px; }
    .subtitle { line-height: 1.35; }

    .header-actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .header-actions .btn,
    .header-actions .user-badge,
    .header-actions .mode-badge {
      width: 100%;
      justify-content: center;
      white-space: normal;
      text-align: center;
    }

    main {
      width: calc(100% - 16px);
      margin: 12px auto 28px;
    }

    .month-board,
    .utility-bar,
    .toolbar,
    .panel {
      box-shadow: none;
    }

    .month-board { padding: 12px; }
    .month-title { font-size: 20px; }

    .month-controls,
    .utility-actions,
    .toolbar {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat {
      min-height: 76px;
      padding: 12px;
    }

    .stat-value { font-size: 24px; }
    .stat-note { white-space: normal; }

    .panel-head {
      align-items: stretch;
      flex-direction: column;
    }

    .panel-head .btn { width: 100%; }

    .table-wrap {
      overflow: visible;
      padding: 10px;
      background: #f7fbfc;
    }

    table {
      display: block;
      min-width: 0;
      border-collapse: separate;
    }

    thead { display: none; }

    tbody {
      display: grid;
      gap: 10px;
    }

    tr.goal-row {
      display: block;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    tr.goal-row:hover td,
    tr.goal-row.blank:hover td,
    tr.goal-row.blank td {
      background: var(--surface);
    }

    tr.goal-row td {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    tr.goal-row td:first-child {
      display: block;
      padding: 12px;
      background: #fbfdfe;
    }

    tr.goal-row td:last-child {
      grid-template-columns: 1fr;
      border-bottom: 0;
      background: #fbfdfe;
    }

    tr.goal-row td::before {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.4;
    }

    tr.goal-row td:first-child::before,
    tr.goal-row td:last-child::before {
      content: none;
    }

    tr.goal-row td:nth-child(2)::before { content: "月"; }
    tr.goal-row td:nth-child(3)::before { content: "担当"; }
    tr.goal-row td:nth-child(4)::before { content: "6ヶ月平均"; }
    tr.goal-row td:nth-child(5)::before { content: "目標"; }
    tr.goal-row td:nth-child(6)::before { content: "実績"; }
    tr.goal-row td:nth-child(7)::before { content: "達成率"; }
    tr.goal-row td:nth-child(8)::before { content: "状況"; }
    tr.goal-row td:nth-child(9)::before { content: "更新"; }

    .goal-detail { max-width: none; }
    .progress { width: 100%; }
    .actions-cell,
    .action-btn { width: 100%; }

    .modal-backdrop.open {
      align-items: flex-end;
      padding: 0;
    }

    .modal {
      width: 100%;
      max-height: 92vh;
      border-radius: 12px 12px 0 0;
    }

    .modal-head,
    .modal-foot {
      padding: 12px;
    }

    .modal-foot {
      flex-wrap: wrap;
    }

    .modal-foot .btn {
      flex: 1 1 130px;
    }

function currentMonth(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function monthLabel(month) {
  const [y, m] = month.split('-');
  return `${y}年${Number(m)}月`;
}

function monthShortLabel(month) {
  if (!month || !month.includes('-')) return '-';
  const [, m] = month.split('-');
  return `${Number(m)}月`;
}

function addMonths(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function halfYearStart(month) {
  const [year, monthNumber] = month.split('-').map(Number);
  if (monthNumber >= 6 && monthNumber <= 11) return `${year}-06`;
  if (monthNumber === 12) return `${year}-12`;
  return `${year - 1}-12`;
}

function periodMonths(month) {
  const start = halfYearStart(month);
  return Array.from({ length: 6 }, (_, index) => addMonths(start, index));
}

function periodLabel(month) {
  const months = periodMonths(month);
  return `${monthLabel(months[0])}〜${monthLabel(months[months.length - 1])}`;
}

function periodFileLabel(month) {
  const months = periodMonths(month);
  return `${months[0]}_${months[months.length - 1]}`;
}

function blankHistory() {
  return Array.from({ length: HISTORY_MONTH_COUNT }, () => ({ label: '', value: '' }));
}

function normalizeHistory(history = []) {
  return blankHistory().map((blank, index) => {
    const item = history[index] || {};
    return {
      label: item.label || blank.label,
      value: item.value ?? blank.value
    };
  });
}

function parseNumber(value) {
  if (value === null || value === undefined) return null;
  const text = String(value).replace(/,/g, '').trim();
  if (text === '') return null;
  const n = Number(text);
  return Number.isFinite(n) ? n : null;
}

function canonicalGoalItem(item) {
  const text = String(item || '').trim();
  if (['一日平均来院数', '1日平均来院数', '１日平均来院数', '1日平均来院者数'].includes(text)) {
    return '一日平均来院数';
  }
  return text;
}

function canonicalPrivateMetricItem(item) {
  const text = String(item || '').trim();
  if (text === '自費売上' || text === '自費売上高') return '自費売上';
  if (text === '保険売上' || text === '保険売上高') return '保険売上';
  return text;
}

function privateMetricValue(month, item) {
  const itemKey = canonicalPrivateMetricItem(item);
  const metric = Object.values(allPrivateMetrics)
    .find(row => row.month === month && canonicalPrivateMetricItem(row.item) === itemKey);
  return parseNumber(metric?.value);
}

function calculatedSelfPayRateValue(month) {
  const selfPaySales = privateMetricValue(month, '自費売上');
  const insuranceSales = privateMetricValue(month, '保険売上');
  if (selfPaySales === null || insuranceSales === null || selfPaySales + insuranceSales <= 0) return '';
  return formatAverageValue((selfPaySales / (selfPaySales + insuranceSales)) * 100);
}

function actualValueForGoal(goal) {
  if (canonicalGoalItem(goal.item) !== '自費率') return goal.actualValue;
  return calculatedSelfPayRateValue(goal.month) || goal.actualValue;
}

function displayGoalItem(item) {
  return canonicalGoalItem(item);
}

function goalGroupKey(goal) {
  return [
    goal.department || '',
    canonicalGoalItem(goal.item),
    goal.unit || ''
  ].join('|');
}

function formatAverageValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return Math.abs(n - Math.round(n)) < 0.000001
    ? String(Math.round(n))
    : String(Number(n.toFixed(2)));
}

function actualGoalsForAverage(goal) {
  const baseMonth = goal.month || document.getElementById('monthFilter')?.value || currentMonth();
  const months = new Set(periodMonths(baseMonth));
  const key = goalGroupKey(goal);
  return Object.entries(allGoals)
    .map(([id, item]) => ({ id, ...item }))
    .filter(item => months.has(item.month || ''))
    .filter(item => goalGroupKey(item) === key)
    .map(item => {
      const actualValue = actualValueForGoal(item);
      return { ...item, actualValue, actualNumber: parseNumber(actualValue) };
    })
    .filter(item => item.actualNumber !== null)
    .sort((a, b) => (a.month || '').localeCompare(b.month || ''));
}

function computedAverage(goal) {
  const goals = actualGoalsForAverage(goal);
  if (!goals.length) return { value: '', history: [] };
  const average = goals.reduce((sum, item) => sum + item.actualNumber, 0) / goals.length;
  return {
    value: formatAverageValue(average),
    history: goals.map(item => ({
      label: monthShortLabel(item.month),
      value: item.actualValue
    }))
  };
}

function currentValueForDisplay(goal) {
  const computed = computedAverage(goal);
  return computed.value !== '' ? computed.value : goal.currentValue;
}

function historyForDisplay(goal) {
  const computed = computedAverage(goal);
  if (computed.history.length) return computed.history;
  return normalizeHistory(goal.history || []).filter(item => item.label || item.value !== '');
}

function fmtNumber(value, unit = '') {
  const n = parseNumber(value);
  if (n === null) return '-';
  const formatted = Math.abs(n) >= 1000
    ? n.toLocaleString('ja-JP', { maximumFractionDigits: 2 })
    : String(Number(n.toFixed(2)));
  return unit ? `${formatted}${unit}` : formatted;
}

function calcRate(goal) {
  const target = parseNumber(goal.targetValue);
  const actual = parseNumber(actualValueForGoal(goal));
  if (target === null || target === 0 || actual === null) return null;
  if (goal.direction === 'down') {
    if (actual <= 0) return 100;
    return Math.min(200, (target / actual) * 100);
  }
  return Math.min(200, (actual / target) * 100);
}

function goalStatus(goal) {
  const target = parseNumber(goal.targetValue);
  const actual = parseNumber(actualValueForGoal(goal));
  if (actual === null) return 'blank';
  if (target === null || target === 0) return 'noTarget';
  const rate = calcRate(goal);
  if (rate >= 100) return 'done';
  if (rate >= 80) return 'close';
  return 'behind';
}

function statusLabel(status) {
  return {
    done: '達成',
    close: 'あと少し',
    behind: '未達',
    noTarget: '目標未設定',
    blank: '実績未入力'
  }[status] || '-';
}

function filteredGoals() {
  const month = document.getElementById('monthFilter').value || currentMonth();
  const dept = document.getElementById('deptFilter').value;
  const status = document.getElementById('statusFilter').value;
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  return Object.entries(allGoals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => goal.month === month)
    .filter(goal => dept === 'all' || goal.department === dept)
    .filter(goal => status === 'all' || goalStatus(goal) === status)
    .filter(goal => {
      if (!query) return true;
      return [displayGoalItem(goal.item), goal.item, goal.detail, goal.note, goal.department, goal.owner]
        .filter(Boolean)
        .join(' ')
        .toLowerCase()
        .includes(query);
    })
    .sort((a, b) => {
      const depOrder = ['全体', '院長', '受付', 'DH', 'DA'];
      const depDiff = depOrder.indexOf(a.department) - depOrder.indexOf(b.department);
      if (depDiff) return depDiff;
      return displayGoalItem(a.item).localeCompare(displayGoalItem(b.item), 'ja');
    });
}

function monthGoals(month) {
  return Object.entries(allGoals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => goal.month === month);
}

function periodGoals(month) {
  const periodSet = new Set(periodMonths(month));
  return Object.entries(allGoals)
    .map(([id, goal]) => ({ id, ...goal }))
    .filter(goal => periodSet.has(goal.month || ''));
}

function render() {
  const month = document.getElementById('monthFilter').value || currentMonth();
  const goals = filteredGoals();
  const goalsForPeriod = periodGoals(month);
  const goalsForMonth = monthGoals(month);
  document.getElementById('listTitle').textContent = `${monthLabel(month)} 目標一覧`;
  document.getElementById('listSub').textContent = `${goals.length}件表示 / この月${goalsForMonth.length}件 / 半期${goalsForPeriod.length}件`;
  renderMonthBoard(month, goalsForPeriod, goalsForMonth);
  renderStats(goalsForPeriod);
  renderTable(goals, goalsForMonth.length);
}

function renderMonthBoard(month, periodGoals, monthGoals) {
  const blank = periodGoals.filter(g => goalStatus(g) === 'blank').length;
  const noTarget = periodGoals.filter(g => goalStatus(g) === 'noTarget').length;
  const done = periodGoals.filter(g => goalStatus(g) === 'done').length;
  const seedBtn = document.getElementById('seedBtn');
  document.getElementById('monthActionTitle').textContent = periodLabel(month);
  document.getElementById('monthActionSub').textContent = periodGoals.length
    ? `入力月: ${monthLabel(month)} / この月${monthGoals.length}件 / 期間内${periodGoals.length}件 / 未入力${blank}件 / 目標未設定${noTarget}件 / 達成${done}件`
    : `入力月: ${monthLabel(month)} / この半期の目標は未作成`;
  if (seedBtn) {
    seedBtn.textContent = monthGoals.length ? '標準項目を追加' : 'この月の標準項目を作成';
  }
}

function renderStats(goals) {
  const total = goals.length;
  const done = goals.filter(g => goalStatus(g) === 'done').length;
  const close = goals.filter(g => goalStatus(g) === 'close').length;
  const behind = goals.filter(g => goalStatus(g) === 'behind').length;
  const noTarget = goals.filter(g => goalStatus(g) === 'noTarget').length;
  const blank = goals.filter(g => goalStatus(g) === 'blank').length;
  const avgRates = goals.map(calcRate).filter(v => v !== null);
  const avg = avgRates.length ? avgRates.reduce((a, b) => a + b, 0) / avgRates.length : null;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">半期項目</div><div class="stat-value">${total}</div><div class="stat-note">集計期間の登録数</div></div>
    <div class="stat"><div class="stat-label">実績未入力</div><div class="stat-value" style="color:var(--amber)">${blank}</div><div class="stat-note">入力待ちの項目</div></div>
    <div class="stat"><div class="stat-label">達成</div><div class="stat-value" style="color:var(--green)">${done}</div><div class="stat-note">達成率100%以上</div></div>
    <div class="stat"><div class="stat-label">要確認</div><div class="stat-value" style="color:var(--coral)">${behind}</div><div class="stat-note">あと少し ${close} / 目標未設定 ${noTarget} / 平均 ${avg === null ? '-' : `${Math.round(avg)}%`}</div></div>`;
}

function renderTable(goals, monthTotal) {
  const wrap = document.getElementById('tableWrap');
  if (!monthTotal) {
    wrap.innerHTML = `
      <div class="empty">
        <strong>この月の目標は未登録です</strong>
        <div>管理者または院長は、入力月を選んで標準項目を作成できます。</div>
      </div>`;
    return;
  }

  if (!goals.length) {
    wrap.innerHTML = `
      <div class="empty">
        <strong>条件に合う目標がありません</strong>
        <div>検索条件を変更してください。</div>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th>月</th>
          <th>担当</th>
          <th>6ヶ月平均</th>
          <th>目標</th>
          <th>実績</th>
          <th>達成率</th>
          <th>状況</th>
          <th>更新</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${goals.map(goalRowHtml).join('')}
      </tbody>
    </table>`;
}

function goalRowHtml(goal) {
  const status = goalStatus(goal);
  const rate = calcRate(goal);
  const fill = rate === null ? 0 : Math.max(0, Math.min(100, rate));
  const deptClass = DEPARTMENT_CLASSES[goal.department] || 'all';
  const updated = goal.updatedAt ? new Date(goal.updatedAt).toLocaleDateString('ja-JP') : '-';
  const itemName = displayGoalItem(goal.item);
  const currentValue = currentValueForDisplay(goal);
  const actualValue = actualValueForGoal(goal);
  const hasActual = parseNumber(actualValue) !== null;
  const history = historyText(goal);
  return `
    <tr class="goal-row ${status}">
      <td>
        <div class="goal-main">
          <div class="goal-name">${escapeHtml(itemName || '')}</div>
          <div class="goal-detail">${escapeHtml(goal.detail || '')}</div>
          ${goal.note ? `<div class="goal-detail">メモ: ${escapeHtml(goal.note)}</div>` : ''}
        </div>
      </td>
      <td><span class="num">${escapeHtml(monthShortLabel(goal.month || ''))}</span></td>
      <td><span class="dept-pill ${deptClass}">${escapeHtml(goal.department || '-')}</span></td>
      <td><span class="num">${fmtNumber(currentValue, goal.unit)}</span><div class="goal-detail">${escapeHtml(history)}</div></td>
      <td><span class="num">${fmtNumber(goal.targetValue, goal.unit)}</span><div class="goal-detail">${goal.direction === 'down' ? '少ないほど達成' : '多いほど達成'}</div></td>
      <td>${hasActual ? `<span class="num">${fmtNumber(actualValue, goal.unit)}</span>` : '<span class="value-missing">未入力</span>'}</td>
      <td>
        <div class="progress">
          <span class="num">${rate === null ? '-' : `${Math.round(rate)}%`}</span>
          <div class="bar"><div class="bar-fill ${status}" style="width:${fill}%"></div></div>
        </div>
      </td>
      <td><span class="status-pill ${status}">${statusLabel(status)}</span></td>
      <td><div>${escapeHtml(updated)}</div><div class="goal-detail">${escapeHtml(goal.updatedBy || goal.createdBy || '')}</div></td>
      <td>
        <div class="actions-cell">
          <button class="icon-btn action-btn" onclick="openGoalModal('${goal.id}')" title="${isEditor() ? actionLabel(status) : '詳細'}">${isEditor() ? actionLabel(status) : '詳細'}</button>
        </div>
      </td>
    </tr>`;
}

function actionLabel(status) {
  return status === 'blank' ? '入力' : '編集';
}

function historyText(goal) {
  const history = historyForDisplay(goal);
  const items = Array.from({ length: HISTORY_MONTH_COUNT }, (_, index) => index + 1).map(i => {
    const label = history?.[i - 1]?.label || '';
    const value = history?.[i - 1]?.value ?? '';
    if (!label && value === '') return '';
    return `${label || `${i}ヶ月前`}: ${fmtNumber(value, goal.unit)}`;
  }).filter(Boolean);
  return items.join(' / ');
}

function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function importItemOptions(selectedItem) {
  const selected = canonicalGoalItem(selectedItem);
  return TEMPLATE_ITEMS
    .map(item => `<option value="${escapeHtml(item.item)}"${canonicalGoalItem(item.item) === selected ? ' selected' : ''}>${escapeHtml(displayGoalItem(item.item))}</option>`)
    .join('');
}

function setImportStatus(message, type = '') {
  const el = document.getElementById('importStatus');
  if (!el) return;
  el.textContent = message;
  el.className = `import-status ${type}`.trim();
}

function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  const existing = document.querySelector(`script[data-import-lib="${globalName}"]`);
  if (existing?.dataset.ready === '1') return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const script = existing || document.createElement('script');
    script.src = src;
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.dataset.importLib = globalName;
    script.onload = () => {
      script.dataset.ready = '1';
      window[globalName] ? resolve(window[globalName]) : reject(new Error(`${globalName}を読み込めませんでした`));
    };
    script.onerror = () => reject(new Error(`${globalName}の読み込みに失敗しました`));
    if (!existing) document.head.appendChild(script);
  });
}

function loadPdfJs() {
  if (!pdfJsLoader) {
    pdfJsLoader = loadScriptOnce(PDFJS_URL, 'pdfjsLib').then(pdfjs => {
      pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
      return pdfjs;
    });
  }
  return pdfJsLoader;
}

function loadTesseract() {
  if (!tesseractLoader) {
    tesseractLoader = loadScriptOnce(TESSERACT_URL, 'Tesseract');
  }
  return tesseractLoader;
}

function japaneseTextScore(text) {
  const source = String(text || '');
  const keywords = ['月計表', '合計', '患者数', '再初診', '新患', '診療報酬', '自費', '物販', '保険種別', 'レセプト'];
  return keywords.reduce((score, keyword) => score + (source.includes(keyword) ? 2 : 0), 0)
    + (source.match(/[ぁ-んァ-ン一-龥]/g) || []).length / 40
    - (source.match(/[\u0080-\u009f�]/g) || []).length / 8;
}

function repairLegacyPdfText(text) {
  const source = String(text || '');
  if (!source || typeof TextDecoder === 'undefined') return source;
  const legacyChars = (source.match(/[\u0080-\u009f]/g) || []).length;
  if (legacyChars < 6) return source;
  try {
    const bytes = [];
    for (const ch of source) {
      const code = ch.charCodeAt(0);
      if (code <= 0xff) {
        bytes.push(code);
      } else {
        bytes.push(...new TextEncoder().encode(ch));
      }
    }
    const decoded = new TextDecoder('shift_jis').decode(new Uint8Array(bytes));
    return japaneseTextScore(decoded) > japaneseTextScore(source) + 2 ? decoded : source;
  } catch (error) {
    return source;
  }
}

async function readPdfText(file) {
  const pdfjs = await loadPdfJs();
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
    setImportStatus(`PDF読み取り中 ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    pages.push(content.items.map(item => item.str).join('\n'));
  }
  const text = repairLegacyPdfText(pages.join('\n\n').trim());
  if (text.length >= 20) return text;
  setImportStatus('PDFに文字データが少ないためOCRに切り替えます');
  return readPdfByOcr(pdf);
}

async function readPdfByOcr(pdf) {
  const Tesseract = await loadTesseract();
  const pages = [];
  const maxPages = Math.min(pdf.numPages, 5);
  for (let pageNo = 1; pageNo <= maxPages; pageNo++) {
    setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages}`);
    const page = await pdf.getPage(pageNo);
    const viewport = page.getViewport({ scale: 1.8 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const result = await Tesseract.recognize(blob, 'jpn+eng', {
      logger: info => {
        if (info.status === 'recognizing text') {
          setImportStatus(`PDF画像OCR中 ${pageNo}/${maxPages} ${Math.round((info.progress || 0) * 100)}%`);
        }
      }
    });
    pages.push(result.data.text || '');
  }
  return pages.join('\n\n');
}

async function readImageText(file) {
  const Tesseract = await loadTesseract();
  const result = await Tesseract.recognize(file, 'jpn+eng', {
    logger: info => {
      if (info.status) {
        const pct = typeof info.progress === 'number' ? ` ${Math.round(info.progress * 100)}%` : '';
        setImportStatus(`OCR中: ${info.status}${pct}`);
      }
    }
  });
  return result.data.text || '';
}

async function extractTextFromFile(file) {
  if (!file) return '';
  if (file.size > 25 * 1024 * 1024) {
    throw new Error('25MB以下のファイルを選択してください');
  }
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf' || name.endsWith('.pdf')) {
    return readPdfText(file);
  }
  if (file.type.startsWith('image/')) {
    return readImageText(file);
  }
  if (file.type.startsWith('text/') || name.endsWith('.txt')) {
    return file.text();
  }
  throw new Error('PDF、画像、テキストファイルに対応しています');
}

function normalizeImportText(text) {
  return String(text || '')
    .normalize('NFKC')
    .replace(/\u3000/g, ' ')
    .replace(/[，、]/g, ',')
    .replace(/[：]/g, ':');
}

function compactForMatch(text) {
  return normalizeImportText(text).toLowerCase().replace(/\s+/g, '');
}

function findImportItemForLine(line) {
  const normalized = compactForMatch(line);
  const matches = [];
  for (const config of IMPORT_ITEM_ALIASES) {
    for (const alias of config.aliases) {
      const key = compactForMatch(alias);
      if (key && normalized.includes(key)) {
        matches.push({ item: config.item, weight: key.length });
      }
    }
  }
  matches.sort((a, b) => b.weight - a.weight);
  return matches[0]?.item || '';
}

function parseImportNumber(text, item, preferLast = false) {
  const source = normalizeImportText(text).replace(/,/g, '');
  const matches = [...source.matchAll(/-?\d+(?:\.\d+)?/g)];
  if (!matches.length) return '';
  const match = preferLast ? matches[matches.length - 1] : matches[0];
  let value = Number(match[0]);
  if (!Number.isFinite(value)) return '';
  if (item === 'キャンセル率' && value > 0 && value < 1) value *= 100;
  return Math.abs(value - Math.round(value)) < 0.000001
    ? String(Math.round(value))
    : String(Number(value.toFixed(2)));
}

function parseImportNumberAfterLabel(line, labelPattern, item) {
  const normalized = normalizeImportText(line);
  const match = normalized.match(labelPattern);
  if (!match) return '';
  return parseImportNumber(normalized.slice(match.index + match[0].length), item, true);
}

function parseMonthValue(block, month, item) {
  const monthNumber = Number(month.split('-')[1]);
  if (!monthNumber) return '';
  const text = normalizeImportText(block);
  const pattern = new RegExp(`(^|[^0-9])${monthNumber}\\s*月\\s*:?\\s*([^\\n]+)`, 'g');
  let match;
  let latest = '';
  while ((match = pattern.exec(text))) {
    latest = parseImportNumber(match[2], item) || latest;
  }
  return latest;
}

function parseTargetValue(block, item) {
  const lines = normalizeImportText(block).split(/\n+/).map(line => line.trim()).filter(Boolean);
  const targetLine = lines.find(line => /目標|target/i.test(line));
  if (targetLine) return parseImportNumberAfterLabel(targetLine, /目標(?:\s*数値)?|target/i, item);
  const joined = lines.join(' ');
  const match = joined.match(/目標(?:\s*数値)?[^0-9-]{0,16}(-?\d[\d,]*(?:\.\d+)?)/);
  return match ? parseImportNumber(match[1], item) : '';
}

function parseActualValue(block, month, item) {
  const monthValue = parseMonthValue(block, month, item);
  if (monthValue) return monthValue;
  const lines = normalizeImportText(block).split(/\n+/).map(line => line.trim()).filter(Boolean);
  const actualLine = lines.find(line => /実績|結果/.test(line));
  if (actualLine) return parseImportNumberAfterLabel(actualLine, /実績|結果|actual/i, item);
  return '';
}

function formatImportValue(value, digits = 2) {
  if (value === null || value === undefined || value === '') return '';
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return Math.abs(n - Math.round(n)) < 0.000001
    ? String(Math.round(n))
    : String(Number(n.toFixed(digits)));
}

function numbersFromImportLine(line) {
  return [...normalizeImportText(line).matchAll(/-?\d[\d,]*(?:\.\d+)?/g)]
    .map(match => Number(match[0].replace(/,/g, '')))
    .filter(Number.isFinite);
}

function inferImportMonthFromText(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  let match = text.match(/令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月/);
  if (match) {
    const year = 2018 + Number(match[1]);
    return `${year}-${String(Number(match[2])).padStart(2, '0')}`;
  }
  match = text.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月/);
  if (match) return `${match[1]}-${String(Number(match[2])).padStart(2, '0')}`;
  return '';
}

function parseMonthlyReport(rawText) {
  const text = normalizeImportText(repairLegacyPdfText(rawText));
  if (!text.includes('月計表')) return null;
  const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
  const totalLines = lines
    .filter(line => /^合計\s/.test(line))
    .map(line => ({ line, nums: numbersFromImportLine(line) }));
  const dailyTotal = totalLines.find(entry => entry.nums.length >= 15);
  if (!dailyTotal) return null;
  const insuranceTotal = totalLines.find(entry => /\([^)]*\)/.test(entry.line) && entry.nums.length >= 7)
    || totalLines.find(entry => entry !== dailyTotal && entry.nums.length >= 7);
  const treatmentDays = lines.filter(line => /^\d{1,2}\([^)]+\)\s+\d/.test(line)).length;
  const daily = dailyTotal.nums;
  const insurance = insuranceTotal?.nums || [];
  const insurancePoints = insurance[2] ?? daily[4] ?? null;
  const insuranceSales = insurance[4] ?? (Number.isFinite(insurancePoints) ? insurancePoints * 10 : null);
  return {
    patientTotal: daily[0],
    reportRevisit: daily[1],
    newPatients: daily[2],
    selfPaySales: daily[10],
    productSales: daily[12],
    insurancePoints,
    insuranceSales,
    receiptCount: insurance[0],
    averagePoints: insurance[3],
    treatmentDays,
    sourceText: `${dailyTotal.line}${insuranceTotal ? `\n${insuranceTotal.line}` : ''}`
  };
}

function buildMonthlyReportGoalCandidates(rawText, month, apoInitialCount) {
  const report = parseMonthlyReport(rawText);
  if (!report) return [];
  const candidates = [];
  const sourceText = `月計表合計\n${report.sourceText}`.slice(0, 240);
  const initialCount = Number(apoInitialCount);
  if (apoInitialCount !== null && apoInitialCount !== '' && Number.isFinite(initialCount)) {
    candidates.push({
      enabled: true,
      month,
      item: '初診',
      targetValue: '',
      actualValue: formatImportValue(initialCount, 0),
      sourceText: `アポツール初診数 ${formatImportValue(initialCount, 0)}`
    });
    if (Number.isFinite(report.newPatients) && Number.isFinite(report.reportRevisit)) {
      candidates.push({
        enabled: true,
        month,
        item: '再初診',
        targetValue: '',
        actualValue: formatImportValue(report.newPatients - initialCount + report.reportRevisit, 0),
        sourceText: `月計表 新患${report.newPatients} - アポツール初診${formatImportValue(initialCount, 0)} + 月計表 再初診${report.reportRevisit}`
      });
    }
  }
  if (Number.isFinite(report.patientTotal) && report.treatmentDays > 0) {
    candidates.push({
      enabled: true,
      month,
      item: '一日平均来院数',
      targetValue: '',
      actualValue: formatImportValue(report.patientTotal / report.treatmentDays, 2),
      sourceText: `月間延べ患者数${report.patientTotal} ÷ 診療日数${report.treatmentDays}`
    });
  }
  if (Number.isFinite(report.selfPaySales) && Number.isFinite(report.insuranceSales) && report.selfPaySales + report.insuranceSales > 0) {
    candidates.push({
      enabled: true,
      month,
      item: '自費率',
      targetValue: '',
      actualValue: formatImportValue((report.selfPaySales / (report.insuranceSales + report.selfPaySales)) * 100, 2),
      sourceText
    });
  }
  return candidates;
}

function buildImportCandidates(rawText, month, apoInitialCount = null) {
  const monthlyReportCandidates = buildMonthlyReportGoalCandidates(rawText, month, apoInitialCount);
  if (monthlyReportCandidates.length) return monthlyReportCandidates;

  const text = normalizeImportText(repairLegacyPdfText(rawText));
  const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
  const markers = [];
  lines.forEach((line, index) => {
    const item = findImportItemForLine(line);
    if (item) markers.push({ index, item });
  });

  const usedItems = new Set();
  const candidates = [];
  markers.forEach((marker, markerIndex) => {
    if (usedItems.has(marker.item)) return;
    const nextMarker = markers.slice(markerIndex + 1).find(next => next.index > marker.index);
    const end = nextMarker ? nextMarker.index : lines.length;
    const block = lines.slice(marker.index, end).join('\n');
    const targetValue = parseTargetValue(block, marker.item);
    const actualValue = parseActualValue(block, month, marker.item);
    usedItems.add(marker.item);
    candidates.push({
      enabled: Boolean(targetValue || actualValue),
      month,
      item: marker.item,
      targetValue,
      actualValue,
      sourceText: block.slice(0, 240)
    });
  });
  return candidates;
}

function renderImportCandidates() {
  const wrap = document.getElementById('importCandidates');
  if (!importCandidates.length) {
    wrap.innerHTML = '<div class="empty">候補が見つかりません。読み取りテキストを修正してから候補作成してください。</div>';
    return;
  }
  wrap.innerHTML = importCandidates.map((candidate, index) => `
    <div class="import-candidate">
      <label>
        <span class="import-candidate-label">保存</span>
        <input type="checkbox" ${candidate.enabled ? 'checked' : ''} onchange="updateImportCandidate(${index}, 'enabled', this.checked)">
      </label>
      <div>
        <span class="import-candidate-label">対象月</span>
        <input type="month" value="${escapeHtml(candidate.month)}" onchange="updateImportCandidate(${index}, 'month', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">項目</span>
        <select onchange="updateImportCandidate(${index}, 'item', this.value)">${importItemOptions(candidate.item)}</select>
      </div>
      <div>
        <span class="import-candidate-label">目標</span>
        <input type="text" inputmode="decimal" value="${escapeHtml(candidate.targetValue)}" onchange="updateImportCandidate(${index}, 'targetValue', this.value)">
      </div>
      <div>
        <span class="import-candidate-label">実績</span>
        <input type="text" inputmode="decimal" value="${escapeHtml(candidate.actualValue)}" onchange="updateImportCandidate(${index}, 'actualValue', this.value)">
      </div>
      <div class="import-raw">${escapeHtml(candidate.sourceText || '')}</div>
    </div>`).join('');
}

function findExistingGoal(month, item) {
  const itemKey = canonicalGoalItem(item);
  const entry = Object.entries(allGoals).find(([, goal]) => goal.month === month && canonicalGoalItem(goal.item) === itemKey);
  return entry ? { id: entry[0], ...entry[1] } : null;
}

function templateForItem(item) {
  const itemKey = canonicalGoalItem(item);
  return TEMPLATE_ITEMS.find(template => canonicalGoalItem(template.item) === itemKey) || {
    department: '全体',
    item: itemKey,
    unit: '',
    direction: 'up',
    detail: ''
  };
}

window.openImportModal = function() {
  if (!isEditor()) return;
  document.getElementById('importMonth').value = document.getElementById('monthFilter').value || currentMonth();
  document.getElementById('importApoInitial').value = '';
  document.getElementById('importSaveBtn').disabled = false;
  setImportStatus('PDFは文字抽出、写真やスキャンPDFはOCRで読み取ります。');
  document.getElementById('importModal').classList.add('open');
};

window.closeImportModal = function() {
  document.getElementById('importModal').classList.remove('open');
};

window.handleImportFile = async function(file) {
  if (!file || !isEditor()) return;
  importFileMeta = {
    name: file.name,
    type: file.type || 'unknown',
    size: file.size
  };
  try {
    setImportStatus('読み取りを開始しました');
    document.getElementById('importRawText').value = '';
    importCandidates = [];
    renderImportCandidates();
    const text = await extractTextFromFile(file);
    document.getElementById('importRawText').value = text.trim();
    const inferredMonth = inferImportMonthFromText(text);
    if (inferredMonth) document.getElementById('importMonth').value = inferredMonth;
    setImportStatus(`読み取り完了: ${file.name}`, 'success');
    analyzeImportText();
  } catch (error) {
    setImportStatus(`読み取りに失敗しました: ${error.message}`, 'error');
  }
};

window.analyzeImportText = function() {
  const rawText = document.getElementById('importRawText').value;
  const month = document.getElementById('importMonth').value || document.getElementById('monthFilter').value || currentMonth();
  const apoInitialCount = parseNumber(document.getElementById('importApoInitial').value);
  importCandidates = buildImportCandidates(rawText, month, apoInitialCount);
  renderImportCandidates();
  const monthlyReportNeedsInitial = parseMonthlyReport(rawText) && !(apoInitialCount !== null && Number.isFinite(Number(apoInitialCount)));
  const note = monthlyReportNeedsInitial ? ' 初診・再初診にはアポツール初診数が必要です。' : '';
  setImportStatus(`${importCandidates.length}件の候補を作成しました。保存前に数値を確認してください。${note}`, importCandidates.length ? 'success' : 'error');
};

window.updateImportCandidate = function(index, field, value) {
  if (!importCandidates[index]) return;
  importCandidates[index][field] = value;
};

window.setAllImportCandidates = function(enabled) {
  importCandidates = importCandidates.map(candidate => ({ ...candidate, enabled }));
  renderImportCandidates();
};

window.saveImportCandidates = async function() {
  if (!isEditor()) return;
  const selected = importCandidates
    .map(candidate => ({
      ...candidate,
      month: String(candidate.month || '').trim(),
      item: canonicalGoalItem(candidate.item),
      targetValue: String(candidate.targetValue ?? '').trim(),
      actualValue: String(candidate.actualValue ?? '').trim()
    }))
    .filter(candidate => candidate.enabled && candidate.month && candidate.item && (candidate.targetValue || candidate.actualValue));
  if (!selected.length) {
    setImportStatus('保存対象の候補がありません', 'error');
    return;
  }

  const saveBtn = document.getElementById('importSaveBtn');
  saveBtn.disabled = true;
  try {
    let saved = 0;
    const months = new Set();
    for (const candidate of selected) {
      const existing = findExistingGoal(candidate.month, candidate.item);
      const template = templateForItem(candidate.item);
      const data = {
        ...(existing || {}),
        month: candidate.month,
        department: existing?.department || template.department,
        item: canonicalGoalItem(candidate.item),
        unit: existing?.unit || template.unit,
        direction: existing?.direction || template.direction,
        detail: existing?.detail || template.detail,
        currentValue: existing?.currentValue ?? '',
        targetValue: candidate.targetValue || existing?.targetValue || '',
        actualValue: candidate.actualValue || existing?.actualValue || '',
        owner: existing?.owner || currentUser.name,
        note: existing?.note || '',
        history: normalizeHistory(existing?.history || []),
        updatedAt: Date.now(),
        updatedBy: currentUser.name
      };
      delete data.id;
      if (existing) {
        await set(ref(db, `${DB_PATH}/${existing.id}`), data);
      } else {
        await push(ref(db, DB_PATH), {
          ...data,
          createdAt: Date.now(),
          createdBy: currentUser.name
        });
      }
      saved++;
      months.add(candidate.month);
    }

    await push(ref(db, IMPORT_HISTORY_PATH), {
      fileName: importFileMeta?.name || '',
      fileType: importFileMeta?.type || '',
      fileSize: importFileMeta?.size || 0,
      importedAt: Date.now(),
      importedBy: currentUser.name,
      importedRows: saved,
      months: Array.from(months).sort(),
      source: 'goal-manager-upload'
    });

    const firstMonth = Array.from(months).sort()[0];
    if (firstMonth) document.getElementById('monthFilter').value = firstMonth;
    closeImportModal();
    showToast(`${saved}件を取り込みました`);
    render();
  } catch (error) {
    setImportStatus(`保存に失敗しました: ${error.message}`, 'error');
  } finally {
    saveBtn.disabled = false;
  }
};

window.openGoalModal = function(id = null) {
  editingId = id;
  const goal = id ? allGoals[id] : null;
  document.getElementById('modalTitle').textContent = goal ? (isEditor() ? '目標を編集' : '目標の詳細') : '目標を登録';
  document.getElementById('deleteBtn').style.display = goal && isEditor() ? 'inline-flex' : 'none';
  document.getElementById('saveBtn').style.display = isEditor() ? 'inline-flex' : 'none';

  const month = document.getElementById('monthFilter').value || currentMonth();
  setFormValue('fMonth', goal?.month || month);
  setFormValue('fDepartment', goal?.department || '全体');
  setFormValue('fItem', goal ? displayGoalItem(goal.item) : '');
  setFormValue('fUnit', goal?.unit || '');
  setFormValue('fDetail', goal?.detail || '');
  setFormValue('fDirection', goal?.direction || 'up');
  setFormValue('fCurrent', goal ? currentValueForDisplay({ id, ...goal }) : '');
  setFormValue('fTarget', goal?.targetValue ?? '');
  setFormValue('fActual', goal ? actualValueForGoal({ id, ...goal }) : '');
  setFormValue('fOwner', goal?.owner || currentUser.name);
  setFormValue('fNote', goal?.note || '');

  const history = goal ? normalizeHistory(historyForDisplay({ id, ...goal })) : blankHistory();
  for (let i = 1; i <= HISTORY_MONTH_COUNT; i++) {
    setFormValue(`fHistoryLabel${i}`, history[i - 1]?.label || '');
    setFormValue(`fHistoryValue${i}`, history[i - 1]?.value ?? '');
  }

  document.querySelectorAll('#goalModal input, #goalModal select, #goalModal textarea').forEach(el => {
    el.disabled = !isEditor();
  });
  document.getElementById('goalModal').classList.add('open');
};

function setFormValue(id, value) {
  document.getElementById(id).value = value;
}

window.closeGoalModal = function() {
  document.getElementById('goalModal').classList.remove('open');
  editingId = null;
};

window.closeModalOnBackdrop = function(event) {
  if (event.target.id === 'goalModal') closeGoalModal();
  if (event.target.id === 'importModal') closeImportModal();
};

window.saveGoal = async function() {
  if (!isEditor() || saving) return;
  const item = canonicalGoalItem(document.getElementById('fItem').value);
  if (!item) { showToast('項目を入力してください'); return; }
  const month = document.getElementById('fMonth').value;
  if (!month) { showToast('対象月を選択してください'); return; }

  const data = {
    month,
    department: document.getElementById('fDepartment').value,
    item,
    unit: document.getElementById('fUnit').value.trim(),
    detail: document.getElementById('fDetail').value.trim(),
    direction: document.getElementById('fDirection').value,
    currentValue: document.getElementById('fCurrent').value.trim(),
    targetValue: document.getElementById('fTarget').value.trim(),
    actualValue: document.getElementById('fActual').value.trim(),
    owner: document.getElementById('fOwner').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    history: Array.from({ length: HISTORY_MONTH_COUNT }, (_, index) => index + 1).map(i => ({
      label: document.getElementById(`fHistoryLabel${i}`).value.trim(),
      value: document.getElementById(`fHistoryValue${i}`).value.trim()
    })),
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };

  saving = true;
  document.getElementById('saveBtn').disabled = true;
  try {
    if (editingId) {
      const existing = allGoals[editingId] || {};
      await set(ref(db, `${DB_PATH}/${editingId}`), { ...existing, ...data });
      showToast('目標を更新しました');
    } else {
      await push(ref(db, DB_PATH), {
        ...data,
        createdAt: Date.now(),
        createdBy: currentUser.name
      });
      showToast('目標を登録しました');
    }
    document.getElementById('monthFilter').value = month;
    closeGoalModal();
  } catch(e) {
    showToast('保存に失敗しました: ' + e.message);
  } finally {
    saving = false;
    document.getElementById('saveBtn').disabled = false;
  }
};

window.deleteGoal = async function() {
  if (!isEditor() || !editingId) return;
  if (!confirm('この目標を削除しますか？')) return;
  try {
    await remove(ref(db, `${DB_PATH}/${editingId}`));
    closeGoalModal();
    showToast('削除しました');
  } catch(e) {
    showToast('削除に失敗しました: ' + e.message);
  }
};

window.seedTemplates = async function() {
  if (!isEditor()) return;
  const month = document.getElementById('monthFilter').value || currentMonth();
  const existing = monthGoals(month);
  if (existing.length) {
    if (!confirm(`${monthLabel(month)}には既に${existing.length}件あります。標準項目を追加しますか？`)) return;
  } else if (!confirm(`${monthLabel(month)}の標準項目を作成しますか？`)) {
    return;
  }

  try {
    for (const template of TEMPLATE_ITEMS) {
      await push(ref(db, DB_PATH), {
        ...template,
        month,
        currentValue: template.currentValue ?? '',
        targetValue: template.targetValue ?? '',
        actualValue: '',
        owner: currentUser.name,
        note: '',
        history: normalizeHistory(template.history),
        createdAt: Date.now(),
        createdBy: currentUser.name,
        updatedAt: Date.now(),
        updatedBy: currentUser.name
      });
    }
    showToast('標準項目を作成しました');
  } catch(e) {
    showToast('標準項目の作成に失敗しました: ' + e.message);
  }
};

window.exportCSV = function() {
  const month = document.getElementById('monthFilter').value || currentMonth();
  const goals = filteredGoals();
  if (!goals.length) { showToast('出力する目標がありません'); return; }
  const headers = [
    '集計期間','対象月','担当区分','項目','詳細','6ヶ月平均',
    '6ヶ月内訳1','6ヶ月内訳2','6ヶ月内訳3','6ヶ月内訳4','6ヶ月内訳5','6ヶ月内訳6',
    '目標数値','実績数値','達成率','状況','単位','判定方向','入力担当','メモ','更新者','更新日'
  ];
  const rows = goals.map(goal => {
    const rate = calcRate(goal);
    return [
      periodLabel(month),
      goal.month,
      goal.department,
      displayGoalItem(goal.item),
      goal.detail,
      currentValueForDisplay(goal),
      ...Array.from({ length: HISTORY_MONTH_COUNT }, (_, index) => historyCsvValue(goal, index)),
      goal.targetValue,
      actualValueForGoal(goal),
      rate === null ? '' : `${Math.round(rate)}%`,
      statusLabel(goalStatus(goal)),
      goal.unit,
      goal.direction === 'down' ? '少ないほど達成' : '多いほど達成',
      goal.owner,
      goal.note,
      goal.updatedBy || goal.createdBy || '',
      goal.updatedAt ? new Date(goal.updatedAt).toLocaleDateString('ja-JP') : ''
    ];
  });

  const csv = [headers, ...rows]
    .map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `半期目標_${periodFileLabel(month)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function historyCsvValue(goal, index) {
  const item = historyForDisplay(goal)?.[index];
  if (!item) return '';
  return `${item.label || ''}:${item.value ?? ''}`;
}

window.sendLineWorksSummary = async function() {
  if (!isEditor()) return;
  const month = document.getElementById('monthFilter').value || currentMonth();
  const goals = periodGoals(month);
  if (!goals.length) { showToast('通知する目標がありません'); return; }
  const done = goals.filter(g => goalStatus(g) === 'done');
  const behind = goals.filter(g => goalStatus(g) === 'behind');
  const noTarget = goals.filter(g => goalStatus(g) === 'noTarget');
  const blank = goals.filter(g => goalStatus(g) === 'blank');
  const avgRates = goals.map(calcRate).filter(v => v !== null);
  const avg = avgRates.length ? Math.round(avgRates.reduce((a, b) => a + b, 0) / avgRates.length) : '-';
  const lowLines = behind.slice(0, 5).map(g => {
    const rate = calcRate(g);
    return `・${monthShortLabel(g.month)} ${g.item}: ${rate === null ? '-' : Math.round(rate) + '%'}（実績 ${fmtNumber(actualValueForGoal(g), g.unit)} / 目標 ${fmtNumber(g.targetValue, g.unit)}）`;
  });
  const text = [
    `【半期目標】${periodLabel(month)} 達成状況`,
    `入力月: ${monthLabel(month)}`,
    `登録: ${goals.length}件`,
    `達成: ${done.length}件`,
    `未達: ${behind.length}件`,
    `目標未設定: ${noTarget.length}件`,
    `実績未入力: ${blank.length}件`,
    `平均達成率: ${avg}%`,
    lowLines.length ? '\n要確認:\n' + lowLines.join('\n') : '',
    `\n送信者: ${currentUser.name}`
  ].filter(Boolean).join('\n');

  try {
    const res = await fetch(NOTIFY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    showToast('LINE WORKSに通知しました');
  } catch(e) {
    showToast('通知に失敗しました: ' + e.message);
  }
};

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

window.render = render;

init();
