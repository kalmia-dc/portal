<!doctype html>
<html lang="ja">
<head>

<meta name="robots" content="noindex,nofollow"><title>就業規則｜カルミア院内ポータル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#243d33;font-family:"Yu Gothic UI",Meiryo,sans-serif;line-height:1.7}main{max-width:1080px;margin:auto;padding:24px 20px}a{color:#176b4b}h1{margin:18px 0 6px;font-size:1.7rem}.card{background:white;border:1px solid #d2e3da;border-radius:16px;padding:24px;margin:20px 0}.version{color:#52685c;margin:0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.button{display:inline-block;border:1px solid #176b4b;border-radius:10px;padding:10px 18px;text-decoration:none;background:#176b4b;color:white;font:inherit;cursor:pointer}.secondary{background:white;color:#176b4b}iframe{display:block;width:100%;height:72vh;min-height:400px;border:1px solid #d2e3da;border-radius:8px}.error{color:#a32c23}[hidden]{display:none!important}small{display:block;color:#52685c}@media(max-width:600px){main{padding:16px 12px}.card{padding:18px 14px}.actions .button{width:100%;text-align:center}iframe{height:60vh;min-height:320px}}
</style>
</head>
<body>
<main id="content" hidden>
<a id="home" href="./index.html">← ポータルへ戻る</a>
<h1>就業規則</h1>
<p class="version">従業員就業規則 · 2025年8月1日改訂（第14版）</p>
<section class="card" aria-label="就業規則の閲覧">

<div id="viewer" hidden>
<div class="actions" style="align-items:center"><button id="previousPage" class="button secondary">前のページ</button><span id="pageNumber" aria-live="polite"></span><button id="nextPage" class="button secondary">次のページ</button></div>
<canvas id="pdfCanvas" style="display:block;width:100%;height:auto;border:1px solid #d2e3da" aria-label="就業規則のページ画像"></canvas>
</div>
</section>
</main>
